# Profil: mise FreeRun na SKUTECNEM HW (Orange Pi).
# Spusteni na Pi:  ./ARBot config=config/pi-freerun.cfg
#
# Zapisuji se jen hodnoty ODLISNE od vychozich - uplny vycet vsech parametru
# i jejich puvodu je v panelu Tools -> Konfigurace. Prikazova radka tenhle soubor
# PREBIJI, takze na jeden beh jde parametr zmenit bez editace profilu:
#   ./ARBot config=config/pi-freerun.cfg freerunlook=4

# --- Mise ---------------------------------------------------------------------
# Jizda v PRAVE POLOVINE detekovaneho koridoru; prekazkam se vyhyba lokalni mapa
# (occupancy grid + A*). Kdyz koridor neni, drzi kurz. Konci JEN zastavenim
# obsluhou - nouzovym zastavenim nebo z UI. Viz doc/mission-freerun.md.
mission=freerun

# --- Bezpecnost ---------------------------------------------------------------
# Strop rychlosti jizdy [m/s]. Prenese se do Profile.MaxAllowedSpeed pri startu,
# takze plati pro CELE rizeni naraz: driver motoru, rychlostni profil i rychlostni
# obalku lokalniho planovace - ne jen pro misi.
#
# 0.1 m/s je ZAMERNE DEFENZIVNI hodnota pro prvni jizdy na zeleze (v kodu je 1.2).
# Krokem chuze je to asi 1/10 - robot se da dohnat a zastavit rukou. Zvysovat az
# kdyz je videt, ze koridor i vyhybani funguji.
maxspeed=1

# --- Bezobsluzny start --------------------------------------------------------
# Spusti rezim Run sam po startu aplikace (po pripraveni HW a kratkem ustaleni),
# takze se v UI nemusi nic klikat - na zarizeni pouzitem pres SSH neni co klikat.
#
# !!! POZOR !!!  S mission=freerun to znamena, ze se ROBOT ROZJEDE SAM, jakmile
# aplikace nastartuje, a bez dalsiho pokynu. Zastavi ho jen NOUZOVE ZASTAVENI nebo
# Stop v UI. Nez se profil pousti, ma byt nouzove zastaveni v ruce.
#
# Na jeden beh jde autostart vypnout z prikazove radky, bez editace profilu:
#   ./ARBot config=config/pi-freerun.cfg autorun=false
autorun=true

# --- Diagnostika --------------------------------------------------------------
# Zaznam behu: 'true' zalozi records/yyyyMMdd-HHmmss.rec (tamtez a pod tymz jmenem
# jako tlacitko "Run + zaznam" v UI). Bez zaznamu nejde beh potom rozebrat pres
# ARBot.Analyze freerun, a na zarizeni se pousti pres SSH, kde neni co klikat.
# Misto 'true' jde zadat i cestu k .rec souboru.
record=true

# ------------------------------------------------------------------------------
# CO SE ZAMERNE NENASTAVUJE - a proc. Tohle je hlavni obsah profilu: u kazdeho
# z tehle parametru se nabizi ho zapnout a byla by to chyba.
# ------------------------------------------------------------------------------
#
# map=        FreeRun mapu NEPOTREBUJE (zadna .osm, zadna trasa, zadny cil) -
#             koridor si bere z kamery. S mapou by se navic zalozila globalni
#             navigace, ktera by mrkev prepisovala.
#
# corridor=   NEZAPINAT kvuli FreeRunu. Tenhle parametr zapina HRANOVOU
#             LOKALIZACI (poloha a kurz z okraju koridoru proti mape), ktera
#             mapu vyzaduje. Mise ma vlastni CorridorSource a na tomhle stupni
#             nezavisi - viz ARBotRuntime, case "freerun".
#
# mapcorr=    Dtto - korelace occupancy gridu s mapou. Bez mapy nema co delat
#             a stoji cele jadro.
#
# start=      Bez mapy neni z ceho polohu hadat, takze pocatek ENU roviny i
#             polohu zalozi prvni pouzitelny GPS fix. Zadavat start=lat,lon,kurz
#             ma smysl jen kdyz se opravdu vi, kam se robot postavil.
#
# virtualhw=  Zustava false = zakladaji se SKUTECNE senzory. Simulacni profil
#             je vedle jako simulace-freerun.cfg.
#
# no_uart=    Zustava false = IMU, GPS i motor se zakladaji. Seriove porty se na
#             ARM64 berou z /dev/serial/by-id a jsou v kodu (viz doc/hardware.md),
#             takze UartAHRS=/UartGPS=/UartMotor= se zadavat nemusi.
#
# perf=       Zustava true = mereni vykonu ridici smycky bezi (panel Tools ->
#             Vykon). Na zarizeni je to zadouci, at je videt, jestli smycka
#             stiha svou periodu.
#
# measdiag=   NEZAPINAT pri jizde - je to stovky mereni za sekundu do proudu.

# ------------------------------------------------------------------------------
# NA CO SI DAT POZOR PRI PRVNIM BEHU
# ------------------------------------------------------------------------------
#
# 1) KURZ SE NEINICIALIZUJE. Bez start= se poloha zalozi z prvniho GPS fixu, ale
#    kurz ne - ten si filtr musi dojit z kompasu (VN100, 100 Hz). Dokud kurz
#    nekonverguje, zapisuje LocalNavigator do world-kotveneho occupancy gridu
#    bunky se spatnym kurzem, takze prvni sekundy jizdy nejsou k nicemu. Nechat
#    robota chvili stat, nez se kurz usadi.
#
# 2) ZAZNAM ZABIRA AZ PRI STARTU REZIMU RUN, ne pri startu aplikace. Kdyz se Run
#    spusti tlacitkem "Run + zaznam", vyhraje cesta z UI - vyslovna volba cloveka
#    prebiji profil.
#
# 3) freerunlook= (vychozi 3 m) je JEDINA skutecna ladici konstanta te mise.
#    Kdyz robot reze rohy nebo naopak kmita, meni se tohle.
#
# 4) PRODLEVA PRED AUTOSTARTEM je pevna (~3 s po pripraveni HW) a je na USTALENI,
#    ne bezpecnostni. Skutecna pojistka je fyzicke nouzove zastaveni. Pri prvnim
#    behu se hodi pustit to nejdriv s autorun=false a Run naklikat rucne, at je
#    videt, ze senzory hlasi OK a kurz se usadil.
