# Profil: PROVOZNI rezim na Orange Pi - aplikace bezi pod systemd a ceka na ukol.
# Pouziva ho jednotka deploy/arbot.service; rucne:
#   dotnet ~/arbot-headless-run/ARBot.Headless.dll dataroot=/home/ales/arbot config=config/pi-provoz.cfg
#
# Rozdil proti pi-freerun.cfg je JEDINY, ale zasadni: NENI TU MISE. Aplikace se
# spusti po bootu, rozjede senzory a STOJI, dokud clovek nevybere misi na strance
# nahledu - a to jde jen pri DRZENEM nouzovem zastaveni. Robot se tedy po zapnuti
# nikdy nerozjede sam, i kdyz se aplikace (nebo cely Pi) restartuje.
# Viz doc/headless.md a doc/plan-headless-provoz.md.

# --- Mise ---------------------------------------------------------------------
# mission= se ZAMERNE nenastavuje. Vybere se za behu ze stranky nahledu; volba se
# projevi v ucinne konfiguraci s puvodem "zvoleno za behu", takze je i v zaznamu.
#
# track= a map= tu ale byt MUSI: za behu jde prepnout jen mission= (bila listina
# v ParamStore.RuntimeOverridable), takze kdyz clovek na strance vybere misi track,
# musi uz mit z ceho jet. Cesty relativne k datovemu adresari (dataroot=).
#
# POZOR na tvar cesty: LOMITKO DOPREDU a velikost pismen jako na disku Pi. Zpetne
# lomitko je na Linuxu obycejny znak ve jmene souboru, takze 'osm\haje.osm' se tam
# NENAJDE, i kdyz na Windows funguje; adresar se na Pi jmenuje OSM (nasad.ps1).

# --- Mapy a svet --------------------------------------------------------------
# Silnicni sit pro globalni navigaci (mise track a robotour). FreeRun ji
# nepotrebuje - misi ale vybira az clovek na strance, takze mapa tu je predem.
#track=OSM/modrany2.track
#map=OSM/modrany2.osm

track=OSM/Hviezdoslavova.track
map=OSM/Hviezdoslavova.osm

#map=OSM/Robotour2026-ver1.osm




# --- Bezpecnost ---------------------------------------------------------------
# Strop rychlosti jizdy [m/s] - plati pro CELE rizeni naraz (driver motoru,
# rychlostni profil i obalku planovace), ne jen pro misi. Tatáz hodnota jako
# v pi-freerun.cfg.
maxspeed=1

# --- Nahled -------------------------------------------------------------------
# Stranka na http://<ip>:8080/ - stav robota, snimek kamery, pudorys, a jediny
# zasah: vyber mise (pri drzenem stopu) a zastaveni. BEZ HESLA na vsech
# rozhranich; chrani to heslo k WiFi. Viz doc/headless.md.
web=8080

# --- Vize ---------------------------------------------------------------------
# Sjizdnost z RGB pocita neuronova sit na NPU (RK3588), ne zpetna projekce z histogramu
# barev. Duvod je zmereny: proti pravde ma sit 87,7 % / IoU 0,838 proti 78,0 % / 0,752
# histogramu, a hlavne VYMYSLI SI CESTU, KDE NENI, 4x mene casto (7,9 % proti 20,3 %).
# To je pro robota ta spravna chyba - vymyslena cesta je horsi nez prehlednuta.
#
# Cena je male: na NPU stoji 3,3 ms na snimek, takze cele zpracovani snimku vzroste
# z 8,1 na 9,3 ms a snimkova frekvence se nezmeni (~29 sn/s). Na CPU (backproject=nn)
# by to bylo 10,2 ms. Zmereno 7. 9. 2026, viz doc/semantic-segmentation.md.
#
# POZOR: sit pocita ve 128x128, kdezto histogram v plnem rozliseni snimku - meni to
# hustotu dat pro occupancy grid i hranice cesty. Dopad na rizeni NENI zmereny.
backproject=npu

# Model je OPTIMALIZOVANY graf (models/onnxopt.py -> models/onnx2rknn.py). Zmereno
# PRAVE NA TOMHLE Pi 9. 9. 2026: 3,27 -> 2,72 ms (-17 %) pri NEZMENENE presnosti
# (87,70 proti 87,71 % / IoU 0,838 na models/testset). Z -49 % ubranych nasobeni
# tedy NPU vyuzije jen tretinu - planuje si sam, takze se to muselo zmerit.
#
# Presnejsi varianta je models/Model61.1_opt_fp16.rknn: 3,33 ms (tedy cena STAREHO
# modelu) a 88,19 % / IoU 0,845, hlavne zamlcena cesta 4,19 misto 4,80 %. Je to volba
# provozniho bodu, ne oprava - falesne pridana cesta je o 0,13 p. b. horsi.
npumodel=models/Model61.1_opt.rknn

# --- Snimkova frekvence kamer -------------------------------------------------
# Zamerne NENI nastavena - plati vychozich 30 sn/s. Radek nize je pripraveny pro
# pripad, ze by se nasadil DRAZSI MODEL: Model96.2 je presnejsi (96,7 % / IoU 0,953),
# ale na NPU stoji 44 ms na snimek, takze pri 30 sn/s klesne skutecna frekvence na ~16
# a snimky se zahazuji. S camerafps=15 by kamera rovnou davala tolik, kolik se stihne
# zpracovat - usetri to USB, dekodovani i zaznam.
#
# Povolene hodnoty: 6, 15, 30, 60 (jine D435 nezna a pipeline nenastartuje).
#camerafps=15
#npumodel=models/Model96.2.rknn        # 43,2 ms, 96,66 % / IoU 0,953


# --- Fuze ---------------------------------------------------------------------
# Sigma polohy z GPS na JEDEN fix [m]. Vychozi 1,5 m je presnost fixu - jenze filtr
# jich bere 10 za sekundu a pocita je za NEZAVISLE, coz nejsou: zmereno 6. 9. 2026
# na stojicim robotu (390 s, records/20260902-222601.rec), ze chyba GPS ma dekorelacni
# cas ~40 s a prumer ze 100 fixu je stejne presny jako jeden. Filtr si tak nasadi
# ~400x vic informace, nez v datech je - hlasi sigmu polohy 0,074 m a pritom odhad
# stojiciho robota ujizdi 5,5 m/min. To rozhybe world-kotveny occupancy grid a dela
# v lokalni mape artefakty.
#
# 30 m = 1,5 m x odmocnina(400), tedy sigma jednoho fixu skalovana na pocet
# korelovanych vzorku. Casova konstanta nasledovani GPS tim jde z 57 s na ~19 min.
#
# ⚠️ PROZATIMNI RESENI, ne sprava vec. Spravne je bud decimovat fixy na dekorelacni
# cas, nebo dat offset GPS do stavu EKF (pak jde brat vsech 10 Hz). A ten nasobek je
# zmereny jen pro STANI - za jizdy se dekorelacni cas zmerit nepodarilo (nejdelsi
# souvisly usek jizdy v zaznamech je 45 s, coz na 40s konstantu nestaci). Kdyby se
# globalni navigace zacala citelne opozdovat, je to prave ten priznak.
#
# Zamerne JEN v tomhle profilu, ne jako default: virtualni GPS v simulaci ma sum bily,
# takze tam by nafouknuti sigmy jen zhorsilo odhad.
#
# Overit po zmene: ARBot.Analyze gps nad novym zaznamem ze stani - drift a tau se maji
# posunout prave o ten nasobek. Kdyz ne, model neplati a je to jinde.
gpsposstd=30

# --- Hranova lokalizace (koridor) --------------------------------------------
# MERICI REZIM: koridor se POCITA a hlasi zpravou, ale do fuze NEPOSILA NIC.
# Plna zatez, plna diagnostika do zaznamu, nulovy vliv na rizeni.
#
# PROC ZATIM JEN MERIT. Autorita koridoru by v TOMHLE profilu byla obrovska, protoze
# GPS je tu zamerne oslabena (gpsposstd=30, tedy 400x mene informace):
#   pricne  f/sigma^2 = 10/0,03^2 proti 10/30^2  ->  rad 10^5 az 10^6 : 1 pro koridor
#   kurz    proti kompasu ~150 az 1000 : 1 - a to je OBRACENE, nez rika starsi mereni
#           "korekce kurzu je bezmocna, kompas ji prehlasi 200:1" (22. 8. 2026). Preklopilo
#           to skrceni kompasu na imuheadinghz=1 a podlaha imuheadingstd=5 z 12. 9. 2026.
# Ta cisla jsou SPOCITANA z dokumentovanych sigem a kadenci, ne zmerena - a presne proto
# se nejdriv meri. Rozbor: ARBot.Analyze corridor <zaznam>.
corridor=true
corridorsend=true

# Verdikty jednotlivych merenii (NIS, Accepted/GatedOut/TooOld) do zaznamu. Filtrovane na
# zdroj Corridor, tedy jednotky zaznamu za sekundu - ne stovky jako measdiag=true.
measdiag=Corridor

# --- Odtlumeni koridoru: ZATIM VYPNUTE ---------------------------------------
# Az se corridorsend prepne na true, tady se koridor odtlumi. Vychozi 0 = zadne odtlumeni.
#
# ⚠️ NENASTAVOVAT ODHADEM. Dekorelacni cas chyby koridoru zmereny NENI - u plosne korelace
# vysel ~3 s (odtud MinPeriod) a u kompasu tau >= 600 s (odtud imuheadinghz=1); oboji z DAT.
# Koridor meri snimek co snimek tyz fyzicky okraj cesty (tyz stin, tyz obrubnik, tataz trava),
# takze korelovana skoro jiste je - jen se neví jak moc. Prvni zaznam z merici jizdy to da:
# estimator i skrceni jsou funkce posloupnosti Width/sigma z RoadCorridorMsg, a ta je
# v zaznamu i u cyklu, ktere neprosly branami, takze prahy jdou proladit OFFLINE.
#
#corridorstd=0.1          # prirazek k sigme pricne polohy [m], kvadraticky
#corridorheadingstd=2     # prirazek k sigme kurzu [stupne], kvadraticky
#corridorhz=1             # kadence merenii DO FUZE [Hz]; 0 = neomezeno (az ~20/s)

# --- Diagnostika --------------------------------------------------------------
# Zaznam zacne AZ VYBEREM MISE, ne uz cekanim - jinak by cekani na ukol zaplnilo
# disk (~19 MB/s). Jeden .rec = jedna mise.
record=true

# ------------------------------------------------------------------------------
# CO SE ZAMERNE NENASTAVUJE
# ------------------------------------------------------------------------------
# autorun=   V headless nema smysl (Run je jediny duvod existence procesu) a
#            ignoruje se s hlaskou. Mise se nespousti autorunem, ale volbou.
#
# dataroot=  Patri na PRIKAZOVOU RADKU, ne sem: profil se hleda az podle nej.
#            V profilu je to chyba pri startu - schvalne, aby to nebylo tise
#            spatne. Nastavuje ho jednotka (dataroot=/home/ales/arbot).
