# Vzorovy profil: mise FreeRun nad rovnou syntetickou mapou ve virtualnim HW.
# Spusteni:  ARBot config=config/simulace-freerun.cfg
#
# Zapisuji se jen hodnoty ODLISNE od vychozich - uplny vycet parametru je v panelu
# Tools -> Konfigurace. Prikazova radka tenhle soubor prebiji, takze jednotlivy
# parametr jde na jeden beh zmenit bez editace profilu:
#   ARBot config=config/simulace-freerun.cfg mission=none

# --- Mapy a svet ---
# OSM mapa, podle ktere robot jede (silnicni sit pro globalni navigaci).
map=OSM/SyntetickyRovny.osm

# --- Mise ---
# Vyber mise: none | freerun | robotour.
mission=freerun

# --- Virtualni HW a simulace ---
# Misto skutecneho HW zalozi simulovane senzory (kamery renderovane z mapy).
virtualhw=true

# --- Hardware ---
# Preskoci UART senzory (IMU/GPS/motor) - v simulaci nejsou pripojene.
no_uart=true
