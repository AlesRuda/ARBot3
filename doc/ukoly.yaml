    nazev: Runtime zatuhl při volbě mise; z toho hlídač zatuhnutí
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-14
    vyreseno: 2026-09-14
    popis: >
      Při volbě mise ze stránky se runtime na zařízení zasekl uvnitř `Start(Mode.Run)` — v journalu
      doběhlo `corridor=false`, `mission=track` už nikdy (běžně 5 ms mezi nimi), proces žil dál,
      stránka umlkla a autor robota vypnul; tím zmizel i stav, ze kterého by to šlo přečíst.
      Léčba není oprava (mechanismus záseku je neprokázaný), ale důkaz, který si robot pořídí sám:
      `HangWatchdog` (`hangwatch=`, výchozí 20 s) obaluje start, po vypršení jde do `Trace` hlášení
      a vedle něj minidump se zásobníky všech vláken. Reprodukce od stolu (32 kol volba mise →
      stop → restart) zásek nevyvolala; rozdíl je, že tehdy robot jel. Kandidátem na příčinu je
      od 15. 9. `Stop()` zatuhlý na UARTu bez dat (nález V5 auditu).
      17. 9. 2026 hlídač na zařízení POPRVÉ běžel — a v 16:21:42 **vystřelil a odvedl přesně to,
      kvůli čemu vznikl**: zásek při volbě mise `track`, minidump
      `logs/hang-Start-Run-20260917-162142.dmp`, a z jeho zásobníků je příčina určená na řádek —
      je to **ABBA deadlock mezi zámkem `TrackMission` a zámkem `WebStatus`**, viz
      `prov-deadlock-mise-webstatus`. Tím je tohle téma vyřešené: hlídač je hotový, nasazený
      a prokázaný v provozu, a vada, kterou chytil, se vede samostatně.
      ⚠️ **Nechytí ale zásek ZA během** — token se po dokončení `Start(Run)` zahodí, takže zásek
      z téhož dne v 16:12 (4 s po startu) žádný dump nemá; viz `prov-zatuhnuti-za-behu-mise`.
    kroky:
      - co: Rozbor journalu a záznamů (dva omyly opravené měřením)
        stav: hotovo
        kdy: 2026-09-14
      - co: "`HangWatchdog` s minidumpem, arm před zámkem, jen pro `Run`"
        stav: hotovo
        kdy: 2026-09-14
      - co: Reprodukce od stolu — negativní
        stav: hotovo
        kdy: 2026-09-14
      - co: Nasadit hlídač na zařízení a nechat zásek chytit v provozu
        stav: hotovo
        kdy: 2026-09-17
    odkazy:
      - text: headless.md
        cesta: doc/headless.md
    devlog: [2026-09-14, 2026-09-15]
    ceka_na: []

  - id: prov-start-limit-sluzba
    oblast: provoz
    nazev: Služba se po pěti restartech v pěti minutách vzdá a robot je mrtvý
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-14
    vyreseno: 2026-09-15
    popis: >
      Systemd má výchozí `StartLimitBurst=5` / `StartLimitIntervalUSec=5min`: šestý start v okně
      skončí `start-limit-hit`, jednotka zůstane `failed` a `Restart=always` ji už nevrátí — crash
      loop odstaví robota v terénu natrvalo do ručního `reset-failed`. Našlo se to na reprodukčním
      testu 14. 9., kdy počítadlo restartů došlo na 4 z 5. Limit vypnut (`StartLimitIntervalSec=0`)
      a přidán rostoucí `RestartSec`; je to bezpečné, protože se robot bez výběru mise sám
      nerozjede a deterministické příčiny (návratové kódy 2, 3) dál odfiltruje
      `RestartPreventExitStatus`. Na zařízení neběželo.
    kroky:
      - co: Nález na reprodukčním testu (restart counter 4 z 5)
        stav: hotovo
        kdy: 2026-09-14
      - co: "`StartLimitIntervalSec=0` + rostoucí `RestartSec` v jednotce"
        stav: hotovo
        kdy: 2026-09-15
      - co: Ověřit na zařízení (jednotku nasadit a vyvolat opakovaný pád)
        stav: otevreno
    odkazy:
