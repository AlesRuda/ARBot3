  - id: hw-motor-chybovy-ramec
    oblast: hw
    nazev: Chybový rámec motorového driveru se tvářil jako měření
    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-27
    vyreseno: 2026-09-15
    popis: >
      Když se z řídicí jednotky motorů nepodaří přečíst telemetrii, driver vyrábí zástupný rámec
      s nulami a příznakem stopu. Fúze z něj brala „stojím", panel vypisoval 0 V (na Pi to
      vypadalo jako blikání napětí) a automat mise si obnovení linky s nestisknutým tlačítkem
      vyložil jako „jeď". Rozlišuje to příznak `HasMeasurement` (`MotorStateBase` verze 3): mapper
      z takového rámce měření nevyrobí, panel drží poslední naměřené hodnoty, a od 15. 9. na něj
      hledí i automaty misí a držené zastavení. Stop z rámce platí dál (fail-safe). Projeví se jen
      na skutečném železe, virtuální motory chybovou větev nemají.
