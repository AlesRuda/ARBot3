  - id: prov-zotaveni-kamer-supervizor
    oblast: provoz
    nazev: Zaseknuté kamery D435 si runtime zotaví sám za ~29 s
    druh: zamer
    stav: hotovo
    nalezeno: 2026-09-12
    vyreseno: 2026-09-13
    popis: >
      Zamrzlý stream D435 dřív znamenal mrtvou kameru na stovky sekund až do restartu služby.
      `CameraRecoverySupervisor` po 15 neúspěšných pokusech o připojení vezme držené zastavení,
      počká na stání, nechá kamery zaparkovat jejich vlastní smyčku (žádost a potvrzení — první
      verze bourala pipeline z cizího vlákna a zatuhla) a vymění sdílený RealSense kontext.
      Na robotu ověřeno 5× z 5 na skutečné poruše, obnova 28–29 s. Odstup po neúspěchu se
