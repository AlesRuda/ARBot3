    popis: >
      Graf sítě měřil vzdálenosti haversinem na kouli, zatímco lokální rovina a fúze počítají na
      elipsoidu WGS84 — na syntetické mapě vyšlo 9,969 m místo 10,000 m, a týkalo se to všech map.
      `GreatCircle` teď počítá geodetiku na zvoleném elipsoidu; projekce na úsečku vědomě zůstala
      na kouli, protože se tam měřítko vykrátí. Při tom se přejmenovala vlastnost, která tvrdila
      excentricitu a byla zploštění.
