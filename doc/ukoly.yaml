  - id: hw-d435-vlakno-zatuhlo-po-restartu
    oblast: hw
    nazev: Levá D435 po restartu pipeline (zamrzlá barva) úplně ztichla — vlákno kamery zatuhlo v nativním volání
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-24
    vyreseno: 2026-09-24
    popis: >
      `records/test/20260923-143515.rec`: ve 14:40:53 levé D435 zamrzla barva, driver ohlásil
      restart pipeline a pak už o ní nepřišlo nic — žádný dotaz, připojení ani chyba, žádné snímky;
      pravá jela do konce. Supervizor zotavení nezasáhl, protože kamera o nic nežádala (na rozdíl od
      záseků 12.–18. 9., kdy vlákno žilo a hlásilo `QueryDevices selhalo`). Vlákno tedy zatuhlo
      v nativním volání RealSense. Podezřelé místo: hlídka zamrzlého streamu bourala pipeline
      UVNITŘ `using (frames)` (s neuvolněným framesetem), ostatní cesty až po uvolnění — podezření,
      ne dokázaná příčina (13. 9. stejná cesta doběhla). Opraveno bourání až po uvolnění
      a přidán `NativeCallWatch` (Stop/Dispose/Start/QueryDevices u D435 i T265, limit
      `hangwatch=`), který při zatuhnutí zapíše, ve kterém volání vlákno visí, a pořídí minidump.
    kroky:
