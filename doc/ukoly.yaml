  - id: hw-magcal-uncompmag-kompenzovany
    oblast: hw
    nazev: „Surové" pole magnetometru je kompenzované, druhá kalibrace by tu první přepsala
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-11
    vyreseno: 2026-09-12
    popis: >
      Registr 54, který ICD uvádí jako nekompenzovaná měření, se na našem senzoru mění podle registru 23
      stejně jako kompenzovaný výstup; 12. 9. se ze záznamu potvrdilo, že binární `UncompMag` je bit po
      bitu shodný s kompenzovaným polem. Kalibrační mise ale sbírá právě tohle pole a výsledek zapisuje
      do registru 23 přímo, takže druhé spuštění by dobrou kalibraci přepsalo maticí blízkou jednotkové.
      Mise si teď registr 23 před sběrem vymaže (jen do RAM, výpadek napájení vrátí flash) a při
      ukončení bez zápisu ho vrátí; když ho nejde přečíst ani vymazat, nezačne. Skládání kalibrací se
      zamítlo, protože potřebuje rámcovou transformaci, která už jednou kousla. Vymazání na
      senzoru proběhlo 17. 9. 2026: mise `magcal` došla do fáze `Written` (bez přečtení
      a vymazání registru 23 se do sběru nedostane) a zapsaná kalibrace 18. 9. drží (zbytkové
      železo 11–18 mG), což by při sběru přes starou kompenzaci nevyšlo. Vrácení registru po
      nedokončené misi na senzoru zatím nevyzkoušeno.
    kroky:
      - co: "Změřit `Magnetometer` proti `MagnetometerRaw` ze záznamu"
        stav: hotovo
        kdy: 2026-09-12
      - co: Mise registr 23 vymaže a po nedokončení vrátí
        stav: hotovo
        kdy: 2026-09-12
      - co: "Ověřit na senzoru, že se registr před sběrem vymaže — 17. 9., mise došla do `Written`, kalibrace 18. 9. drží"
        stav: hotovo
