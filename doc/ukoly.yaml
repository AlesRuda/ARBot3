      Rozbor 417 s záznamu novým `ARBot.Analyze localplan`: koridor se detekoval jen ve 2 %
      cyklů, mrkev ležela 3 m rovně vpřed a v 97 % plánů byla nedosažitelná. Fallback pak dělal
      detour 8–24 m skrz neznámo nebo pahýl k čelu překážky — a přesně ten robot jel. Eskapovací
      zóna 0,5 m kolem robota byla ve stísněném prostoru trvale aktivní a dovolila plánovat pod
      bezpečným odstupem (min 0,00 m). Druhý den se zóna zrušila (těsný start = únik s hysterezí),
      nedosažitelný cíl dostal stavy `GoalBlocked` / `GoalUnsafe` a odstup je parametr `safedist=`.
      Reakce mise na nedosažitelnou mrkev zůstala otevřená a vyřešila se 14. 9. cílem jako zónou.
      Ověřeno jen testy.
