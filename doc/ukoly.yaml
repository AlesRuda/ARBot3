  - id: lok-gps-casova-korelace
    oblast: lokalizace
    nazev: Chyba GPS fixu je korelovaná ~40 s, filtr ji bere jako nezávislou
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-06
    popis: >
      Nový `ARBot.Analyze gps` využívá, že stojící robot dává pravdu zadarmo: chyba fixu má p50
      4,4 m a dekorelační čas ~40 s, takže průměrování nepomůže vůbec, a filtr přitom bere 10 fixů
      za sekundu jako nezávislé — odhad ujíždí 5,5 m/min s časovou konstantou 57 s a hlásí
      sigmu 0,074 m. Prozatímní léčba: `gpsposstd` je parametr a v provozním profilu je 30 m
      (20× ze √400 korelovaných vzorků), jen pro Pi, ne jako default. Skutečná léčba je decimace
      nebo offset GPS jako stav EKF; za jízdy dekorelační čas změřit nešlo, nejdelší souvislá
      jízda v záznamech je 45 s.
      17. 9. 2026 se za jízdy změřit DAL: souvislý úsek 215 s a 96 m dal dekorelační čas ~40 s
      (zbytek po zarovnání proti mrtvému odhadu z kol p50 3,58 m, p90 7,58 m) — tedy stejný řád
      jako ze stání, ale pořád jen ~5 nezávislých vzorků, takže je to orientační číslo. Ze stání
      (55 s) měl fix odchylku od průměru segmentu p50 9,68 m a maximum 17,3 m, průměrovací křivka
      je plochá (činitel nadsazení 10,6× při N = 100) a změřené Kalmanovo zesílení 0,32/0,29
      říká, že GPS odhad pořád táhne. Tím je vysvětlené, co obsluha viděla na stránce po
      kalibraci magnetometru — poloha o „3–4 metry ujetá": chyba fixu té velikosti drží desítky
      sekund, takže nevypadá jako šum, ale jako posunutá stopa. Podmínky byly toho dne slabé:
      4–6 družic a DOP 6,8–12, tedy na hraně brány `gpsmaxdop=10` (na startu se zamítlo 136,
      resp. 205 fixů po sobě).
    kroky:
      - co: "`ARBot.Analyze gps` (drift, K, tau, autokorelace, blok A2b za jízdy)"
        stav: hotovo
        kdy: 2026-09-06
      - co: "`gpsposstd=` jako parametr, 30 m v `pi-provoz.cfg`"
        stav: hotovo
        kdy: 2026-09-06
      - co: Ověřit násobek na novém záznamu ze stání (drift a tau se mají posunout 20×)
        stav: otevreno
      - co: Souvislá jízda 5–10 minut bez zastavení pro dekorelační čas za jízdy
        stav: otevreno
      - co: První měření za jízdy (17. 9., úsek 215 s / 96 m → T_d ~40 s); na 5–10 min to nestačí
        stav: hotovo
        kdy: 2026-09-17
      - co: Decimace nebo offset GPS jako stav EKF
        stav: otevreno
    odkazy:
      - text: ekf-fusion.md
        cesta: doc/ekf-fusion.md
      - text: configuration.md
        cesta: doc/configuration.md
      - text: GpsReport.cs
        cesta: Src/ARBot.Analyze/GpsReport.cs
    devlog: [2026-09-06, 2026-09-17]
    ceka_na: [lok-bias-senzoru-jako-stav-ekf]

  - id: lok-t265-napojeni
    oblast: lokalizace
    nazev: T265 běžela, ale její data neměla kam téct
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-06
    vyreseno: 2026-09-12
    popis: >
      Kamera se zakládala, otáčela pipeline a soupeřila na USB, ale `BuildSensorSources` ji
      nikdy nedrátoval — v záznamu po ní nebyla ani stopa a na stránce vypadala jako porucha.
      Napojení není jednořádkové: bez magnetometru je její yaw o neznámou konstantu vedle severu,
      proto jde do fúze jen úhlová rychlost z rozdílu yaw na nepřekrývajícím se okně 0,5 s
      (`IMUState.HasAbsoluteHeading`, verze 3). Na robotu pak nesla 19 % informace o úhlové
      rychlosti. Absolutní kurz z ní nevznikne bez offsetu yaw jako stavu EKF — a od 14. 9. je
      to jedno, protože autor T265 kvůli výpadkům kamer odpojil natrvalo.
