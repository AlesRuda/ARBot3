  - id: nast-port-arbot2-matrix
    oblast: nastroje
    nazev: Port z ARBot2 — vlastní třída `Matrix` nahrazena MathNet a testy převedeny na NUnit
    druh: zamer
    stav: hotovo
    nalezeno: 2026-06-23
    vyreseno: 2026-06-24
    popis: >
      Založení repozitáře ARBot3 a první krok portu z ARBot2: domácí třída `Matrix` (~2000 řádků
      netestovaného kódu) se smazala a všichni živí uživatelé (`ECEF`, `Transformation`, `ICP`,
      `Intrinsics`, `EKFStepMsg`) přešli na MathNet.Numerics, pro fixní 3D geometrii na
      System.Numerics. MathNet vyhrál mikro-benchmarkem (~2,5× rychlejší i na malých maticích EKF)
      a prověřenými dekompozicemi. Staré MSTest testy se převedly na NUnit a jako síť před migrací
      se přenesly charakterizační testy; mrtvý generický EKF framework vypadl z buildu.
    kroky:
      - co: Založení repozitáře (`.gitattributes`, `.gitignore`, README, LICENSE)
        stav: hotovo
        kdy: 2026-06-23
      - co: Odstranění `ARBot.Common.Common.Matrix`, přepis uživatelů na MathNet / System.Numerics
        stav: hotovo
        kdy: 2026-06-24
      - co: Migrace testů na NUnit + charakterizační testy `Transformation` / `ECEF`
        stav: hotovo
        kdy: 2026-06-24
    odkazy:
      - text: architecture.md
        cesta: doc/architecture.md
    devlog: [2026-06-23, 2026-06-24]
    ceka_na: []

