  - id: hw-zelezo-od-kabelu-kamer
    oblast: hw
    nazev: Kalibrace magnetometru přestala účinkovat — přibylo železo od kabelů ke kamerám
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-15
    vyreseno: 2026-09-18
    popis: >
      Kalibrace z 11. 9., ověřená 12. 9., v záznamech ze 14. 9. už neúčinkuje: velikost pole při
      stání 0,614 G proti 0,4897, rozpětí přes záznam 0,177 G (12. 9. 0,019 G), `IMU yaw − GPS
      kurz` p50 −15,6° a atitudové řešení senzoru se táhne za polem 345 s. Fúze kurz přebírá,
      takže to jde 1:1 do mapy i do mrkve — a platí to zpětně pro všechna měření nad těmi záznamy.
      Zdroj zúžen měřením na kabely ke kamerám (13. 9. se prohodily): je to jejich železo, ne
      proud — rozsvícení obou kamer posune pole jen o 6,4 mG, 4 % offsetu. 16. 9. železo
      přetrvává. Pro test kabelů vzniklo živé měřidlo v UI (panel magnetometru v dokumentu IMU
      s řádkem „Klid“, protože 1° otočení dělá víc než celý hledaný efekt) — na skutečném VN100
      neběželo. Nevysvětlený zůstává klidový bias gyra −161 a −453 °/h proti +13 °/h 12. 9.
      17. 9. 2026 to bylo ještě horší než 14. 9.: `|B|` p50 0,693 G proti referenčním 0,4897
      (14. 9. 0,614), rozpětí 0,584–0,737 G, a kurz z kompasu byl fakticky náhodný — `IMU yaw −
      GPS kurz` sd 121°, 2. harmonická 114°, a ze tří modelů vyhrál „zamrzlý kompas" (zbytkový
      rozptyl 76,5° proti 96 a 115). Že chybuje IMU a ne GPS, potvrdila třetí cesta: `Doppler −
      směr posunu polohy` −1,8° ± 12,9°. Fúze kurz přebírá (`odhad − IMU yaw` 18,1° ± 17,4°),
      takže to šlo 1:1 do mapy i do mrkve.
      Nová kalibrace se týž den změřila (`mission=magcal`) a v 16:20:20 zapsala do registru 23
      i do flash; tvrdé železo z proložení koule vyšlo 0,2518 G. Obsluha hlásí, že směr při
      následující jízdě vypadal velmi dobře — záznam z ní ale není, takže ověřené to není.
      ✅ **Uzavřeno 18. 9. 2026:** nová kalibrace ze 17. 9. při první jízdě drží — zbytkové vodorovné železo **11–18 mG** (14./17. 9.: 158–169 mG; 12. 9. při otáčení na místě 1,3 mG), `|B|` na referenci, VPE τ 28–53 s, kurz proti GPS −2,5 / −1,6°. Kabely jsou statické (přechody kamer 1–6 mG). Platnost kalibrace je dál vázaná na polohu kabelů — při jejich pohybu znovu `mission=magcal`. Tabulka: `imu-and-frames.md`, „Po NOVÉ kalibraci".
    kroky:
      - co: Rozbor záznamů ze 14. 9., dva omyly opravené měřením
        stav: hotovo
        kdy: 2026-09-15
      - co: Měřidla `ARBot.Analyze vn100` blok 5 (kamery) a `heading --bin` (vývoj rozporu v čase)
        stav: hotovo
        kdy: 2026-09-15
      - co: Panel magnetometru v UI (`MagTrace`, 11 testů, ověřeno v simulaci)
        stav: hotovo
