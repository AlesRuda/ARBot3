  - id: hw-t265-odpojena-natrvalo
    oblast: hw
    nazev: "Odpojená T265: runtime ji dál hledá a zahlcuje journal"
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-13
    popis: >
      T265 se 13. 9. rozbila tak, že se připojí, ale nedává pózu; softwarový reset selže a
      nepomůže ani restart služby, jen fyzické přepojení — a po něm se za 1,5 h zasekla znovu.
      Každé její marné zotavení přitom stahovalo kontextem i obě zdravé D435 a zastavovalo robota.
      Autor rozhodl kameru odpojit natrvalo (od 13. 9. večer na sběrnici není). Runtime ji ale
      dál hledá ~1×/s přes sdílený zámek RealSense a na každý pokus píše chybu do journalu
      (7 829 řádků za 168 min) — neškodí, ale zahlcuje; nezakládat ji, když není na sběrnici,
      zbývá. Profil ji vypnout neumí (žádný parametr, `ARBotHW` ji zakládá bezpodmínečně)
      a 17. 9. se ukázalo, že hledání teče i do záznamu, ne jen do journalu (po zatuhnutí
      runtime bylo vlákno T265 jediné živé, 140 s hlášek v `.rec`).
    kroky:
      - co: T265 zapojena do zotavení kamer, per-kamera vzdání po třech marných pokusech
        stav: hotovo
        kdy: 2026-09-13
      - co: Nezakládat T265 v runtime, když není na sběrnici (hledání 1×/s přes sdílený zámek)
