  - id: vid-polarni-grid-sjizdnosti
    oblast: videni
    nazev: Polární grid sjízdnosti z hloubkové kamery s robot-centrickým pohledem
    druh: zamer
    stav: hotovo
    nalezeno: 2026-07-29
    vyreseno: 2026-08-01
    popis: >
      První vrstva vnímání terénu: hloubka → point cloud → polární grid kolem robota, per kamera,
      s klasifikací buněk a důvěrou. Zapojený do runtime (v Run se počítá, ve View jen přehrává —
      živé intrinsics se nezaznamenávají, přepočet ze záznamu je odložený), s ptačím pohledem
      a overlayem přes hloubkový obraz. Ověřeno na živé kameře 30. 7. Převod hloubky na body jede
