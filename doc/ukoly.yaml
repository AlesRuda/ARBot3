  - id: lok-ransac-nedeterministicky
    oblast: lokalizace
    nazev: RANSAC je nedeterministický, replay hranové lokalizace není reprodukovatelný
    druh: vada
    stav: otevreno
    nalezeno: 2026-08-23
    popis: >
      `RANSAC.Compute` používá neseedovaný `new Random()`, takže tentýž vstup dá pokaždé jiný
      výsledek (±8 přijatých ze 421 dvojic). Než se to zjistilo, vyšly z jednotlivých běhů dva
      závěry, které neplatily; od té doby se každá varianta estimátoru měří 12× a porovnávají se
      rozpětí. Jde to proti zbytku projektu (`DeterministicNoise`, `ComparisonTarget`) a je
      podezřelé i z jednoho nestabilního běhu testovací sady. Zaseedování je drobnost, zatím
      neudělaná — v kódu je pořád `new Random()`.
    kroky:
      - co: "Naseedovat `RANSAC` (reprodukovatelný replay, jedno měření na variantu)"
        stav: otevreno
