  - id: mise-qr-jmeno-kamery
    oblast: mise
    nazev: Skener QR na robotu nedostal jediný snímek — jméno kamery „Right" vs. „Right 740112071021"
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-19
    vyreseno: 2026-09-19
    popis: >
      Na soutěži 19. 9. 2026 robot v misi Robotour kód nepřečetl (`records/test/20260919-092933.rec`):
      automat byl 239 s ve fázi `Servicing` pod drženým stopem, skener zapnutý, a v záznamu není ani
      jedna `QrCodeMsg`. Kód přitom v obraze BYL — offline dekodér nad týmiž snímky ho čte v 725 z
      3 957 (obě kamery, dva různé `geo:` texty). Příčina: skutečná D435 se jmenuje
      `Right 740112071021` (driver skládá název a sériové číslo), kdežto `QrScannerConfig.CameraName`
      je `Right` a porovnávalo se celé jméno — virtuální kamera vrací holý název, takže simulace i
      všech 19 testů procházely a na robotu skener nikdy nedostal snímek. Druhá past téhož dne:
      stránka náhledu kreslila PRVNÍ kameru ve slovníku (levou), takže obsluha podle telefonu
      ukazovala kód levé kameře, zatímco se četlo z pravé. Léčba: jméno kamery se bere jako první
      slovo (`QrScanner.CameraMatches`), stránka kreslí tu kameru, ze které se čte QR, a říká to
      v řádku „na obrázku (čte QR)". Nouzové obejití bez nové binárky: `qrcamera=` (prázdné =
      všechny kamery) v profilu. Měří to nový `ARBot.Analyze mission`. Oprava byla nasazená
      před 1. kolem a od 10:04 se kód na robotu čte (535 čtení v 10:11 proti 2 v 10:04 říká,
      že obsluha od té doby ukazovala kód správné kameře); řádek „na obrázku (čte QR)" autor
      na stránce v terénu viděl (potvrzeno 21. 9.).
    kroky:
      - co: 'Rozbor `ARBot.Analyze mission`: časová osa fází a stopu, servisní okna, snímky živým dekodérem'
        stav: hotovo
        kdy: 2026-09-19
      - co: '`QrScanner.CameraMatches` — shoda na první slovo jména (2 testy, 21 QR testů zelených)'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Stránka náhledu kreslí kameru, ze které se čte QR (`WebStatus.PreferredCameraName`), a hlásí ji'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Čtení kódu na robotu: `20260919-100414.rec` 2 `QrCodeMsg` a kód přijat, `-101057` 535, `-101903` 195'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Ověřit na robotu, že stránka kreslí kameru, ze které se čte QR — autor řádek „na obrázku (čte QR)" na soutěži viděl'
        stav: hotovo
        kdy: 2026-09-19
