    popis: >
      Yaw z VN100 byl azimut k magnetickému severu: registr 21 měl východní složku 0, model pole
      vypnutý a náš kód deklinaci nepřidával. Jediná metoda, která by model zapnula, nikdy nemohla
      fungovat (čtecí příkaz místo zápisu, oddělovač tisíců v čísle, radiány místo stupňů).
      Od 8. 9. `MagModelInit` (`magmodel=`) zapíše registr 83 jednorázově po prvním kvalitním
      fixu; deklinace i sklon reference se dopočítají z WMM. Na živém senzoru 12. 9. potvrzeno,
      že se deklinace aplikuje (3,42°) — vestavěný model VN je ale zastaralý o ~1,9°.
