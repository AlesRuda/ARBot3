    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-19
    vyreseno: 2026-08-22
    popis: >
      Virtuální kamera renderovala z odhadu fúze, takže chyba odhadu posunula i obraz a nebyla
      vidět; model pohybu byl ideální a IMU hlásilo absolutní kurz s bílým šumem, takže odhad
      nikam nedriftoval a případ, který má hranová lokalizace léčit, v simulaci nevznikal.
      Bezobslužné běhy navíc měřily stojící robot, protože cíl šel zadat jen klikem v mapě.
      Kamery od 22. 8. renderují ze skutečné pózy (`camerapose=truth`), simulace umí prokluz kol
      (`wheelslip=`) a bias kurzu a gyra (`imubias=`), skutečná póza jde do záznamu jako
      `GroundTruthMsg` se stejným razítkem jako odhad, cíl jde zadat z příkazové řádky
      (`goal=lat,lon`) a panel Virtuální senzory ukazuje živou chybu lokalizace. Prokluz je
      ověřený za jízdy (enkodéry 17,89 m proti skutečným 17,71 m).
      Začalo to 19. 8. vnucenou chybou pózy v renderu (`poseerror=`) a 21. 8. druhou mapou pro kamery (`visionmap=`): chyba je v datech, ne v pozorovateli. Tuze posunutá dvojnice mapy (24. 8.) patří k rovné testovací mapě.
