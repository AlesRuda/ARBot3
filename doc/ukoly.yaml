      - co: "Kabely v poloze, ve které se 17. 9. kalibrovalo; 18. 9. jízda: skok pole při zapnutí kamer 1–6 mG (statické, v kalibraci)"
        stav: hotovo
        kdy: 2026-09-17
      - co: "`mission=magcal` s náklony na obě strany a nová kalibrace do senzoru"
        stav: hotovo
        kdy: 2026-09-17
      - co: "Ověřit novou kalibraci záznamem — 18. 9. (`20260918-154028.rec`, `-155329.rec`): zbytkové vodorovné železo 11–18 mG proti 158–169 mG, `|B|` 0,484–0,490 G, `IMU − GPS kurz` −2,5 / −1,6° (sd ~4°), VPE τ 28–53 s"
