  - id: lok-prirazeni-hrany-chi2
    oblast: lokalizace
    nazev: Polovina cyklů koridoru se párovala na příčnou ulici
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-16
    vyreseno: 2026-09-16
    popis: >
      Koridor bral nejbližší hranu sítě podle vzdálenosti, kurz do výběru nevstupoval — při chybě
      pózy 3–4 m vyhrála u křižovatky příčná ulice (1 114 z 2 256 cyklů nad měřicí jízdou) a
      šířková brána ji nechytila, protože v té mapě mají všechny cesty tutéž šířku. Teď vybírá
      `EdgeAssociator` přes χ² (Mahalanobis z příčné odchylky a azimutu, každá dělená svou σ —
      váhy se neodhadují, měří se), s podlahou na σ (bez ní by hlášená σ kurzu 1,1° proti
      skutečné chybě 15–20° zamítla všechno — počtvrté táž past), tvrdým vetem ±45° na azimut
      a odstupem od druhého kandidáta; při nejednoznačnosti se neposílá nic. Kandidáti se sbírají
      jako hypotézy, ne hrany, jinak by kolineární segment téže cesty zamítl každou rovnou cestu.
      Přitom se opravila živá vada: `Send()` odečítal směr přímky bez rozhodnutí o smyslu, takže
      u cesty kolmé na kurz šel do fúze kurz otočený (9,4 % přijatých cyklů); cena je, že koridor
      už nikdy neřekne „jsi otočený o 180°“. Ověřeno testy a simulací, na zařízení neběželo.
      18. 9. 2026 po kalibraci kompasu: chyba kurzu odhadu proti GPS je sd 8–11° včetně stání a ~2–4° za jízdy, takže `assocfloorhdg` jde stáhnout spíš na **5°** než na 3°; před soutěží nezměněno.
      Robotour 19. 9. byla první jízda přes skutečné křižovatky (830 m městem), ale rozbor
      přiřazení nad ní není — z `nav` je jen „změna hrany u 6 ze 78 velkých inovací".
    kroky:
      - co: Nález nad `20260916-164926.rec` a podklad pro přiřazení (χ² s hlášenými σ zamítne vše)
        stav: hotovo
        kdy: 2026-09-16
      - co: "`EdgeAssociator`, parametry `assoc*`, `RoadCorridorMsg` verze 6 se skóre"
        stav: hotovo
