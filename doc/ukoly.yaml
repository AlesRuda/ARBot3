  - id: lok-sirka-koridoru-plus-18-mm
    oblast: lokalizace
    nazev: Šířka koridoru vychází o 18 mm větší — nejmenší kvadráty sledují průměr, medián sedí
    druh: vada
    stav: zamitnuto
    nalezeno: 2026-08-24
    vyreseno: 2026-09-18
    popis: >
      Nad rovnou mapou proti pravdě vyšla šířka 2,018 m místo 2,000 (filtr šířky tu odchylku
      schovával devítinásobně). Surové body chybu nemají — medián sedí na okraji — ale rozdělení je
      zešikmené s dlouhým chvostem ven z cesty, a proložení nejmenšími kvadráty sleduje průměr.
      Příčinou je drsnost trávy v simulaci: bez ní je vychýlení −1,7 mm, při 0,12 m už +54 mm.
      Proložení cílící medián (`LineFitMode.OrthogonalL1`) srazí vychýlení na 1,4 mm (−92 %)
      a klesne i rozptyl; Huber s MAD je slabší, Tukey nestabilnější. Nezapnuto — autor 27. 8.
      rozhodl počkat na měření na reálné kameře, protože to zešikmení je artefakt simulace a na
      skutečné trávě se může ztratit v šumu. Zapínat léčbu vady, o které se neví, jestli na železe
      existuje, by znamenalo ladit simulaci.
      ❌ **Zamítnuto 18. 9. 2026:** na reálných datech (`20260918-155329.rec`, 10 340 dvojic) dávají všechny varianty proložení týž výsledek v rámci rozpětí opakování; pravda k dispozici není, ale rozdíl, který by šlo obhajovat, nevzniká. `LeastSquares` zůstává. Otevře se znovu jen se záznamem s pravdou.
    kroky:
