        stav: hotovo
        kdy: 2026-09-10
      - co: Registr 44 se před během resetuje a po misi vypíná
        stav: hotovo
        kdy: 2026-09-10
      - co: Kalibrace projitá od začátku do konce v simulaci s vnuceným železem
        stav: hotovo
        kdy: 2026-09-15
      - co: "Spustit `mission=magcal` na senzoru s novým kódem"
        stav: hotovo
