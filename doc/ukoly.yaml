  - id: lok-korelace-eskalace-bez-shody
    oblast: lokalizace
    nazev: Eskalace stavu „lokalizace nepodložená mapou" a znovunalezení po ztrátě
    druh: zamer
    stav: otevreno
    nalezeno: 2026-08-20
    popis: >
      Když korelace occupancy gridu s mapou shodu nenajde, korelátor jen mlčí — stav „lokalizace
      nepodložená mapou" si nikdo nečte a navigace věří mrkvi dál stejně. Chybí i schopnost se
      znovu najít: záchytný rozsah skenu je jen ±2,5 m a ±8°, takže po delším výpadku GNSS nebo
      po přenesení robota hierarchický sken principiálně nedosáhne. Kandidát na hrubý
      inicializátor s širokým záběrem je Fourier–Mellinova transformace (jeden výstřel, nízká
      přesnost, sken to dojemní) — jako náhrada skenu byla 20. 8. 2026 zamítnuta, jako
      inicializátor sedí. Až bude z dat vidět, jak dlouhé úseky bez shody v praxi vznikají,
      může `GlobalNavigator` ubrat nebo mrkvi přestat věřit.
    kroky:
      - co: Změřit z dat, jak dlouhé úseky bez shody v praxi vznikají
        stav: otevreno
      - co: Eskalace stavu do `GlobalNavigator` (ubrat, přestat věřit mrkvi)
        stav: otevreno
      - co: Hrubý inicializátor pro široký záběr (kandidát Fourier–Mellin)
        stav: otevreno
