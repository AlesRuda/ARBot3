  - id: lok-koridorsend-nebyl-vypnuty
    oblast: lokalizace
    nazev: Měřicí režim koridoru nebyl měřicí — `corridorsend` v profilu chybí
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-17
    vyreseno: 2026-09-18
    popis: >
      `lok-koridor-merici-rezim` i CLAUDE.md tvrdí, že provozní profil běží s
      `corridorsend=false`, tedy „plná zátěž, nulový vliv na řízení", a týž úkol vede jako
      OTEVŘENÝ krok „`corridorsend=true` — až po opravě magnetometru a přiřazení hrany".
      V `config/pi-provoz.cfg` ale ten řádek 17. 9. **nebyl**, takže platil default `true`
      a korekce se posílaly do fúze. Potvrzuje to i účinná konfigurace v záznamech
      ze 17. 9. (`corridorsend=true (default)`) a report: *poslana pricna korekce 16 z 16 Ok,
      poslana korekce kurzu 16 z 16 Ok*. Upřesnění z gitu (audit 21. 9.): řádek
      `corridorsend=false` v profilu **byl** od 15. 9. (`0e34771`) a měřicí jízda 16. 9. s ním
      jela (`corridorsend=false (profil)` v účinné konfiguraci); odstranil ho autor 17. 9.
      v přípravě na Robotour (`8bf1081`, zakomentováno) a týž den zapsal `true` (`a44b4f4`).
      Měřicí režim tedy platil jeden den, ne „nikdy".
      ⚠️ **Podstatné je, co tím prošlo:** těch 16 korekcí kurzu odešlo v běhu, kde měl koridor
      `abs nesouhlas kurzu` p50 **23,4°** (nezkalibrovaný kompas, viz `hw-zelezo-od-kabelu-kamer`)
      — tedy přesně ta situace, kvůli které měla brána zůstat zavřená. `GateMode.Soft` je
      nezahodí, jen odtlumí.
      Je to vada **dokumentace proti skutečnosti**, ne v kódu: chybí jeden řádek v profilu.
      ⚠️ A ukazuje na obecnější past — „výchozí hodnota je bezpečná" tu neplatí, protože default
      `corridorsend` je `true`; bezpečný stav se musí do profilu napsat, ne předpokládat.
      ✅ **Uzavřeno 18. 9. 2026 opačně, než nález navrhoval:** bezpečný stav se do profilu nezapsal — zapsal se ostrý. Autor `corridorsend=true` zapnul vědomě 17. 9. (`a44b4f4`) a první jízdy 18. 9. ukázaly, že koridor za jízdy dává měření v každém druhém cyklu a fúze se jím řídí (viz `lok-koridor-hranova-lokalizace`). Odstavec v `CLAUDE.md` o „měřicím režimu" přepsán.
    kroky:
      - co: Nález (účinná konfigurace v záznamu proti tvrzení v úkolu i v CLAUDE.md)
        stav: hotovo
        kdy: 2026-09-17
      - co: "Vyřešeno OPAČNĚ: autor 17. 9. zapsal do profilu `corridorsend=true` vědomě (commit `a44b4f4`); dokumentace (`CLAUDE.md`, registr) srovnána 18. 9."
        stav: hotovo
        kdy: 2026-09-17
      - co: "Projít profil, jestli takhle „nezapsaným defaultem\" nevisí i jiná brána — 18. 9.: `mapcorr` v profilu není a jeho default je `false` (bezpečný), `corridorstd/headingstd/hz` 0 = bez odtlumení (zapsané jako komentář); jediná brána s ostrým defaultem byla `corridorsend`"
        stav: hotovo
        kdy: 2026-09-18
