  - id: vid-nativni-knihovna-opravy
    oblast: videni
    nazev: Nativní knihovna měla chybějící exporty na x64 a špatnou volací konvenci na ARM
    druh: vada
    stav: hotovo
    nalezeno: 2026-07-03
    vyreseno: 2026-07-03
    popis: >
      První NUnit testy nad P/Invoke vrstvou `NativeComputeUnit` odhalily, že čtyři funkce
      (`TransformPoint4DImpl`, `Depth2XYZImpl`, `XYZ2PlaneImpl`, `ClearAggregateImpl`) v x64 DLL
      vůbec nebyly exportované (latentní `EntryPointNotFound` i v projekci kamery) a že ARM64
      assembler byl psaný x86 stylem místo AAPCS64 (floaty v jiných registrech), plus chyba
      offsetu ×32. Opraveno a ověřeno na x64, přes Docker/QEMU i na skutečném Orange Pi.
      Cesta `Segment` padá na x64 (`AccessViolation`), v produkci se nepoužívá, její testy
      zůstávají ignorované.
    kroky:
      - co: NUnit testy `NativeComputeUnit`
        stav: hotovo
        kdy: 2026-07-03
      - co: Doplnění exportů v `asm_win_x64.asm`, ochrana singularity v `CalcPlaneParams`
        stav: hotovo
        kdy: 2026-07-03
      - co: Oprava AAPCS64 a offsetů v `asm_linux_arm64.S`, ověřeno QEMU + Orange Pi
        stav: hotovo
        kdy: 2026-07-03
    odkazy:
      - text: build-and-platforms.md
        cesta: doc/build-and-platforms.md
      - text: rozhodnutí 25. 7. 2026 (nativní knihovna se staví CMakem)
