  - id: lok-odometrie-obvod-kola
    oblast: lokalizace
    nazev: Obvod kola je o ~1,8 % větší, než robot ujede — póza na rovince utíká dopředu (12,5 m na 740 m)
    druh: vada
    stav: v-kodu
    vyreseno: 2026-09-26
    nalezeno: 2026-09-26
    popis: >
      Pozorování autora z Track 25. 9. 2026 (`records/test/20260925-142428.rec`, Modřany, rovinka
      k severu 0–450 s): odhad fúze se postupně vzdaluje od GPS. Změřeno `ARBot.Analyze posegps`:
      póza je před GPS podélně o 0,06 m v 10 s, 5,7 m ve 100 s a **12,5 m ve 440 s** (~740 m jízdy),
      příčně jen ~1 m (kurz sedí, IMU − GPS −1,2°). Na přímých úsecích (okno 30 s, změna směru < 3°)
      je dráha z kol / tětiva GPS **1,018** (p10–p90 1,00–1,03, n = 63) a Doppler / kola ve stejných
      oknech 0,982 — dvě nezávislé cesty, stejné číslo. `Profile.WheelRadius = 0,085944 · 0,94`
      (0,94 = „změřené zmáčknutí pneumatiky") je tedy o ~1,8 % velký; odpovídal by činitel ~0,923.
      S `gpsposstd=30` určuje podélnou polohu téměř jen odometrie (σ 0,05 m/s, ~91 Hz), takže chyba
      měřítka jde 1:1 do pózy — a **po zatáčce se změní na příčnou** (`lok-koridor-noedge-po-zatacce`).
      Jedna jízda, jeden povrch; zmáčknutí závisí na zatížení, tlaku a povrchu.
    kroky:
      - co: "Změřeno: kola / tětiva GPS 1,018, Doppler / kola 0,982 (`ARBot.Analyze posegps`)"
        stav: hotovo
        kdy: 2026-09-26
      - co: "Autor opravil konstantu `Profile.WheelRadius`: činitel 0,94 → 0,923"
        stav: hotovo
        kdy: 2026-09-26
      - co: "Ověřit na další jízdě: `posegps`, blok PŘÍMÉ ÚSEKY → kola / tětiva GPS ~1,00"
        stav: otevreno
    odkazy:
      - text: ekf-fusion.md
        cesta: doc/ekf-fusion.md
    devlog: [2026-09-26]
    ceka_na: []

  - id: lok-koridor-noedge-po-zatacce
    oblast: lokalizace
    nazev: Po zatáčce je póza 12 m vedle cesty a koridor ji neopraví — hranu hledá jen do 8 m (`NoEdge`)
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-26
    popis: >
      Track 25. 9. 2026 (`20260925-142428.rec`): podélná chyba 12,9 m z rovinky
      (`lok-odometrie-obvod-kola`) se v první zatáčce (~460 s) změnila na **příčnou**: na cestě
      k východu je póza 12,0–13,0 m severně od GPS, odstup pózy od sítě 11–12 m, GPS od sítě
      0,4–1,5 m (robot fyzicky jel po cestě, lokální plán `Ok`, 1,5–1,6 m/s). Koridor po celou
      dobu (490–570 s) hlásí **`NoEdge`** (119–198 cyklů za 10 s) a nepošle nic: přiřazení hledá
      hranu jen do `CorridorLocalizerConfig.MaxEdgeDistanceM` = **8 m** od pózy. Oboustranný
      koridor přitom měřil jen v úseku 290–440 s (way 154101921), jinde jen z jedné hrany.
      Jakmile se ~580 s dostala do 8 m nějaká hrana, jednohranová měření s inovacemi −2,7 / +3,2 /
      +2,0 m (p50 za 10 s) stáhla pózu limitem `corridorslew=0,5` za ~30 s o ~10 m zpět k GPS
      (odchylka 12,6 → 2,3 m). Která hrana to byla (správná, nebo příčná), z toho vidět není.
      Koridor je tak slepý právě tehdy, když je chyba největší — a GPS s σ 30 m pózu nevrátí.
    kroky:
      - co: "Změřeno: `NoEdge` po zatáčce, odstup pózy od sítě 11–12 m, pozdní korekce ~10 m za 30 s (`ARBot.Analyze posegps`, `corridor`)"
        stav: hotovo
        kdy: 2026-09-26
      - co: "Příčina opravena (`lok-odometrie-obvod-kola`) a 8m limit vypnut (autor): `MaxEdgeDistanceM = ∞`"
        stav: hotovo
        kdy: 2026-09-26
      - co: "Rozhodnout (autor): χ² přiřazení s podlahou `assocfloorlat=3` pořád zamítne 12 m (χ² ≈ 16 > 9,21 → `EdgeMismatch`) — nechat, nebo podlahu vázat na skutečnou nejistotu pózy (filtr hlásí 0,1 m při chybě 12 m)"
        stav: otevreno
    odkazy:
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
    devlog: [2026-09-26]
    ceka_na: []

  - id: lp-grid-posun-pomalou-korekci
    oblast: lokalni-planovani
    nazev: Postupná korekce pózy (limit kroku) nesmaže grid — robot se ocitne v „historicky" nesjízdných buňkách
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-26
    popis: >
      Track 25. 9. 2026 (`20260925-142428.rec`): korekce z koridoru posunuly pózu za ~30 s o ~10 m
      (`lok-koridor-noedge-po-zatacce`), ale po krocích ~2 cm na snímek (`corridorslew=0,5` m/s).
      `PoseJumpDetector` porovnává posun s `|v|·dt + 0,5 m`, takže nezasáhl ani jednou (report
      `nav`: jediný skok 0,59 m ve stání) a world-kotvený grid zůstal namalovaný v rámci špatné
      pózy. Robot se po korekci ocitl v buňkách, které tam dřív zapsala tráva viděná z posunuté
      pózy: `EscapingBlocked` 14:34:18–14:34:28 (167 plánů za 10 s) a `GoalUnsafe`. Limit kroku
      byl navržen právě tak, aby detektor nespouštěl (21. 9.) — to platí pro malé korekce, ne pro
      součet 10 m. Totéž se dá čekat u každé velké, ale postupné opravy pózy.
      **Únikový manévr to zvládl** (autor: „to by měl řešit únikový manévr"): v obou epizodách
      (první zatáčka 14:32:22–28, po korekci 14:34:18–28) robot z blokované buňky vyjel za 6–10 s
      a pokračoval (`Ok`, v 1,66 resp. 0,22 m/s → pak přerušení timeoutem). Únik ale řeší jen
      „stojím v blokované buňce", ne „celá okolní mapa je posunutá" — posunutý grid se přepisuje
      až tím, co kamery znovu uvidí. S opraveným obvodem kola by velké korekce neměly vznikat.
      **Zastavení na konci ale způsobil jiný důvod:** 14:34:39 `Track: mise PRERUSENA - timeout
      jizdy k mistu 1/2 (limit 600 s)` (`mise-track-timeout-delka-useku`).
    kroky:
      - co: "Změřeno: `EscapingBlocked` hned po korekci ~10 m, detektor skoku nezasáhl (`posegps`, `nav`)"
        stav: hotovo
        kdy: 2026-09-26
      - co: "Rozhodnout léčbu (autor): hlídat SOUČET korekcí (posun pózy proti odometrii za okno) a při překročení gridu věřit méně / smazat, nebo grid při korekci posouvat"
        stav: otevreno
