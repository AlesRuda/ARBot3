      - co: Důkaz, že korekce kurzu funguje se slabým kompasem
        stav: hotovo
        kdy: 2026-08-22
      - co: "Přepočet poměru po podlaze σ kompasu a škrcení na 1 Hz (koridor ~150–1000:1)"
        stav: hotovo
        kdy: 2026-09-15
      - co: "Změřit korekci kurzu z koridoru na zařízení — 18. 9.: `odhad − IMU yaw` z −0,01 ± 0,06° na +0,39 ± 1,88°, odhad ke GPS kurzu blíž než kompas (−1,0° proti −3°)"
