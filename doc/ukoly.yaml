  - id: hw-uart-cteni-po-bajtu
    oblast: hw
    nazev: GPS ztrácela 92 % měření, protože se port četl po jednom bajtu
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-31
    vyreseno: 2026-08-31
    popis: >
      Autor viděl GPS na 0,8 Hz s občasným skokem na 3,2 Hz; první vysvětlení „u-blox má
      výchozích 1 Hz" bylo hádání. Přijímač ve skutečnosti jede 10 Hz a k tomu posílá ~200 NMEA vět
      za sekundu, ale `Uart.Read(int)` bral z portu jeden bajt a při prázdném portu spal 10 ms.
      Změřeno vedle sebe na zařízení: 0,88 proti 10,09 měření/s. Čtení si teď bere všechno, co
      v portu je, do vnitřního bufferu; ostatní způsoby čtení buffer nejdřív vyprázdní, aby se
      styly nemíchaly. Ověřeno na zařízení reálnými drivery (GPS 9,99 Hz, IMU i motor beze změny).
      Vypnutí NMEA v přijímači (87 % dat) se vědomě neudělalo — vada byla v našem čtení.
    kroky:
      - co: 'Změřit přijímač proti driveru na volném portu'
        stav: hotovo
        kdy: 2026-08-31
      - co: 'Vnitřní buffer v `Uart.Read(int)`, ověřeno na zařízení'
        stav: hotovo
        kdy: 2026-08-31
