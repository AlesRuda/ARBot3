    nalezeno: 2026-09-13
    vyreseno: 2026-09-13
    popis: >
      Robota šlo zastavit jen tím, že mu mise odebrala regulátor — jenže táž vlastnost nese
      „kam jet" i „smím jet" najednou, takže jakmile chce robota podržet někdo jiný než mise
      (zotavení kamer, servisní okno), začne se o ni přetahovat a vyhraje ten, kdo psal poslední.
