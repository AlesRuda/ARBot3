      - text: path-following.md
        cesta: doc/path-following.md
      - text: plan-drive-hold.md
        cesta: doc/plan-drive-hold.md
    devlog: [2026-09-22]
    ceka_na: []

  - id: nast-profil-sceny
    oblast: nastroje
    nazev: Profil scény před robotem — surové body hloubky a vysvětlení klasifikace buněk gridu
    druh: zamer
    stav: v-kodu
    nalezeno: 2026-09-23
    vyreseno: 2026-09-24
    popis: >
      Nástroj na ladění detekce terénu (Tools → Profil scény, `open=profile`). Ukazuje graf z(r)
      v jednom azimutu polárního gridu: surové body z 16 sloupců hloubky, ze kterých buňky
      vznikly, a přes ně buňky se třídou, referenční rovinou ± tolerancí a MeanZ/StdZ/MaxZ. Pod
      myší řekne, které kritérium klasifikace buňka překročila. Vysvětlení počítá tentýž kód jako
      `CameraFrameProcessor`, nesoulad s gridem hlásí. Běží v Run i ve View (hloubka i projekce
      jsou v záznamu). Vznikl kvůli otevřenému rozporu v `lp-drsnost-povrchu-rychlostni-strop`
      (náklon ukazuje hrbol, grid ne). Nad záznamem simulace: třída sedí ve všech 332 970 buňkách,
      počty bodů v 16 buňkách ±1 mezi sousedními prstenci (zaokrouhlení nativní SIMD cesty).
      Nad terénním záznamem zatím neběžel.
    kroky:
      - co: "Fáze 1: graf z(r) v azimutu gridu, surové body + buňky + vysvětlení klasifikace, Run i View, `profileshot=`"
        stav: hotovo
        kdy: 2026-09-24
      - co: "Projít terénní záznam z Robotouru (místo zakopnutí v Kolo3b) — je hrbol v bodech vidět a pohltí ho agregace buňky?"
        stav: otevreno
      - co: "Fáze 2: 3D pohled na mračno (rotace/posun/zoom) — samostatný návrh, softwarová projekce vs. OpenGL"
        stav: otevreno
