  - id: lok-ekf-pitch-roll-stav
    oblast: lokalizace
    nazev: Náklon robota jde mimo fúzi a nezná svůj zdroj
    druh: vada
    stav: otevreno
    nalezeno: 2026-08-11
    popis: >
      Řídicí smyčka bere roll a pitch z posledního došlého IMU vzorku, který nenese identitu
      zdroje - při dvou IMU (VN100 a T265) může náklon mezi tiky přeskakovat mezi čidly s jinou
      montáží a kvalitou. Obchází to fúzi: bez gatingu, bez kovariance a bez dopředikování do
      času tiku, zatímco zbytek stavu robota fúzovaný je. Návrh je přidat náklon do stavového
      vektoru EKF jako regulérní měření; je to zásah do filtru a zatím se neudělal.
      Od 13. 9. 2026 je T265 z robota odpojená natrvalo (rozhodnutí v `decisions.md`), takže
      přeskakování náklonu mezi dvěma IMU v provozu nenastává; zůstává obcházení fúze (bez
      gatingu, kovariance a dopředikování) a chybějící identita zdroje v `IMUState` pro případ,
      že by druhé IMU přibylo.
