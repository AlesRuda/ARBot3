  - id: lp-cil-astar-zona
    oblast: lokalni-planovani
    nazev: Cíl lokálního plánovače je zóna, ne jediná buňka
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-14
    vyreseno: 2026-09-18
    popis: >
      Robot nedokázal dojet k prvnímu bodu trasy: k 44 m jel 9,5 minuty. Cílem A* byla jediná
      buňka, takže mrkev v trávě nebo u překážky byla nedosažitelná jako celek — plán skončil na
      nejbližší bezpečné buňce, stav `GoalBlocked` a robot tam zastavil a čekal, ačkoli jiná část
      cílové zóny dosažitelná byla (nad záznamem ze 14. 9. `GoalBlocked` 24 %, mrkev nedosažitelná
      v 52 % plánů). Globální vrstva v zónách myslela už od 12. 9., lokální ne. Teď je cíl zóna
      (`carrotradius=`; průjezdní mrkev je bod, při dojezdu se použije dojezdový poloměr zmenšený
      o rezervu 0,5 m), heuristika se měří k okraji zóny a A* vrací nejlevnější buňku na dojetí.
      Není to lék na špatnou mapu — blokovaných buněk bylo p50 27,7 % při rozbitém kurzu, takže
      část nedosažitelnosti může být chyba gridu, kterou zóna zakryje.
      ✅ **18. 9. 2026 na zařízení:** `GoalBlocked` 24 → 2 %, `GoalUnsafe` 19 → 2 %, mrkev nedosažitelná 52 → 33 % — zároveň s opraveným kurzem, takže podíl zóny a podíl kurzu se z jednoho záznamu nerozdělí.
      Zóna tedy na zařízení běžela 18. 9. i na Robotouru 19. 9. Rozbor gridu v okamžicích
      nedosažitelnosti (kolik je chyba mapy) je věcně táž otázka jako `lp-zasek-v-blokovane-mape`
      a vede se tam; téma uzavřeno rozhodnutím autora 21. 9. 2026.
    kroky:
      - co: Měření `ARBot.Analyze localplan` nad záznamem ze 14. 9.
        stav: hotovo
        kdy: 2026-09-14
      - co: Zóna jako cíl A*, poloměr jako vlastnost cíle, tři pasti hlídané testy
        stav: hotovo
        kdy: 2026-09-14
      - co: "Podívat se na grid v okamžicích nedosažitelnosti — přesunuto do `lp-zasek-v-blokovane-mape` (táž otázka)"
        stav: hotovo
        kdy: 2026-09-21
      - co: "Přeměřit `localplan` po nasazení — 18. 9. (`20260918-155329.rec`): `GoalBlocked` 2 % / `GoalUnsafe` 2 % (14. 9.: 24 / 19 %), mrkev nedosažitelná 33 % (52 %), s dobrým kurzem"
        stav: hotovo
        kdy: 2026-09-18
    odkazy:
      - text: occupancy-and-local-planning.md
        cesta: doc/occupancy-and-local-planning.md
    devlog: [2026-09-14, 2026-09-18, 2026-09-21]
    ceka_na: []

