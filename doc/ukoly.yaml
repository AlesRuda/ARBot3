      takže detektor přehrazení rozhoduje jen z toho, že plán nevznikl, a nerozliší přehrazenou
      cestu od dočasně neznámé mapy. Zapsáno jako zbývající krok globální navigace 13. 8., od té
      doby nedotčeno; rozhodnutí odložit není zapsané.
