  - id: nast-simulace-trava-render
    oblast: nastroje
    nazev: Tráva v simulaci se renderovala špatně — šev na hranici, mrtvé parametry scény, tráva bez výšky
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-23
    vyreseno: 2026-08-24
    popis: >
      Tři vady renderu virtuálních kamer, které zkreslovaly měření koridoru. Drsnost trávy
      rozdvojila roviny vozovky a trávy, takže paprsky mířící na hranici netrefily ani jednu a
      podél celého okraje běžela čára bez hloubky (23 % sloupců bez bodu); správná fyzika je svislá
      stěna trávy na okraji — po opravě 96,7 % sloupců s bodem a chyba polohy p50 0,151 → 0,055 m.
      Pak se ukázalo, že `grassheight=` / `grassrough=` / `depthnoise=` z UI i z příkazové řádky
      neměly žádný účinek: `VirtualHWOptions.Scene` měla vlastní výchozí instanci, takže se
      renderovalo z jiné scény, než do které se hodnoty zapisovaly — tři hypotézy z úvahy padly,
      rozhodlo až měření výstupu běžící aplikace (`ARBot.Analyze grid`). A barevný render protínal
      jen rovinu vozovky, takže vyvýšená tráva nezakrývala cestu za sebou; teď jde stejnou cestou
      jako hloubka (rychlá cesta při nulové trávě zůstává).
