  - id: lok-kurz-inicializace-ekf
    oblast: lokalizace
    nazev: První korelace byla chybná, protože se kurz neinicializoval
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-19
    vyreseno: 2026-08-19
    popis: >
      Fúze při startu inicializovala jen polohu, kurz startoval na nule a ke skutečnému kurzu
      dojížděl přes měření; lokální mapa se mezitím zapisovala pootočená až o 170° a první korekce
      z ní měla opačné znaménko. Pojistka proti skoku pózy byla o argument krátká — rotaci
      stojícího robota neviděla. Kurz se teď inicializuje (`InitializeHeading`) a detektor skoku
      hlídá i rotaci; první cyklus vychází správně ve čtyřech ze čtyř běhů.
    kroky:
