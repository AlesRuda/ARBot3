    popis: >
      File → Export GPX… ve View uloží celý záznam do GPX 1.1: stopa surových platných GPS fixů
      (ele, sat, hdop) a stopa fúze (RobotStateMsg) převedená přes počátek mapy ze záznamu
      (`MapMsg.BuildOrigin`, tatáž definice jako runtime; bez mapy se stopa vynechá). Nový
      segment při mezeře nad 2 s, póza proředěná na 10 Hz. Čas je UTC s posunem odvozeným z GPS
      (`FixTime`), protože razítka jsou místní čas nahrávajícího stroje bez zóny; bez GPS času
      se použije zóna PC. Fúzní stopa sedí na `GlobalNavMsg` runtime na 0,000 m (5 záznamů ze
      simulace); odvození UTC z GPS kryjí jen testy — na záznamu ze zařízení neověřeno.
