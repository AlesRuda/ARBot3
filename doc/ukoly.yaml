    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-19
    vyreseno: 2026-08-25
    popis: >
      Nejistota korelace se počítala ze zakřivení normalizovaného skóre, takže nevěděla, kolik
      buněk za ní stojí — malý oblak důkazu hlásil větší jistotu než velký a na cestě rovnoběžné
      s osou gridu vycházela falešná podélná jistota. Případ „malý oblak obelže hlídač volné osy"
      se ukázal být touž vadou a vědomě se neopravoval zvlášť. Léčba přišla 25. 8.: sigma se
      škáluje vahou informativního důkazu (`ReferenceInformativeEvidence`), měřeno proti tuze
      posunuté mapě. Po odečtení chyby fúze v měřidle (samostatné téma) vyšla σ naopak ~1,25× konzervativní a vědomě se neopravuje; na zařízení neběželo.
    kroky:
      - co: Falešná podélná jistota potvrzena za běhu (SigmaLoose konečná ve všech cyklech)
        stav: hotovo
        kdy: 2026-08-19
      - co: "Malý oblak obelže hlídač — změřeno, že je to táž vada, rozhodnuto neopravovat zvlášť"
        stav: hotovo
        kdy: 2026-08-20
      - co: "Rozvaha korelace přes FFT / Fourier-Mellin — jako jiný estimátor by pomohla, odloženo do rozhodnutí o přestavbě"
        stav: hotovo
        kdy: 2026-08-20
      - co: Honestní sigma změřena nástrojem `ARBot.Analyze sigma` a opravena
        stav: hotovo
        kdy: 2026-08-25
    odkazy:
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
      - text: rozhodnutí 25. 8. 2026
        cesta: doc/decisions.md
    devlog: [2026-08-19, 2026-08-20, 2026-08-25]

  - id: lok-korelace-tri-podminky-naostro
    oblast: lokalizace
    nazev: Tři podmínky, než korekce z mapy pustit naostro
    druh: zamer
    stav: otevreno
    nalezeno: 2026-08-20
    popis: >
      Korelace s naměřenou sigmou 0,1 m přehlasuje GPS zhruba 400 : 1, takže záchyt na souběžné
      cestě by unesl pózu a nikdo by to nezastavil. Než se korekce pustí do řízení, musí platit
      tři věci: honestní sigma, rychlostní limit na aplikovanou korekci a strop na nesouhlas
      s GPS; k tomu měkký gating místo tvrdého zamítání. První podmínka je od 25. 8. splněná,
      druhá nemá naměřenou naléhavost, třetí je naměřeně nutná a chybí.
      Podmínka 2 od 21. 9. 2026: mechanismus (`IMeasurement.MaxStep`, nafouknutí `R` v EKF,
      `corridorslew=`) v kódu existuje, ale nastavuje ho jen koridor — `MapCorrelator` ho
      nepoužívá; naléhavost se 19. 9. změřila na koridoru v téže fúzi (skoky pózy 0,6–4 m,
      `lok-koridor-skoky-pozy`). Koridor šel 17. 9. naostro bez podmínek 2 a 3, takže tyhle
      podmínky dnes gatují jen `mapcorr=`, který na zařízení nikdy neběžel.
    kroky:
      - co: Podmínka 1 — honestní sigma
        stav: hotovo
        kdy: 2026-08-25
      - co: "`GateMode.Soft` místo `Reject` (tvrdý gate zahazoval právě potřebné korekce)"
        stav: hotovo
        kdy: 2026-08-25
      - co: Podmínka 2 — rychlostní limit na aplikovanou korekci (proměřit v běhu bez GPS)
        stav: otevreno
      - co: Podmínka 3 — strop na kumulovaný nesouhlas s GPS
        stav: otevreno
    ceka_na: [lok-kompas-sigma-podlaha, lok-koridor-skoky-pozy]
    odkazy:
      - text: rozhodnutí 20. 8. 2026
        cesta: doc/decisions.md
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
    devlog: [2026-08-20, 2026-08-25]

  - id: lok-korekce-zahozene-neviditelne
    oblast: lokalizace
    nazev: Fúze zahazovala opožděné korekce a nebylo to vidět
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-13
    vyreseno: 2026-08-21
    popis: >
      Měření starší než okno historie EKF se tiše zahodilo — hláška šla jen do `Debug`, které
      v Release neexistuje, a telemetrie dál hlásila „Ok". V Debug buildu tak propadlo 51 z 55
      korekcí (latence 1,4 s proti oknu 1 s), přičemž skutečná příčina byla latence, ne velikost
      okna. Přibylo počítadlo zahozených podle zdroje, hláška přes `Trace` s údajem „o kolik pozdě",
      verdikt měření ve zprávě `MeasurementDiagMsg` (do té doby mrtvé DTO) a sloupce v telemetrii.
      Potřeba vidět, co fúze s měřením udělala, byla zapsaná už 13. 8. jako otevřený úkol; tahle vada ji proměnila v konkrétní zprávu.
    kroky:
      - co: Zapsáno jako otevřený úkol „diagnostika EKF do streamu a záznamu“
        stav: hotovo
