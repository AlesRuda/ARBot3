      nekorigovat vůbec): tvrdý strop na innovaci zahazuje právě ty velké korekce, které jsou
      potřeba, takže chyba pózy zůstane nad stropem navždy a hrana je němá. Zrušeno, ne
      přenastaveno: rozsah `dLat` je omezený konstrukcí (≲ 10 m), takže práh „jen jako pojistka“
      by byl mrtvý kód a nižší řeže do živého. Odemklo to i učení šířky (`widths.Add` stálo až za
      branou) — týž zámek, jaký se 15. 9. odstraňoval o patro níž. Hodnota enumu
