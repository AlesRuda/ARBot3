  - id: nast-replay-krokovani-a-panely
    oblast: nastroje
    nazev: Ladění nad záznamem — krok po témž proudu, hodnota pixelu, správné panely kamer
    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-16
