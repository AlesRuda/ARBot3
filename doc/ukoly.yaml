  - id: lp-regulator-kmitani-rotace
    oblast: lokalni-planovani
    nazev: Robot cuká — kvantovaný příkaz rotace kmitá a přes vazbu na rotaci trhá i dopřednou rychlost
    druh: vada
    stav: v-kodu
    vyreseno: 2026-09-25
    nalezeno: 2026-09-25
    popis: >
      Pozorování autora z FreeRun 25. 9. 2026: robot nejede plynule. Rekonstrukce regulátoru
      (`ARBot.Analyze drive` nad `20260925-144658.rec`): příkaz rychlosti se mezi takty (10 Hz) mění
      o víc než 0,1 m/s ve **40,5 %** taktů (4 skoky za sekundu), a **84 %** těch skoků nedělá
      obálka, ale **vazba dopředné rychlosti na dobu dorovnání rotace** (`SpeedLimit`,
      `d/(4·T_rot)`). Rotace přitom kmitá: znaménko příkazu `ω` se mění **3,1× za sekundu** při
      úhlu na cíl p50 jen 1°, `|ω|` fúze p50 0,14 rad/s. Příčina je v diskrétním profilu
      (`TrapezoidMotionProfile.Compute`, převzatý z ARBot2): počet kroků `ne` se nad 2 zaokrouhluje
      dolů a výsledek násobí 0,9, takže příkaz skáče po kvantech — rychlost po **0,045 m/s**
      (0,810 / 0,855 / 0,900…), rotace po **0,220 rad/s** (= 0,045 / polovina rozchodu; přesně tahle
      hodnota je ve 24,6 % taktů, 0,440 ve 4,1 %). Malý úhel tak dostane celé kvantum, přestřelí,
      a protože `T_rot` počítá i s dobrzděním aktuální `ω`, kmitání zvedá `T_rot` a srazí rychlost.
      Ve FreeRun je to vidět víc než v Track (tam je `d` ~5,6 m místo 1,4 m, vazba váže v 11 % taktů,
      skoků je 14,5 %), rotace ale kmitá i tam (2,1 změny znaménka za sekundu).
      **Rozbor příčiny (25. 9. 2026):** akční člen je rychlý — model „mrtvá doba + 1. řád" proložený
      ze záznamu dává τ 0,04–0,06 s, T 0,07–0,08 s, K 1,1–1,15 (gyro i kola shodně). Kmitání tedy
      nedělají motory, ale zákon a jeho buzení: `Rot2RotSpeed` má u malých úhlů zesílení ~6 s⁻¹
      (1° → 0,106 rad/s), mezi ~2,5° a 10° plochý schod 0,22 rad/s (relé) a `T_rot` nikdy pod 0,2 s.
      Buzení je **přeplánování**: s novým plánem skočí úhel na cílový uzel mezi takty o p50 1,1°,
      p90 4,5° (se starým plánem 0,7 / 1,8°, což je jen vlastní rotace) — uzly leží ve středech
      buněk 5 cm a plán se mění 16×/s. Simulace uzavřené smyčky s naměřeným akčním členem, terénní
      poruchou a rozptylem cíle 5 cm reprodukuje realitu (dnešní zákon 3,14 změny znaménka/s proti
      naměřeným 3,1); bez rozptylu cíle jen 0,7. Tamtéž: mrkev 3 m srazí kmitání na 2,15/s a skoky
      rychlosti z vazby na rotaci zmizí; zákon „sqrt s lineární zónou" (`k = 2,5 s⁻¹`, mimo zónu
      tentýž časově optimální `√(2α|β|)`) dá 1,24/s při 1,4 m a **0,19/s při 3 m**, za cenu příčné
      odchylky rms 2 → 3 cm (ε je 10 cm). Spojitý `√` bez lineární zóny je horší než dnešek (2,7/s).
      Simulace je zjednodušená (přímka, konstantní v), ověřit to musí jízda.
      **Rozbor `Compute` (25. 9.):** diskrétní vzorec plánuje trojúhelník z aktuální rychlosti
      a vrací jeho vrchol, ačkoli rampu dělá motorová jednotka. Důsledky: pevný bod při stálé
      vzdálenosti cíle (1,4 m → 0,855 m/s = medián FreeRun, 3 m → 1,305) hluboko pod `√(2ax)`,
      kvantování 0,045 m/s a hlavně **žádné plné brzdění, když už robot nestihne zastavit** (vrací
      ~0,6–0,9·`vs`; rotace 1° při 0,5 rad/s k cíli → 0,204 rad/s). Oprávněné je jen držení příkazu
      po takt, spojitě `v = −a·L + √((a·L)² + 2a·x + ve²)`; u nuly dává zesílení `1/L`.
      **Simulace profilu se zpožděním `L` (25. 9.)** nad skutečnými `PathPlanner`/`PathResult`,
      s naměřeným akčním členem (dopředně rampa 0,5 m/s², rotace τ 0,05 / T 0,08 / K 1,1), `T_rot`
      nového profilu = `2·√(|β|/α)`. FreeRun, mrkev 3 m (5 běhů, šum): dnes 1,305 m/s a 1,83 změny
      znaménka ω/s; `L = 0,3` 1,59 m/s / 0,44; **`L = 0,4` 1,54 m/s / 0,20**; `L = 0,5` 1,50 / 0,08.
      Mrkev 1,4 m: dnes 0,855 / 2,59, `L = 0,4` 0,99 / 1,05. Cena: příčná odchylka rms 2,5 → 4,2 cm
      (`L = 0,4`, mrkev 3 m). Dojezd na cíl 5 m: `L ≥ 0,2` bez přejetí, `L = 0,1` přejede 8 cm
      (potvrzuje, že člen se zpožděním je nutný). Zatáčka 90°: `L ≥ 0,3` bez změny znaménka ω,
      `L = 0,4` odchylka 0,42 m a překmit kurzu 9° proti dnešním 0,51 m / 11,8°; `L ≤ 0,15` horší
      než dnes. Simulace nemodeluje zpoždění fúze (stav je pravda) — to mluví spíš pro větší `L`.
    kroky:
      - co: "Změřeno: kvantování příkazu, změny znaménka rotace, podíl skoků z vazby na rotaci (`ARBot.Analyze drive`)"
        stav: hotovo
        kdy: 2026-09-25
      - co: "Změřena dynamika akčního členu a buzení přeplánováním (`drive`, bloky DYNAMIKA ROTACE a `|d beta|`), simulace zákonů uzavřené smyčky"
        stav: hotovo
        kdy: 2026-09-25
      - co: "Simulace profilu se zpožděním pro `L` 0,1–0,5 s (FreeRun, dojezd, zatáčka)"
        stav: hotovo
        kdy: 2026-09-25
      - co: "Léčba (autor): `LatencyMotionProfile` se zpožděním `L = 0,4 s`, výchozí (`motionprofile=latency`, `motionlatency=`; `trapezoid` = původní), `PathResult` beze změny; testy zákona a uzavřené smyčky (`LatencyMotionProfileTests`)"
        stav: hotovo
