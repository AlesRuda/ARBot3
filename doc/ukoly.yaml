    ceka_na: []

  - id: lp-reflex-klopeni-zadni-kolo
    oblast: lokalni-planovani
    nazev: Reflex proti překlopení při najetí zadního kola na hrbol (nebrzdit, případně přidat)
    druh: zamer
    stav: otevreno
    nalezeno: 2026-09-22
    popis: >
      Druhá vrstva k rychlostnímu stropu z mapy, nezávislá na kameře: hrbol se ohlásí rázem
      předních hnaných kol ve VN100 (100 Hz) a zadní pasivní kolo na něj najede o `rozvor / v`
      později — první špička tedy OHLAŠUJE druhou předem a řídicí smyčka si může naplánovat okno
      kolem ní. V okně platí dolní mez příkazu `v_aktuální + k · rampa · Δt`: `k = 0` zakáže
      brzdění z obálky, `k = 1` na okno přidá (rampy jsou obě 0,50 m/s², takže brzdění působí
      jednu rampu v neprospěch a zrychlení jednu ve prospěch). Zákaz pomůže jen tehdy, když by
      robot v tu chvíli brzdil; přidání zabere vždy, ale je to aktivní zásah proti plánovači.
      Podpis dvou špiček v odstupu daném rychlostí filtruje falešné spouštěče (samotný náklon
      vzniká i při brzdění a na svahu). Meze: smyčka posílá příkaz jen 10×/s (`Profile.Ts`
      = 100 ms, scheduler má změřené zpoždění až 108 ms), takže okno musí být 2–3 takty, ne jeden;
      nouzové, držené i kolizní zastavení vyhrávají vždy; jen jízda vpřed nad minimální rychlostí
      (při couvání jede kolečko první). Zapadá vedle `StopHold` jako jeho protějšek („teď
      nezpomaluj" proti „smím jet"), oba stojí vedle regulátoru, ne v něm. Který `k` má smysl,
      rozhodne měření: náklon při druhé špičce rozdělený podle znaménka derivace příkazu v tu
      chvíli (zrychloval / držel / brzdil) — přirozený experiment, který se za čtyři kola
      Robotouru odehrál mnohokrát.
      ZMĚŘENO 22. 9. 2026 (`ARBot.Analyze bumps` nad `records/Robotour2026/`), ve dvou kolech:
      nejdřív přes celý záznam (záporně), pak — na upřesnění autora, KDY se na trati zakoplo
      o kořeny pod asfaltem (Kolo3b 14:12:20–14:13:00) — i nad tím oknem, a tam vyšlo něco jiného.
      (a) SPOUŠTĚČ: ANI POTVRZEN, ANI VYLOUČEN. Přes 799 m žádná dvojice špiček (autokorelace jen
      klesá, průměr přes 521 rázů bez hrbolku, 91,3 % spárovaných je POD náhodou 93,7 %).
      Autor pak doplnil geometrii (ostruha MEZI hnanými koly, rozvor ~0,35 m při přímé jízdě,
      mění se při manévrování; příčné defekty ale zasáhnou všechna kola), z čehož plyne ostrá
      předpověď: ozvěna na 0,35 m u PŘÍČNÝCH defektů a při PŘÍMÉ jízdě. Měřeno (`--rozvor=`,
      `--straight=`, dělení podle odezvy do strany) a NEPOTVRDILO SE: ve třech drsných úsecích
      Kola 3b je hodnota na 0,35 m u podmnožiny „příčný + rovně" 1,18 / 0,80 / 0,54 proti pozadí
      1,50 / 0,92 / 1,72, tedy nikde nad pozadím, a vrchol putuje mezi 0,28 a 1,70 m.
      ⚠️ ODVOLÁN mezitímní závěr „v úseku s kořeny druhý vrchol JE na 0,25–0,30 m" — vyšel
      z jednoho okna na jedné ose dráhy a se změnou okna nebo osy mizí.
      Data to ale ani nevyvracejí: po podmínce zbývá 6–12 událostí na úsek, osa dráhy je PRÁVĚ
      v okamžiku události nespolehlivá (odometrie se integruje z kol, která prokluzují; náhradní
      osa „rychlost před událostí × čas" nepočítá se skutečným zpomalením — obě dávají jinou
      odpověď, 0,28 proti 0,23 m), rozvor sám není konstanta (ostruha se vytáčí) a ostruha je
      lehce zatížená, takže její ráz může být prostě slabý.
      (b) BRZDĚNÍ KLOPENÍ NEZHORŠUJE — p50 1,54° při brzdění proti 1,42° při držení, jenže tentýž
      rozdíl vyjde i u PRVNÍCH špiček (1,55 / 1,41) a na gyrem měřené veličině není rozdíl žádný
      (2,60 / 2,64°). Je to „na hrbolaté zemi se častěji brzdí", ne „brzdění klopí"; Kolo3a i Kolo4
      souhlasí. Smyčka navíc v okamžiku druhé špičky brzdí jen v 6,8–11,5 % případů.
      (c) ALE KLOPENÍ MALÉ NENÍ. První verze tohohle záznamu tvrdila „gyrem potvrzené maximum ~6°,
      velké výchylky jsou artefakty" — bylo to OBRÁCENĚ, vadná byla kontrolní veličina: integrace
      gyra přes celé okno vyrušila fázi nosem nahoru proti fázi dolů. Po opravě (integrál se při
      změně smyslu nuluje) je maximum klopení dopředu 18,06°, gyrem potvrzeno 14,09°, rozkmit
      vrchol-vrchol 19,78°, celozáznamové maximum z gyra 19,32°. Zakopnutí 14:12:52: robot se
      předními koly vyhoupne na +9,7°, za 0,75 s se sklopí na −9,9°.
      (d) ČAS NA REFLEX JE — od prvního znatelného pohybu k nejhoršímu sklopení 0,5–0,75 s, tedy
      5–7 taktů; obava „okno musí být 2–3 takty" vycházela z odstupu špiček, na velkých událostech
      je času víc.
      ZŮSTÁVÁ OTEVŘENÉ, ale s jinou otázkou než na začátku: ne „naprogramovat reflex", nýbrž
      „existuje spouštěč?". Bez rozvoru a bez odpovědi, jestli zadní kolečko jezdí ve stopě hnaných
      kol, se dál nehne.
    kroky:
      - co: "V měřidle sloupec: znaménko derivace příkazu při druhé špičce a náklon po skupinách zrychloval / držel / brzdil"
        stav: hotovo
        kdy: 2026-09-22
      - co: "Ověřit ze záznamů, jestli se dvojice špiček vyskytuje — přes celý záznam NE, v úseku s kořeny ANO, druhý vrchol na 0,25–0,30 m (dvě nezávislé metody)"
        stav: hotovo
        kdy: 2026-09-22
      - co: "Geometrie podvozku zjištěna od autora: ostruha mezi hnanými koly, rozvor ~0,35 m při přímé jízdě, mění se při manévrování; příčné defekty zasáhnou všechna kola"
        stav: hotovo
        kdy: 2026-09-22
      - co: "ZÁMĚRNÝ POKUS místo dolování ze závodních dat: přejet JEDNU známou příčnou překážku (lať, práh) několikrát rovně při 0,4 a 1,1 m/s. Poměr rychlostí 2,75 oddělí ozvěnu (pevná vzdálenost) od kmitu karoserie (pevný čas) jednoznačně — v Robotouru byl poměr jen 1,38 a předpovědi se lišily o 0,09 m. Zároveň dá opakované události se známou geometrií, kterých je dnes po podmínce jen 6–12 na úsek"
        stav: otevreno
      - co: "Reflex v `ControlLoop` — až bude potvrzený spouštěč; brzdění klopení prokazatelně nezhoršuje, takže `k = 0` odpadá a smysl by měl jen `k = 1` (přidat)"
        stav: otevreno
