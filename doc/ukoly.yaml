  - id: hw-neopixel-armbian
    oblast: hw
    nazev: Driver NeoPixel (WS2812) přes SPI na Armbianu
    druh: zamer
    stav: v-kodu
    nalezeno: 2026-07-07
    vyreseno: 2026-07-07
    popis: >
      `ArmbianSpiNeoPixelDriver` posílá sub-bity LED pásku jedním zápisem přes `/dev/spidev0.0`;
      `SpiDevice` vstupuje jako parametr, vlastníkem je volající. Buildy pro OrangePI zelené,
      ale na desce nikdy neběželo — časování `PulseConfig` proti SPI hodinám a reálný běh
      animační smyčky (`NeoPixelProcessor`: blinkry, KnightRider, Alert) zbývá ověřit. Driver
      navíc není v runtime nikde založený: blok NeoPixel v `ARBotHW.Init` je od 11. 7. 2026
      zakomentovaný (jen FTDI varianta pro Windows), takže na Pi by nesvítilo nic ani s hotovým
      driverem.
