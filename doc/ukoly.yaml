  - id: lok-gps-kvalita-fixu
    oblast: lokalizace
    nazev: Fúze brala každý GPS fix s toutéž sigmou
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-06
    vyreseno: 2026-09-06
    popis: >
      Na náhledu ujela poloha o 570 m, zatímco robot stál. Fúze brala každý fix s `IsFixed`
      a vždy se sigmou 1,5 m, ačkoli zpráva nese počet družic i DOP; u-blox navíc jen přetypovával
      `fixType`, takže i samotný mrtvý odhad bez družic vypadal jako platný fix. Teď se sigma
      násobí DOP (`gpsdopsigma=`) a volná brána (`gpsminsat=`, `gpsmaxdop=`) odmítne nesmysl —
      neznámá hodnota projde. Kvalita GPS je i na stránce náhledu. Na stojícím robotu ověřeno:
      dokud fix projde, odhad ujede ~1 m za 30 s; po odmítnutí zamrzne na centimetr. Příčina těch
      570 m potvrzená není (robot byl v době opravy vypnutý).
    kroky:
      - co: Sigma podle DOP, brána na družice a DOP, oprava mapování `fixType` u u-bloxu
        stav: hotovo
        kdy: 2026-09-06
      - co: Kvalita GPS na stránce náhledu
        stav: hotovo
        kdy: 2026-09-06
      - co: Ověřeno na stojícím robotu (brána zastaví ujíždění)
        stav: hotovo
        kdy: 2026-09-06
