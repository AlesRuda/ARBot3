  - id: mise-robotour-dalsi-nakladka
    oblast: mise
    nazev: Změna pravidel Robotour 2026 — po vykládce další nakládka místo jízdy do depa
    druh: zamer
    stav: v-kodu
    nalezeno: 2026-09-19
    vyreseno: 2026-09-19
    popis: >
      Pravidla Robotour dovolují po úspěšné vykládce rozhodnout se pro další nakládku místo
      návratu do depa, po ní následuje další vykládka a opět volba — dokola. V automatu je to
      jediný rozdíl: servisní okno u vykládky má zapnutý skener a kód, který tam projde
      strojovými kontrolami, je místo další nakládky (`nextPickupChosen`); uvolnění stopu bez
      kódu znamená „žádná další nakládka, do depa“. Rozlišuje se `CodeExpected` (kód se přijímá
      na každém stanovišti) a `CodeRequired` (bez něj se neodjede — depo a nakládka vrací na
      `AwaitingEStop`). Stránka náhledu i UI panel u vykládky hlásí „vyloženo: QR kód DALŠÍ
      nakládky, nebo uvolnění stopu bez kódu = jízda do depa“ (`MissionWait.QrCodeOrRelease`,
      `MissionStatusText.WaitFor(phase, stop)`); „kód nevidím“ se u vykládky nehlásí. `MissionMsg`
      je verze 7 (`Deliveries` = počet vykládek, `NextPickupChosen`); `PickupLatDeg`/`DropLatDeg`
      jsou od té doby poslední nakládka/vykládka. Limit vzdálenosti od depa platí i pro další
      nakládky. Binárka s tím jela ve 4. kole Robotouru 19. 9. (nahraná před startem kola), ale
      robot k nakládce nedojel (`nav-phi-obracena-hrana`), takže větev vykládka → další
      nakládka na zařízení nikdy nenastala; ve 3. kole to software ještě neuměl.
    kroky:
      - co: 'Automat: skener u vykládky, kód = další nakládka, uvolnění bez kódu = depo; `MissionMsg` v7'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Hlášení na stránce a v UI panelu (`QrCodeOrRelease`), 3 nové testy, 2 přepsané (Common 1 601, Runtime 140)'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Průchod vykládka → kód další nakládky → nakládka → vykládka → depo proklikán autorem v Avalonii na virtuálním HW'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Ověřit na robotu (skutečné kamery, stop tlačítko, stránka náhledu)'
        stav: otevreno
    odkazy:
      - text: robotour-mission.md
        cesta: doc/robotour-mission.md
    devlog: [2026-09-19]
    ceka_na: []

  - id: mise-robotour-depothdop
    oblast: mise
    nazev: Mise se v depu nezarmovala — práh HDOP 2,0 mezi budovami nesplnitelný
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-19
    vyreseno: 2026-09-19
    popis: >
      Na soutěži 19. 9. 2026 stála mise Robotour 158 s v `ArmingAtDepot` (`20260919-101546.rec`),
      stránka ukazovala „sigma 60–70 m“. Ta sigma je `gpsposstd × HDOP`, tedy nejistota pro fúzi,
      ne kritérium mise: to je fix + ≥ 6 družic + HDOP ≤ 2,0 nepřerušeně 5 s, pak RMS rozptyl
      ≤ 2,5 m. Mezi budovami byl HDOP 1,74–2,95 (p50 2,30, p90 2,50) při 12–16 družicích, prahu
      2,0 vyhovovalo 4,7 % fixů a nejdelší nepřerušená série byla 3 s; s prahem 3,0 vyhovuje 100 %
      fixů obou ranních záznamů. Práh je teď parametr `depothdop=` (default 2,0 z `RobotourConfig`
      se nemění), provozní profil `pi-provoz.cfg` má 3,0 — rozptyl polohy hlídá `MaxSpreadM` dál.
      Měří to blok 1b `ARBot.Analyze mission` (percentily HDOP, % vyhovujících fixů, nejdelší série
      pro 2,0 / 2,5 / 3,0 / 4,0).
    kroky:
      - co: 'Blok 1b v `ARBot.Analyze mission`: kvalita fixu v `ArmingAtDepot` proti kritériu mise'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Parametr `depothdop=` (registr, runtime, `pi-provoz.cfg` = 3,0)'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Ověřeno na robotu (Robotour, Kolo3a/Kolo3b): armování prošlo za 5 s s HDOP 2,71 (6 družic) a 2,15'
        stav: hotovo
        kdy: 2026-09-19
    odkazy:
      - text: robotour-mission.md
        cesta: doc/robotour-mission.md
      - text: configuration.md
        cesta: doc/configuration.md
    devlog: [2026-09-19]
