    popis: >
      Rozbor grafu Model61.1 ukázal dvě exaktní úpravy (konvoluce 1×1 se spočítá před zvětšením
      obrazu a dvě sousední 1×1 konvoluce bez nelinearity se sloučí), které uberou 49 % násobení
      při nezměněném rozhodnutí na všech 819 200 pixelech testovací sady. Nástroj `models/onnxopt.py`
      ověřuje shodu rozhodnutí, ne čísel. Optimalizovaný model je výchozí pro CPU (`nnmodel=`,
      −54 % času na x86, jen −8 % na ARM) i pro NPU (`npumodel=`, 3,27 → 2,72 ms na Orange Pi,
      přesnost beze změny); z ubraných násobení NPU využilo jen třetinu, takže se muselo měřit,
      ne extrapolovat. Existenci výchozích modelů i shodu rozhodnutí hlídají testy. Nevysvětlené
      zůstává, proč je varianta `_int8_deq_opt` o 27 % rychlejší než `_float_opt` s týmž grafem.
