    druh: vada
    stav: hotovo
    nalezeno: 2026-07-13
    vyreseno: 2026-07-13
    popis: >
      `UBXMessage.Parse` četl payload jedním `Read(buf, 0, len)`, který na sériovém portu vrátí
      i méně bajtů, takže se parser rozjížděl a data chodila nerovnoměrně. Nahrazeno blokujícím
      čtením celé délky; fixy chodí plynule ~10 Hz. Rozhraní `IGPS` a `IMotorControl` při tom
      dostala událost `MeasurementArived`.
