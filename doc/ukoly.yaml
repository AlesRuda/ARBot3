  # ---------------------------------------------------------------- mise

  - id: mise-freerun
    oblast: mise
    nazev: Mise FreeRun — jízda v pravé polovině koridoru bez mapy
    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-25
    vyreseno: 2026-09-07
    popis: >
      Jednodušší mise před Robotourem, pro homologaci a přesun mezi stanovišti: držet se
      v pravé polovině detekovaného koridoru, překážkám se vyhýbat lokální mapou, bez mapové
      navigace; když koridor není, držet kurz. Je to jen producent „mrkve" pro existující lokální
      vrstvu, takže je malá — musela se ale vytáhnout mapově nezávislá část hledání koridoru
      (`CorridorSource`). V simulaci se usadí na −0,503 m proti požadovaným −0,500. Mise se vybírá
      selektorem `mission=none|freerun|robotour`, protože mise se vylučují. Venku poprvé jela
      7. 9. (452 s, ~105 m); robot se přitom plazil, ale to bylo lokální plánování a chybný kurz,
      ne mise.
    kroky:
      - co: 'Implementace, extrakce `CorridorSource`, měření proti pravdě (dva běhy)'
        stav: hotovo
