      rampou místo tvrdé nuly, důvod držení je povinný a jde do `DriveCommandMsg` (verze 3)
      i na stránku náhledu; detektor záseku se pod drženým stopem odzbrojí a po uvolnění zase
      ozbrojí. Držení se na robotu potvrdilo při zotavení kamer (13. 9. za 29 s, podruhé 18. 9.
      za 32 s), ale robot u toho pokaždé stál — brzdění pod holdem za jízdy je zatím jen z testů.
