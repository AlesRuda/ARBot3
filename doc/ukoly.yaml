  - id: prov-sit-soutezni-provoz
    oblast: provoz
    nazev: Síť robota pro soutěž — vlastní WiFi AP a kabel bez routeru
    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-29
    vyreseno: 2026-08-30
    popis: >
      Na soutěži není router, ale k robotu je potřeba se dostat z notebooku i z mobilu a stahovat
      velké záznamy. Robot vysílá vlastní AP `arbot` (na `hostapd`, protože AP režim
      `wpa_supplicant` s tímhle Broadcom čipem klienta nepřipojil) a po kabelu vezme adresu ze sítě,
      nebo když DHCP do 12 s nepřijde, sám rozdá adresu notebooku (`eth-direct`). Ověřeno rebootem:
      AP je k dispozici 9,8 s po startu. Cena: v síti s pomalým DHCP může robot spadnout na přímé
      spojení. Druhý den se opravilo, že sdílené připojení bralo notebooku internet (posílalo
      výchozí trasu přes robota); účinek se ověří až při dalším přepojení kabelu. Postup je
      v `setup-orangepi.sh`, ověřený jen staticky — celý běh ověří až reinstalace.
