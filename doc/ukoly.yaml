      Ani po opravě driverů z T265 nechodila póza. Sonda přímo nad librealsense ukázala, že
      gyro a akcelerometr chodí, ale on-device VIO půl sekundy po startu hlásí `SLAM_ERROR
      Vision` — v místnosti byla tma. Zároveň se ukázalo, že „OK" v panelu senzorů znamenalo jen
      otevřenou pipeline, ne snímky. Dál se zjistilo (6. 9.), že T265 nebyla do fúze vůbec
      napojená, a 13. 9. se po replugu pózu dávat naučila, ale za 1,5 h se zasekla znovu
      a zotavení jí nepomáhá. Autor 13. 9. rozhodl kameru odpojit natrvalo — dělá víc potíží než
      užitku.
    kroky:
