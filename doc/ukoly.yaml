      Dokumentace vedla `Model96.2.rknn` jako převod z `.h5` větve (95,35 %), ale naměřeno měl 96,66 %,
      tedy víc než údajný zdroj. Měřením se rozhodlo, že vznikl z `.tflite` větve (96,80 %, −0,14 p. b.
      za fp16). Ta větev je ale dynamic-range kvantovaná, takže na ní optimalizace grafu nenajde nic;
      optimalizovat jde jen horší `.h5` větev za ztrátu 1,31 p. b. přesnosti. Model96.2 proto zůstává
      beze změny a −45 % času půjde vytěžit teprve s float checkpointem těch lepších vah, který v repu
      není. Int8 ten model dál rozbíjí.
