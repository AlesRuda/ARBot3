    druh: vada
    stav: hotovo
    nalezeno: 2026-09-01
    vyreseno: 2026-09-01
    popis: >
      Při dořešení odmlčené pravé kamery z 31. 8. se našly dvě vady v driveru: kamera, které
      přestaly chodit snímky, z USB nezmizela, takže se pipeline nikdy nezbourala a panel hlásil
      OK; a selhání dotazu na USB (`failed to set power state`) se hlásilo jako „kamera
      odpojena", což by poslalo člověka hledat kabel. Nově se počítají timeouty po sobě a po
      třech se pipeline restartuje (`StallRestarts`), dotaz na přítomnost umí říct „nevím".
      Hlavní příčina 31. 8. byla ale fyzická (port 4 hubu), kód je záchranná síť — a ta 13. 9.
      skutečnou poruchu opravdu zachytila.
