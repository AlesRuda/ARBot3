      Rešerše ukázala, že odmlčení D435 za provozu je cizí, Intelem nevyřešený problém a naše léčba
      (detekce, zbourání pipeline, reconnect) je to, k čemu dojdou všichni. Nejsilnější stopa byla
      vlastní: po přidání T265 vyskočil `CLEAR_HALT` z 1 na ~72. Propustnost USB i VN100 s GPS na témž
