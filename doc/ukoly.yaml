  - id: hw-seriove-porty-pi
    oblast: hw
    nazev: Sériové porty periferií na Orange Pi byly jen odhad — a špatný
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-31
    vyreseno: 2026-08-31
    popis: >
      V kódu pro ARM64 byl jen odhad `/dev/ttyS0` pro IMU a motor s GPS neměly port vůbec, takže
      by se na Pi nezaložily. Skript `find-serial-ports.sh` porty najde pasivně (bez zápisu do
      nich) a vypíše hotové parametry: všechny tři periferie visí na USB (VN100 přes CP2102,
      Roboteq a u-blox jako USB CDC), `/dev/ttyS0` na RK3588 neexistuje. Do kódu šla jména
      z `/dev/serial/by-id`, protože čísla `ttyACM*` závisejí na pořadí enumerace a prohození
      GPS s motorem by bylo tiché. Ověřeno na zařízení dekódováním streamu VN100 a týž den během
      aplikace s reálnými drivery (GPS 9,99 Hz, IMU 8 kB/s, motor 386 řádků/s).
    kroky:
      - co: 'Skript `find-serial-ports.sh`, porty `by-id` v `ARBotHW.Init`'
        stav: hotovo
        kdy: 2026-08-31
      - co: 'Aplikace na Pi s reálnými drivery všech tří UART senzorů'
        stav: hotovo
        kdy: 2026-08-31
