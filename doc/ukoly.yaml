  - id: lok-kurz-koridor-prehlasovan-kompasem
    oblast: lokalizace
    nazev: Korekci kurzu z koridoru přehlasuje kompas ~200:1
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-22
    vyreseno: 2026-09-18
    popis: >
      Autor se ptal, proč korekce z koridoru chybu kurzu nezmenšila. Nejdřív se zjistilo, že
      kurz nebylo co opravovat (robot stál a virtuální IMU dává absolutní kurz s efektivní σ 0,1°).
      Když se chyba vnutila (`imubias=5,0`), koridor ji změřil správně (4,8°), ale fúze zůstala na
      4,96°: informace kompasu při 100 Hz přehlasuje koridor ~200:1 a měkký gating navíc u velké
      chyby σ koridoru nafoukne (sebemařící). S oslabeným kompasem korekce funguje (4,76° → 0,58°).
      Důsledek pro robot: σ kompasu musí být podstatně větší než jeho krátkodobý šum, nebo musí
      bias kurzu přibýt do stavu EKF. Od 12. 9. má σ kompasu podlahu 5° a škrtí se na 1 Hz, takže
      15. 9. výpočet ukázal, že poměr se překlopil na koridor ~150–1000:1 nad kompasem — je to ale
      výpočet, ne měření, a na zařízení to neběželo.
      ✅ **Změřeno na zařízení 18. 9. 2026** (první jízdy s `corridorsend=true`): fúze kurz z kompasu už neopisuje — `odhad − IMU yaw` je +0,39 ± 1,88° (dřív −0,01 ± 0,06°) a odhad je ke GPS kurzu blíž než kompas sám (v jízdních minutách −1,0 až −1,8° proti −2,7 až −4,7°). Koridor kurz reálně táhne; kolik přesně a s jakou σ, zůstává u `lok-koridor-merici-rezim` (σ proložení 4× optimistická, kadence 10/s).
    kroky:
      - co: "Změřit poměr informace kompas : koridor v simulaci (~200:1)"
        stav: hotovo
