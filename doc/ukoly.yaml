  - id: lp-drsnost-povrchu-rychlostni-strop
    oblast: lokalni-planovani
    nazev: Obtížně sjízdný povrch (hrbol, prasklina) jako rychlostní strop v lokální mapě
    druh: zamer
    stav: otevreno
    nalezeno: 2026-09-22
    popis: >
      Sjízdnost z hloubkové kamery je dnes dvoustavová: buňka je buď volná, nebo překážka (práh
      výškové odchylky 3 cm + 2 cm na metr dosahu). Hrbol nebo kořen pod prahem projde jako
      hladká cesta a robot přes něj jede plnou rychlostí; nad prahem je z něj zeď. Inspirace:
      kořeny a hrboly na Robotouru 19. 9. 2026, kde se robot jen těsně nepřeklopil. Nebezpečí
      přitom není ráz hnaných kol, ale klopení dopředu, když na hrbol najede ZADNÍ pasivní kolo —
      o rozvor později než přední náprava; brzdění v tu chvíli klopný moment zvětšuje. Záměr:
      vést spojitou míru drsnosti (výška schodu a rozptyl výšek, které polární grid už měří, ale
      do kartézského gridu nepřenáší) jako třetí kanál lokální mapy a odvodit z ní rychlostní strop
      `VSurface`, který se skládá s ostatními stropy obálky. Strop musí platit od `hrbol − brzdná
      dráha` po `hrbol + rozvor` a uvnitř být PLOCHÝ (zpomalit před, projet konstantně, zrychlit
      až za) — mapa si ho tedy musí pamatovat i pod robotem a za ním. Spodní mez strop nemá: kolo
      regulované na polohu kolečko přes schod protlačí (na asfaltu bez prokluzu), cena nízké
      rychlosti je jen čas. Riziko: šum hloubky roste s r² (reference 1 cm + 0,4 cm/m², ve 3 m
      4,6 cm), takže drsnost je čitelná asi do 1,5 m, brzdná dráha z 1 m/s je řádově metr —
      horizont stačí jen tak tak a praskliny v asfaltu budou nejspíš pod rozlišením. Proto nejdřív
      měření ze záznamů, ne kód: bez toho by třetí strop mohl robota přibrzdit všude, jako to
      7. 9. udělal `VAlong`.
      ZMĚŘENO 22. 9. 2026 (`ARBot.Analyze bumps` nad `records/Robotour2026/`, Kolo3b 799 m):
      drsnost JE vlastnost úseku, ne bodu — nejhorší pětimetrové okno je 2,5× drsnější než medián
      a podobnost dvou míst klesá pomalu (r = 0,80 na 5 m, 0,65 na 10 m, 0,44 na 20 m, 0,19 na
      30 m). Záměr se tím posouvá: nemusí se předpovídat JEDEN kořen z hloubky na 1,5 m (kde šum
      4,6 cm ve 3 m sotva stačí), stačí poznat HRBOLATÝ ÚSEK a strop postavit z IMU podle toho,
      po čem robot už projel. Podmínkou je normalizace na jednotku dráhy — viz kroky.
    kroky:
      - co: "Měřidlo `ARBot.Analyze bumps` nad záznamy z Robotouru"
        stav: hotovo
        kdy: 2026-09-22
      - co: "Go/no-go ZMĚŘENO — a odpověď záměr PŘEFORMULOVALA: jednotlivý hrbol z kamery předpovídat netřeba, protože drsnost drží přes desítky metrů (r = 0,80 na 5 m, 0,44 na 20 m, dekorelační délka ~20 m; nejhorší okno 2,5× nad mediánem). Strop jde postavit z IMU, z toho, po čem robot UŽ projel — dosah hloubky 1,5 m přestává být překážkou"
        stav: hotovo
        kdy: 2026-09-22
      - co: "Normalizovat drsnost na jednotku DRÁHY, ne času: dnešní RMS rychlosti klopení koreluje s rychlostí okna r = 0,134 nad Kolem 3b, ale 0,822 nad Kolem 4. Bez toho by mapa drsnosti byla zčásti mapou rychlosti a strop by se honil za vlastním ocasem (zpomal → vypadá hladce → zrychli)"
        stav: otevreno
      - co: "Rozhodnout ZDROJ drsnosti: z IMU po projetí, nebo z polárního gridu dopředu. ZMĚŘENO 22. 9. 2026 (`bumps --depth=`): grid JE v záznamu uvnitř CameraFrame (dřívější 'neposílá se, chce replay' byl omyl), ale na místě, kde robot později zakopl, se od obyčejné vozovky NELIŠÍ — StdZ p90 poměr hrbol/kontrola 0,95 / 0,98 / 0,91 / 1,68 / 1,02 na 0,5–3,0 m, bez trendu a s odporujícími si ukazateli. Cesta 'z IMU po projetí' je tedy zatím jediná změřeně nosná"
        stav: hotovo
        kdy: 2026-09-22
      - co: "Vysvětlit rozpor: z náklonu plyne, že kola stoupla o ~6 cm během ~0,13 m dráhy, a to by v hloubce vidět být MĚLO. Buď je párování místa hrubší, než se zdá (chyba dráhy, boční posun, buňka ~7 x 9 cm ve 2 m), nebo to StdZ nezachytí, protože útvar leží uvnitř jedné buňky a proložení roviny ho pohltí. Rozhodne pokus se ZNÁMOU překážkou"
        stav: otevreno
      - co: "Třetí kanál gridu (drsnost, `byte`, spíš max s rozpadem než log-odds), hodnota přežije pod půdorysem robota a za ním; nahradit skrytou vazbu `fRough` (drsná buňka dnes jen slaběji Free)"
        stav: otevreno
      - co: "`VSurface` v `LocalPlannerConfig`: plochý strop, sloučení do ceny A* i stropu uzlu, rozpad obálky `EnvVSurface`"
        stav: otevreno
      - co: "Kalibrační jízda přes známé hrboly a ověření na zařízení"
        stav: otevreno
