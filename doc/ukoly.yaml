  - id: lok-korelace-dekorelacni-cas
    oblast: lokalizace
    nazev: Cykly korelace s mapou nejsou nezávislé — odstup je dekorelační čas 3 s
    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-25
    vyreseno: 2026-08-25
    popis: >
      Fúze bere každé měření jako nezávislé, ale korelace čte tentýž grid s pamětí ~2,5 s, takže
      dva cykly po sobě říkají skoro totéž a informace se započítá dvakrát (činitel nadsazení
      1,9–2,4). Dekorelační čas vyšel 2,85 / 2,93 / 3,31 s na třech bězích s periodou lišící se
      o 42 %, tedy je to konstanta scény, ne artefakt měření. Léčba je odstup konstrukcí: nejmenší
      perioda korelace 400 ms → 3 s, po změně je korelace sousedních cyklů záporná a činitel 1,00.
      Při tom se opravil o řádek špatný údaj o ceně — cyklus stojí 1,31 s (celé jádro), ne
      ~126 ms; hranice 400 ms byla v praxi mrtvá. Změřeno v simulaci, na zařízení korelace
      neběžela (`mapcorr=false`).
    kroky:
