  - id: lok-ekf-fuze-od-nuly
    oblast: lokalizace
    nazev: EKF senzorická fúze napsaná od nuly s asynchronním zpracováním měření
    druh: zamer
    stav: hotovo
    nalezeno: 2026-07-07
    vyreseno: 2026-07-28
    popis: >
      Původní EKF z ARBot2 nešel přeložit (vazby na WPF, chybějící matice) a měl pevný takt 10 Hz.
      Nová fúze v `ARBot.Common/Fusion` má generický `Ekf` (Joseph form, čisté kroky pro replay),
      model stavu `[X, Y, θ, v, ω]` s rychlostmi jako stavy (robustní vůči smyku) a
      `AsyncFusionEngine`, který zpracovává měření podle času pořízení s checkpointy a líným
      přepočtem — senzory s různou kadencí a latencí (kamery) se skládají správně. Druhý den přibylo
      NIS gating v měkkém režimu: odlehlému měření se nafoukne `R` místo zahození, takže se filtr
      z dlouhého výpadku vždy zotaví (tvrdý `Reject` umí filtr trvale zaseknout). Adaptivní odhad
      R/Q z reziduí se vědomě odložil — je stavový a kolidoval by s bezstavovým přehráváním.
      Od 28. 7. je engine thread-safe a řídicí smyčka z něj vzorkuje odhad přes `GetStateAt`.
    kroky:
      - co: "`Ekf`, `EKFModel`, měřicí modely, `AsyncFusionEngine`, `GeoReference`"
        stav: hotovo
        kdy: 2026-07-07
      - co: NIS + měkký gating proti lockoutu
        stav: hotovo
        kdy: 2026-07-08
      - co: Thread-safe engine, řízení vzorkuje odhad nezávisle na měřeních
        stav: hotovo
        kdy: 2026-07-28
    odkazy:
      - text: ekf-fusion.md
        cesta: doc/ekf-fusion.md
    devlog: [2026-07-07, 2026-07-08, 2026-07-28]
    ceka_na: []

  - id: lok-vn100-driver-ramce
    oblast: lokalizace
    nazev: Binární driver VN100 a sjednocení souřadnicových rámců (FLU / ENU)
    druh: zamer
    stav: hotovo
    nalezeno: 2026-07-10
    vyreseno: 2026-07-10
    popis: >
      Druhý driver VN100 čte binární výstup včetně nejistoty orientace (`YprU`) jako zdroj
      kovariance pro fúzi. Zároveň se pevně stanovily rámce projektu — tělo FLU, svět ENU
      s matematickou orientací — a rozhodlo se, že montáž senzoru (X vzad) řeší reference frame
      rotation uložená v senzoru, ne softwarový offset; driver převádí jen FRD → FLU a azimut →
      ENU. Čtení ověřeno na skutečném senzoru: dřívější „180° na severu" byla stará konfigurace
      senzoru, ne chyba kódu. Pozdější potíže s kurzem (heading mode Relative, kalibrace
      magnetometru) jsou samostatná témata.
    kroky:
      - co: "`VN100IMUBinary` s `YprU` → `IMUState.OrientationUncertainty`"
        stav: hotovo
        kdy: 2026-07-10
      - co: Rámce FLU / ENU, reference frame rotation `diag(-1,1,-1)` v senzoru
        stav: hotovo
        kdy: 2026-07-10
      - co: Ověřeno na HW (heading OK po factory resetu)
        stav: hotovo
        kdy: 2026-07-10
    odkazy:
      - text: imu-and-frames.md
        cesta: doc/imu-and-frames.md
    devlog: [2026-07-10]
    ceka_na: []

  - id: hw-gps-ubx-desync
