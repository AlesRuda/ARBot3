  - id: lok-koridor-merici-rezim
    oblast: lokalizace
    nazev: Koridor v měřicím režimu — odtlumení a první měřicí jízda
    druh: zamer
    stav: hotovo
    nalezeno: 2026-09-15
    vyreseno: 2026-09-20
    popis: >
      Koridor měří snímek co snímek týž okraj cesty, takže jeho chyba je časově korelovaná — táž
      past jako u GPS a kompasu. Přibyly `corridorstd=`, `corridorheadingstd=` a `corridorhz=`
      (sigmy kvadraticky, škrtí se jen posílání), výchozí 0 schválně, protože dekorelační čas
      koridoru změřený nebyl; provozní profil měl běžet s `corridor=true`, `corridorsend=false` —
      plná zátěž, nulový vliv na řízení. Řádek `corridorsend=false` v profilu byl od 15. 9.
      (commit `0e34771`) a měřicí jízda 16. 9. s ním jela; 17. 9. ho autor v přípravě na Robotour
      odstranil (`8bf1081`) a týž den zapsal `corridorsend=true` (`a44b4f4`) — od té doby se
      korekce posílají vědomě; viz `lok-koridorsend-nebyl-vypnuty`. První měřicí jízda 16. 9. (první záznam ze zařízení, kde
      koridor vůbec běžel) dala první střízlivé číslo: koridor je dobrá reference kurzu (+0,42°
      proti GPS, robustní sd 2,30°), ale proložení hlásí 0,50°, tedy je ~5–9× optimističtější.
      Poloha byla celou jízdu mimo mapovanou vozovku (3–5 m), takže do fúze neodešlo 0 ze 424
      přijatých měření — a report to do té doby neuměl říct (`Ok` znamenalo „prošlo branami“,
      ne „došlo do fúze“).
      18. 9. 2026: `corridorsend=true` je v profilu vědomě od 17. 9. a první jízdy naostro ho potvrdily; σ kurzu z proložení je potřetí ~4× optimistická (robustní sd 2,4–2,6° proti 0,6°), takže číslo pro `corridorheadingstd=` je ~2,5°, ale pořád nenastavené.
      **18. 9. večer, pro soutěž:** autor chtěl koridor „trošku“ oslabit; v profilu je `corridorstd=0.1`, `corridorheadingstd=2.5`, `corridorhz=2` (~15× méně příčné informace, ~90× méně o kurzu než dnes), podloženo A/B v simulaci s pravdou (příčně 0,018 m, kurz 0,41° proti 0,84 m / 2,4° bez korekcí).
      S těmi hodnotami jel robot na Robotouru 19. 9. (profil z `da82549`); rozbor 20. 9.: koridor přijat 1 404 z 1 404 (NIS p90 3,1, max 443), odtlumení mechanicky funguje, ale skokům pózy nebrání — to vede `lok-koridor-skoky-pozy`.
    kroky:
      - co: Parametry odtlumení a měřicí profil `pi-provoz.cfg`
        stav: hotovo
        kdy: 2026-09-15
      - co: Měřicí jízda na zařízení (`20260916-164926.rec`)
        stav: hotovo
        kdy: 2026-09-16
      - co: Report `corridor` — trychtýř ztrát, „došlo to do fúze?“, neuťatá příčná statistika, koridor jako reference kurzu
        stav: hotovo
        kdy: 2026-09-16
      - co: "Nastavit `corridorheadingstd=` z měření — 18. 9.: 2,5° (robustní sd koridor − GPS kurz 2,4–2,6°), s `corridorstd=0.1` a `corridorhz=2` v profilu pro soutěž; A/B v simulaci příčně 0,003 → 0,018 m, kurz 0,13 → 0,41°"
        stav: hotovo
        kdy: 2026-09-18
      - co: "Ověřit odtlumené hodnoty na zařízení — Robotour 19. 9. (Kolo3b, Kolo4, rozbor 20. 9. `ARBot.Analyze nav` + `corridorstd`): 1 404 z 1 404 přijato, NIS p90 3,1, max 443; skoky pózy to neodstranilo → `lok-koridor-skoky-pozy`"
        stav: hotovo
        kdy: 2026-09-20
      - co: Rozvolnit příčnou bránu — vyřešeno zrušením brány, viz `lok-koridor-pricna-brana`
        stav: hotovo
        kdy: 2026-09-18
      - co: "`corridorsend=true` v profilu — autor 17. 9. (commit `a44b4f4`) po kalibraci kompasu 12. 9. a přiřazení hrany 16. 9.; první jízdy 18. 9."
        stav: hotovo
        kdy: 2026-09-17
