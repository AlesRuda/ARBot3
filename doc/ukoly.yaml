    popis: >
      `MinInliers` je největší ztrátová brána proložení koridoru (17. 9. zahodila 3 987 z 6 173
      cyklů). Práh 25 vznikl na starším záznamu odjinud a jeho zdůvodnění je konkrétní: bez něj
      se do statistiky míchaly přímky proložené 3–6 body, které vyjdou **kolmo na cestu** (šířka
      až 10 m, směr −88°), a šířka měla sd 3,3 m místo 0,45 m.
      Změřeno ze záznamů (nový blok *PRAH INLIERU* v `ARBot.Analyze corridor`, který dopočítá
      geometrii z uložených úseček, takže **nový výjezd netřeba**):
      nad `20260917-160558.rec` by práh 15 dal **2 513 koridorů místo 635 (4,0×)** a podíl
      nesmyslné šířky (mimo 1–8 m) by šel 0,0 → 2,0 %; nad `20260916-164926.rec` by dal
      **3 399 místo 2 354 (1,4×)** a podíl nesmyslné šířky 2,0 → 2,6 %.
      ⚠️ **Podstatné je to druhé číslo: při dnešním prahu 25 už je nesmyslná šířka 2,0 %**, a při
      prahu **20 je jen 1,7 %**, tedy MÉNĚ než při 25. Ta závislost je nemonotónní, což znamená,
      že **práh tu vadu neřídí** — případy s kolmou přímkou nejsou soustředěné v cyklech s málo
      inliery. Rozdělení šířky je přes všechny prahy prakticky stejné (p50 3,00–3,16 m).
      Druhý signál týmž směrem: cykly, které by práh navíc pustil, procházejí testem
      rovnoběžnosti **častěji** než ty dnes přijaté (65 % proti 47 % nad 17. 9.) — přesný opak
      toho, co by „málo inlierů = šum" předpovídalo.
      ⚠️ **Neříká to, že by se tím něco spravilo.** Měří se jen stupeň *proložení*; jestli by ty
      koridory navíc prošly přiřazením hrany a příčnou bránou, se z těchto záznamů říct nedá —
      17. 9. byl rozbitý kurz a póza 2,5–4,5 m mimo mapovanou vozovku, takže tam se stejně
      ztrácelo všechno až dál. A „šířka v 1–8 m" je slabé měřítko kvality: přímka proložená
      na špatnou hranu (obrubník místo trávy) dá věrohodnou šířku taky.
      ✅ **Od 17. 9. 2026 je to parametr `corridormininliers=`** (výchozí 25, tedy beze změny
      chování), takže A/B na zařízení jde pustit z profilu. Výchozí hodnota se ZÁMĚRNĚ nemění,
      dokud se neprojede na robotu: měření výš je jen o stupni proložení, ne o tom, co doteče
      do fúze. Spodní mez validátoru je 3 — dvěma body jde přímku proložit vždy, takže 2 by
      bránu fakticky vypnulo.
      18. 9. 2026 s kalibrovaným kompasem: zisk prahu 20 je jen **+6–7 %** koridorů (17. 9. při rozbitém kurzu 4×) a nesmyslná šířka roste — ztráty už nesedí na tomhle prahu. Výchozích 25 zůstává; A/B na zařízení tím ztrácí naléhavost.
      Škrcení 1,4–4× z názvu tedy platilo jen při rozbitém kurzu; s dobrým kurzem je to ~7 %.
      **Rozhodnutí autora 21. 9. 2026: přísnějších 25 zůstává**, A/B na zařízení se nedělá —
      měření z 18. 9. říká, že 20 přinese jen ~7 % koridorů navíc za horší nesmyslnou šířku,
      a parametr `corridormininliers=` je k dispozici, kdyby se to mělo někdy přeměřit.
    kroky:
      - co: Blok *PRAH INLIERU* v reportu (geometrie z uložených úseček; měřidlo ověřené proti známé odpovědi)
        stav: hotovo
        kdy: 2026-09-17
      - co: Změřeno na dvou záznamech (17. 9. a 16. 9.), nemonotónní závislost potvrzena
        stav: hotovo
        kdy: 2026-09-17
      - co: "Vystavit `MinInliers` jako parametr `corridormininliers=` (validátor 3–500, guard test hlídá, že se čte)"
        stav: hotovo
        kdy: 2026-09-17
      - co: "Rozhodnout výchozí hodnotu — autor 21. 9.: zůstává 25, A/B na zařízení se nedělá (18. 9. změřeno, že 20 dá jen ~7 % navíc za horší šířku)"
        stav: hotovo
        kdy: 2026-09-21
      - co: "Změřit s dobrým kurzem — 18. 9.: práh 20 dá jen +6 / +7 % koridorů (3 414 proti 3 221; 3 426 proti 3 211) při horší nesmyslné šířce (1,7 → 2,5 %; 0,6 → 0,9 %); přiřazení hrany pouští 98–99 %, takže by skoro všechny došly do fúze — zisk malý, 25 zůstává"
        stav: hotovo
        kdy: 2026-09-18
