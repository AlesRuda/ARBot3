  - id: hw-magcal-ramec-registru-23
    oblast: hw
    nazev: Kalibrace se do senzoru zapisovala ve špatném rámci, offset se přičítal
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-11
    vyreseno: 2026-09-11
    popis: >
      Při nasazení kalibrace se na živém senzoru změřilo, jak VN100 registr 23 aplikuje: `C·(m − b)`,
      tedy stejný vzorec jako náš `Apply`, potvrzeno i z ICD. Měřit se musí přes víc os a s nejednotkovou
      maticí — z osy X samotné vyjde opak, protože mezi kompenzací a výstupem leží registr 26, a
      jednotková matice nerozliší `C·m − b` od `C·(m − b)`. Hlavní nález: registr 23 se aplikuje před
      registrem 26, fit běží až za převodem do rámce robota, takže bias v X a Y měl obrácené znaménko
      a offset 0,22 G se přičítal; v tom stavu byla kalibrace pár hodin na robotu. `ToVnwrg23()` teď
      rámec převádí, hlídají to testy a 12. 9. venku kalibrace sedí.
    kroky:
      - co: Konvence registru 23 změřena na senzoru a doložena ICD
        stav: hotovo
