  - id: lok-koridor-prah-inlieru-podle-vzdalenosti
    oblast: lokalizace
    nazev: Hranice se s dálkou rozmazává a RANSAC ji měřil jedním metrem
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-22
    vyreseno: 2026-08-24
    popis: >
      Měření 12 631 hraničních bodů proti mapě ukázalo, že medián sedí na okraji vozovky v každé
      vzdálenosti, ale rozptyl roste z ±5 cm na metru na −0,6/+0,4 m na deseti metrech. RANSAC měl
      jeden práh inlieru 0,10 m pro celou hranici, takže se u vzdálených bodů chytal náhodného
      zarovnání. Práh je od 23. 8. úměrný vzdálenosti (optimum 0,15 m/m, +11 % přijatých).
      Zbytek kandidátů neobstál a je to změřené, ne názor: vážené proložení 1/σ² (vzdálené body
      jediné určují směr), velikost vzorku hypotézy (bez vlivu), ortogonální regrese (numericky
      bezvýznamná), Huberova váha (při normalizaci tolerancí principiálně no-op) i přehradlování
      konsenzuální sady (`RegatePasses`, ráno zapnuto na kruhové referenci, večer vráceno na 0 —
      práh inlieru je 10× volnější než rezidua). Přepínače v kódu zůstaly. Dvě poučení: rezidua
      nejsou přesnost a méně přijatých při lepší geometrii není zlepšení.
    kroky:
