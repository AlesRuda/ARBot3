  - id: lok-naucena-sirka-do-mapy
    oblast: lokalizace
    nazev: Naučená šířka cesty jde dál do mapy — korelaci i kreslení
    druh: zamer
    stav: v-kodu
    nalezeno: 2026-09-15
    vyreseno: 2026-09-15
    popis: >
      Odhad šířky zůstával uvnitř koridoru a nedosáhl na korelaci s mapou (jediný algoritmický
      dopad) ani na kreslení. Teď je to neměnný překryv `uzel → šířka` (`roadwidthmap=`, výchozí
      false), graf sítě se nemění, protože ho drží i navigace; scéna korelátoru se atomicky zamění
      za prahem 0,25 m a odstupem 10 s. Scéna virtuální kamery překryv nedostane, jinak by koridor
      měřil sám sebe. Autor hned při prvním proklikání našel vadu: do maxima na sdíleném uzlu
      přispívala i nezměřená cesta svou mapovou hodnotou, takže se naučené zúžení přehlasilo
      prakticky na celé síti — mapová šířka nezměřené cesty je default, ne důkaz. Perzistence
      vědomě není; prahy jsou odhad a jdou doladit offline. Na zařízení neběželo.
    kroky:
      - co: "`RoadWidthOverrides`, `RoadWidthMapUpdater`, vrstva v mapě i na půdorysu"
        stav: hotovo
        kdy: 2026-09-15
      - co: Oprava maxima na sdíleném uzlu, práh proti účinné šířce, hláška s velikostí změny
        stav: hotovo
        kdy: 2026-09-15
      - co: Doladit `RebuildThresholdM` a `MinRebuildPeriodSec` z prvního záznamu
        stav: otevreno
      - co: "Zapnuto `roadwidthmap=true` v `config/pi-provoz.cfg` (pokyn autora) — 25. 9. 2026 autor šířku do mapy nepropsanou neviděl, ačkoli estimátor se ji naučil (Track `20260925-143643.rec`: 3,68 m proti mapovým 3 m, `WidthNotTrusted` jen 2,3 %); všechny čtyři záznamy běžely s `roadwidthmap=false (default)`"
        stav: hotovo
        kdy: 2026-09-25
      - co: Ověřit na zařízení
        stav: otevreno
