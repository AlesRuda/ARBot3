  - id: vid-gc-spicky-latence
    oblast: videni
    nazev: Vizuální cesta se každých ~5 s zasekla na 200–450 ms kvůli GC
    druh: vada
    stav: hotovo
    nalezeno: 2026-07-30
    vyreseno: 2026-08-01
    popis: >
      Na zařízení skákalo stáří gridu mezi 30 a 500 ms. CSV diagnostika ukázala, že vlastní
      výpočet trvá 16–50 ms, ale ~8–13 % snímků zasáhne periodická pauza gen2 GC z alokací
      velkých obrazových bufferů. Server GC to zhoršil (zamítnuto měřením), nativní transform
      snížil CPU 3×, ale ocas nezmizel. Řešením byla architektura: kamery pullované řídicí smyčkou,
      výpočet na vlákně kamery, poolované buffery — a hlavní viník se našel až na HW:
      `MessageWriter` serializoval každou zprávu přes novou `MemoryStream` (~90 MB/s do LOH),
      k tomu odpojené UART senzory alokovaly stack-trace v těsné smyčce. Po opravách self-test
      na zařízení: gen2 = 0, žádný snímek nad 100 ms.
    kroky:
      - co: CSV diagnostika, diagnóza GC, Server GC zamítnut měřením
        stav: hotovo
        kdy: 2026-07-30
      - co: Nativní depth → pointcloud bez alokací (CPU −3×, ocas beze změny)
        stav: hotovo
        kdy: 2026-07-30
      - co: Pull kamer řídicí smyčkou, pooling bufferů a kopií per odběratel
        stav: hotovo
        kdy: 2026-08-01
      - co: "`MessageWriter` bez alokací na zprávu, backoff a škrcení logu v `SensorBase`"
        stav: hotovo
        kdy: 2026-08-01
      - co: Ověřeno na HW self-testem (gen2 = 0, 0 % snímků nad 100 ms)
        stav: hotovo
        kdy: 2026-08-01
    odkazy:
      - text: traversability-grid.md
        cesta: doc/traversability-grid.md
