  - id: mise-track
    oblast: mise
    nazev: Mise Track — objezd míst ze souboru
    druh: zamer
    stav: v-kodu
    nalezeno: 2026-09-08
    vyreseno: 2026-09-08
    popis: >
      `mission=track track=<cesta>`: řádek = místo ve stupních, `repeat` = jezdit dokola. Každé
      místo se přichytí na nejbližší bod sítě cest — a to je oprava vady, ne kosmetika, protože
      dojezd se měří proti surovému cíli a mise by jinak u prvního bodu uvízla navždy. Bod dál
      než `trackoffroad=` misi přeruší, nesrozumitelný řádek je chyba, mezi body se nezastavuje
      a volba mise robota nerozjede (čeká na stisk a uvolnění nouzového zastavení). V simulaci
      objela tři místa a začala druhé kolo. Od 13. 9. se všechna místa přichycují předem při
      odjezdu, seznamy leží u map v `OSM/`. Na zařízení odjela 12. a 14. 9. (13 min, k prvnímu bodu 44 m za 9,5 minuty, běh z 17:06 skončil `NoRoute`); celý seznam neobjela.
      17. 9. 2026 poprvé DOJELA na místo: trasa 147 m k bodu 1/3 za 3 minuty (16:06:51 → 16:09:53),
      pak si vzala cíl 2/3 (trasa 37 m) a obsluha ji v 16:11:37 zastavila ze stránky. Přichycení
      všech tří míst předem proběhlo (největší odstup 2,1 m z limitu 50 m). Jelo se to ale
      s rozbitým kurzem (viz `hw-zelezo-od-kabelu-kamer`), takže o chování mise po kalibraci to
      neříká nic. Druhý běh téhož dne zatuhl 4 s po odjezdu (`prov-zatuhnuti-za-behu-mise`).
      ✅ **18. 9. 2026 seznam poprvé objetý celý, i s `repeat`** (`20260918-154028.rec`: 3 místa za 5 min, druhé kolo za 2,5 min, s korekcemi z koridoru naostro); třetí kolo skončilo stáním před blokovanou mapou (`lp-zasek-v-blokovane-mape`). Druhý běh (`-155329.rec`): 5 míst za 8 min, k prvnímu bodu 93 m za 4 min, z toho 130 s stání po startu.
      Jízdy 18. 9. jely ještě s chybou φ (`nav-phi-obracena-hrana`, opraveno 20. 9.); dopad na
      Track měřený není. Mise sama je na zařízení hotová, `v-kodu` drží jen dva drobné kroky
