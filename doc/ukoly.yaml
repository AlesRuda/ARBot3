  - id: mise-cil-dosazitelnost
    oblast: mise
    nazev: Zkouška dosažitelnosti cíle z QR kódu nebyla důvěryhodná
    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-26
    vyreseno: 2026-08-27
    popis: >
      Dvě vady v tom, jak mise posuzuje cíl z kódu. Zkouška byla pesimističtější než jízda:
      cíl na téže cestě za robotem hlásila jako nedosažitelný, protože mapmatching vybral
      orientovanou hranu podle pořadí, ne podle kurzu — teď zkouší obě orientace. A dosažitelnost
      neověřovala vzdálenost cíle od sítě; hůř, navigace měří dojezd proti surovému cíli, takže
      cíl odsazený od osy cesty víc než o 3 m by nikdy neohlásil dojezd a mise by uvízla napořád.
      Cíl se proto přichycuje na cestu a co je dál než `MaxTargetOffRoadM` (15 m, z úsudku) je
      nedosažitelné; odstup jde do záznamu. Tatáž past se 12. 9. znovu řešila u mise Track.
      Na Robotouru 19. 9. 2026 dojezd na přichycený cíl z kódu nastal dvakrát (Kolo3b: nakládka
      14:15:56, vykládka 14:27:45), takže vada „`Arrived` by nenastalo nikdy" je na zařízení
      vyvrácená; cíle byly přesně uzly mapy, k limitu 15 m data nedaly. Zamítnutí `NoRoute`
      z `Probe` na náměstí je jiná věc než `NoRoute` za jízdy — vede `mise-robotour-mapa-ostrov`.
    kroky:
      - co: 'Zkouška bere minimum přes hranu i její reverzní (cíl za robotem)'
        stav: hotovo
        kdy: 2026-08-27
      - co: 'Přichycení cíle na cestu, limit `MaxTargetOffRoadM`, `MissionMsg` verze 6'
        stav: hotovo
        kdy: 2026-08-27
      - co: '`NoRoute` na cíl z QR = neplatný cíl, číst znova (dnes přerušení mise)'
