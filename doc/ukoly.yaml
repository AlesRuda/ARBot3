    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-21
    vyreseno: 2026-08-21
    popis: >
      Převod pixelu barevného obrazu na bod v prostoru byl mrtvý na všech platformách: Windows
      volal nativní `ColorPixel23D`, které v knihovně není, ARM vyhazoval výjimku, a báze tiše
      promítala na rovinu země — u horizontu body na stovky metrů. Extrinsiky color–depth kamera
      znala, ale ARM varianta je zahazovala. Nově managed `ColorPixelTo3D`, extrinsiky protažené
      HALem až do záznamu a podtřídy projekce zrušené. Na reálné D435 neověřeno.
    kroky:
