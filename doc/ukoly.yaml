  - id: lp-regulator-zapadka-lookahead
    oblast: lokalni-planovani
    nazev: Robot jel 0,1 m/s, i když bylo povoleno 1,2 m/s
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-14
    vyreseno: 2026-09-18
    popis: >
      Mapa, obálka i plánovač pouštěly plnou rychlost, ale regulátor vydával 0,05 m/s. Omezovač
      váže dopřednou rychlost na vzdálenost k lookahead bodu a dobu dorovnání rotace - a lookahead
      se počítal z aktuální rychlosti, takže při nízké rychlosti seděl na podlaze 0,15 m a strop
      zůstával nízký: západka, ze které se soustava sama nedostane. Dvě dřívější hypotézy padly,
      protože stály na offline testu místo na měření za běhu. Podle návrhu autora se teď míří na
      nejbližší uzel dráhy před robotem (uzly blíž než lookahead se přeskakují); bez opravy dosáhne
      test 0,19 z 0,80 m/s. Venku 7. 9. se to samostatně nepotvrdilo, protože robota brzdil jiný
      omezovač (odstup od překážky, `lp-robot-se-plazi-vyhlazovani`). Potvrzeno venku 18. 9. 2026
      s opraveným kurzem (`20260918-155329.rec`): příkazovaná rychlost p50 1,0 m/s při stropu
      `maxspeed=1` v provozním profilu, tedy robot jede na povoleném stropu; a článek
      `regulator-sledovani-drahy` 20. 9. ukázal, že podlaha západky `d_min/(k·T_rot)` = 0,048 m/s
      je přesně to, co se 14. 8. naměřilo.
    kroky:
      - co: "Diagnostika po stupních (grid, obálka, plánovač, regulátor)"
        stav: hotovo
        kdy: 2026-08-14
      - co: "Cíl řízení = nejbližší uzel dráhy, přeskok blízkých uzlů, dva regresní testy"
        stav: hotovo
        kdy: 2026-08-14
      - co: "Potvrdit na zařízení, že robot dosáhne povolené rychlosti — 18. 9. 2026 venku `vCmd` p50 1,0 m/s při `maxspeed=1` (`ARBot.Analyze localplan`, `envelope`)"
        stav: hotovo
        kdy: 2026-09-18
    odkazy:
