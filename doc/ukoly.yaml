      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
    devlog: [2026-08-21, 2026-08-23, 2026-09-15, 2026-09-16, 2026-09-18, 2026-09-20]

  - id: vid-kalibrace-kamer-bias
    oblast: videni
    nazev: Chybná kalibrace kamer je bias, který lokalizace integruje
    druh: vada
    stav: otevreno
    nalezeno: 2026-08-20
    popis: >
      Chyba v montáži kamery (yaw o 1° při dohledu 3–6 m) posune celý bodový oblak o 5–10 cm —
      o řád víc, než je vlastní šum korelace (5 mm). Filtr bere měření jako nezávislá, takže
      bias vyhraje vahou počtu a póza se drží posunutá s falešnou jistotou. Kalibrace je tedy
      pravděpodobně dominantní chybový člen. Rozlišovací znak jde změřit hned: bias z montáže
      se s kurzem otáčí, posun mapy ne — stačí projet smyčku. Extrinsiky reálných D435 neměřené.
    kroky:
      - co: Projet smyčku a sledovat, zda se hlášený nesouhlas otáčí s kurzem
        stav: otevreno
      - co: Změřit extrinsiky skutečných D435
        stav: otevreno
    odkazy:
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
      - text: traversability-grid.md
        cesta: doc/traversability-grid.md
    devlog: [2026-08-20, 2026-08-23]

  - id: vid-zpetna-projekce-hloubka
    oblast: videni
