  - id: prov-zaznam-nevidet-ze-nebezi
    oblast: provoz
    nazev: V terénu není poznat, jestli se běh nahrává a kam
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-17
    popis: >
      Po jízdě 17. 9. 2026 (track po kalibraci magnetometru, podle obsluhy s dobrým kurzem) se
      nenašel žádný `*.rec` — a proč, to ze záznamů dohledat nejde, protože chybí právě ten
      záznam. Při hledání se ukázalo, že o nahrávání nemluví nic, co má obsluha v terénu po ruce,
      a u robota je jen mobil:
      `RecordPathFromParams()` napíše „beh se zaznamenava do …" do `Trace` PŘED tím, než runtime
      stojí, takže ta hláška skončí jen v journalu a do záznamu se z principu dostat nemůže —
      táž past jako s účinnou konfigurací, opravená 5. 9. 2026 zopakováním po připojení mostu.
      Když je `record=` prázdné nebo `false`, vrátí se `null` MLČKY, takže neexistuje ani ta
      jedna řádka. `ARBotRuntime.RecordPath` se plní jen ve `WireView`, v `Run` zůstává `null`,
      tedy runtime ani sám neví, kam píše. A stránka náhledu o nahrávání nemá ani slovo.
      Běh, který se nenahrál, je proto v terénu k nerozeznání od běhu, který se nahrál.
      Dohledáno na zařízení týž den — a jsou to DVA různé běhy, ne jeden.
      Pokus v 16:21:22 (`20260917-162122.rec`) se do souboru nedostal vůbec: `Start(Run)` uvízl
      na deadlocku (`prov-deadlock-mise-webstatus`) o kus dřív, než se `FileStream` vůbec zakládá,
      takže hláška „beh se zaznamenava do …" v journalu je, ale soubor nikdy nevznikl. Ta hláška
      se totiž tiskne v `RecordPathFromParams()`, tedy PŘED `WireRun` — **říká záměr, ne
      výsledek**, a to je samo o sobě matoucí.
      Druhý pokus je v následujícím bootu (16:22:52) a **robota skutečně řídil** — obsluha má
      snímky stránky z **16:26** (`běží true`, kurz 0,355 rad, rychlost **0,905 m/s**, trasa,
      plán i mrkev) a z **16:29**. Hodiny přitom sedí na sekundy: snímek z 16:20 zachycuje dialog
      o zápisu kalibrace (journal 16:20:16–20) a snímek z 16:21 ukazuje **vlastní čas stránky
      16:21:22**, tedy přesně okamžik `POST /mission?m=track` v journalu.
      ⚠️ **Po tom běhu ale nezůstalo NIC — ani záznam, ani journal — a to je pořád neurčené.**
      Journal toho bootu končí v **16:23:24** (zatímco robot jel ještě aspoň 6 minut), služba
      `arbot` v něm nevypsala **ani řádek**, ačkoli jádro ve stejné chvíli hlásí enumeraci kamer
      (tedy aplikace běžela), a v datovém adresáři není mezi 16:22 a 18:28 zapsaný ani bajt.
      Plný disk to nebyl (366 GB volných), `record=true` platilo všude a hodiny jsou z RTC.
      ⚠️ **Prověřeno na zařízení 17. 9. večer a nic z toho to nevysvětluje** — vyloučeno je:
      plný disk (366 GB volných), chyba disku nebo `errors=remount-ro` (v journalu žádná chyba
      ext4/NVMe), ztráta přes armbian-ramlog (`/var/log` sice JE na zramu, ale `journal` je
      symlink na `/var/log.hdd`, tedy na disk), záznam odložený vedle binárek
      (`~/arbot-headless-run/records/` neexistuje), škrcení journaldem (žádné „Suppressed"),
      posun hodin (snímky stránky sedí s journalem na sekundy) a jiný boot (výpis všech 18 bootů
      mezi 16:23:24 a 18:28:13 žádný nemá).
      **Co zbývá jako holý fakt:** v tom bootu služba `arbot` nastartovala v 16:23:00, jádro
      v 16:23:16–24 enumeruje obě D435 (tedy aplikace běžela a otevírala kamery) — a služba
      přitom do journalu nevypsala **ani jeden řádek**, ani úvodní verzi, ani výpis konfigurace,
      ani „Ceka se na vyber mise". Chybí zároveň **výstup do journalu i záznam**, tedy obojí, co
      aplikace zapisuje, ačkoli podle snímků jela a řídila robota rychlostí 0,9 m/s.
      Další krok je **reprodukce**: pustit touž misi znovu a sledovat, jestli se výpis do journalu
      objeví. Nezávisle na tom dává smysl odstranit spouštěč celé té epizody — deadlock
      (`prov-deadlock-mise-webstatus`).
      ⚠️ **Hypotéza „tvrdé vypnutí to spolklo" NESTAČÍ** a je poctivé to říct: `/etc/fstab` má
      kořen na `commit=120` a `RecordingTarget.OnFlush` dělá jen spravovaný `Flush()` do stránkové
      cache (**nikdy `fsync`**), takže se ztratí nanejvýš ~2 minuty — jenže mezi posledním řádkem
      journalu a snímkem obrazovky je **5,5 minuty**.
      ✅ **Hodiny robota ale z podezřelých vypadly, a to měřením ZE ZÁZNAMU** (`ARBot.Analyze gps`,
      nový blok A0): GPS nese ITOW, tedy absolutní čas, který nepochází z hodin Pi. Po rekonstrukci
      (viz `hw-gps-fixtime-rozbity`) vychází den v týdnu **4 = čtvrtek** a systémový čas je proti
      GPS **+3,9 s** v jednom záznamu a **+4,0 s** v druhém — tedy hodiny jdou a ty ~4 s jsou
      konstantní zpoždění řetězu, ne drift. Časová osa v záznamech i v journalu je proto skutečná
      a v 16:29 byl robot podle vlastních hodin **vypnutý**. Čas 16:29 tedy pochází z jiných hodin
      než robotových; rozhodne obsah toho snímku.
      Nezávisle na tom platí, že chybějící `fsync` je vada sám o sobě: záznam nemá přežít
      odpojení napájení jen náhodou.
    kroky:
      - co: Nález — proč to nejde dohledat (žádná stopa mimo journal, stránka mlčí)
        stav: hotovo
        kdy: 2026-09-17
      - co: "`RecordPath` plnit i ve `WireRun` a dát na stránku řádek „nahrává se do …\" / „BEZ ZÁZNAMU\""
        stav: otevreno
      - co: Hlásit i případ `record=false` a hlášku zopakovat po připojení `TraceInfoBridge`
        stav: otevreno
      - co: Na zařízení dohledat, proč záznam ze 17. 9. po kalibraci chybí — pokus 16:21 vysvětlen, běh v 16:29 NE
        stav: otevreno
      - co: "Záznam přežije odpojení napájení: `fsync` (`Flush(true)`) v `OnFlush`, nebo aspoň hned po založení souboru"
        stav: otevreno
      - co: Hláška „beh se zaznamenava do …" má říkat výsledek, ne záměr (dnes se tiskne před `WireRun`)
        stav: otevreno
    odkazy:
      - text: record-replay.md
        cesta: doc/record-replay.md
      - text: ARBotRuntime.cs
        cesta: Src/ARBot.Runtime/Robot/ARBotRuntime.cs
      - text: WebStatus.cs
        cesta: Src/ARBot.Runtime/Web/WebStatus.cs
    devlog: [2026-09-17]
    ceka_na: []

  - id: mise-magcal-sber-po-zapisu
    oblast: mise
    nazev: Kalibrace magnetometru se po zápisu sama znehodnotí — kolektor sbírá dál
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-17
    popis: >
      Mise `magcal` došla do verdiktu HOTOVO v 48. s (podmíněnost 330, `sd|B|` 0,0026 G) a
      HOTOVO držela 88 s. V 16:20:16 obsluha ťukla na zápis, v 16:20:20 se kalibrace zapsala
      do registru 23 i do flash — a v 16:20:19, tedy uvnitř toho zápisu, se proložení
      zhroutilo: `sd|B|` 0,0026 → 0,0073 → 0,0276 G, měřítko osy z 1,03 → 2,46 a verdikt spadl
      na „NEPOUZITELNE: pole je porad nekonzistentni. Postav robota na JEDNO misto dal od kovu
      a zacni znovu." Ta rada je opačná než skutečnost — pole konzistentní bylo a přestalo být
      právě tím zápisem.
      Příčina je v kódu, ne v poli. `MagCalMission.Consume` přidává každý `IMUState` do
      kolektoru bez ohledu na fázi, `MagCalCollector.Add` žádnou bránu nemá a proložení se
      počítá přes celou nasbíranou sadu. `MagnetometerRaw` (`UncompMag`) je přitom podle měření
      z 12. 9. 2026 pole KOMPENZOVANÉ — právě proto si mise registr 23 před sběrem sama maže.
      Po zápisu už vymazaný není, takže od té chvíle padají do téže sady vzorky měřené přes
      novou kompenzaci a fit míchá dvě různé soustavy.
      Zapsaná kalibrace je přitom v pořádku — zapsalo se to, co platilo v okamžiku ťuknutí
      (`1,092364 … −0,109534`, tedy dobrá první půlka dat), ne ten rozpadlý výsledek; gate
      `Usable` ve `WriteToSensor()` drží. Vada je v tom, co obsluha uvidí PO úspěšném zápisu:
      „NEPOUŽITELNÉ" a pokyn začít znovu, tedy zahodit kalibraci, která právě vyšla.
    kroky:
      - co: Nález a důkaz ze záznamu (časová shoda zhroucení se zápisem do registru 23)
        stav: hotovo
        kdy: 2026-09-17
      - co: Po `MagCalPhase.Written` přestat sbírat; další měření začíná s prázdnou sadou
        stav: otevreno
      - co: Test, že zápis sám verdikt nezmění
        stav: otevreno
