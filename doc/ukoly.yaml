      - co: "Gate `MaxOutsideCorridorM` → `CorridorFixReason.OutsideCorridor`"
        stav: hotovo
        kdy: 2026-08-22
      - co: "Ověřit gating s korekcemi naostro na zařízení — 18. 9. NIS p50 0,5, 0 % zamítnuto, `DroppedByFusion` 0; 19. 9. 1 404 z 1 404 (podíl `OutsideCorridor` nevyčíslen)"
