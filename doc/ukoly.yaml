    popis: >
      Obě D435 se po bootu hlásily jen rychlostí USB 2.0, na které se hloubka a barva nevejdou
      ani pro jednu kameru — robot tedy neviděl nic a kernel si nestěžoval. Odpojení a zapojení
      linku vrátilo na 5 Gbps. Domněnka o nedovřeném konektoru padla (autor s kabely nehýbal);
      jde o SuperSpeed linku, která se při bootu nenatrénuje. Série restartů na nabíječce dala
      6× dobře, jediná stopa je napájení (selhání přišlo na dosluhující baterii). Od 11. 9. driver
      typ linky hlásí a na USB 2.0 varuje i s léčbou; měření na baterii se neudělalo.
    kroky:
