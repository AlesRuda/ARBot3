  - id: lok-koridor-gating-a-gate-mimo-koridor
    oblast: lokalizace
    nazev: Hranová lokalizace za běhu zahazovala 77 % korekcí a hlásila měření i metr mimo cestu
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-22
    vyreseno: 2026-09-20
    popis: >
      Při prvním běhu hranové lokalizace (`corridor=`) vyplavaly dvě vady. Tvrdý gate `Reject`
      pustil jen 65 z 280 měření, protože měření tvrdilo 3 cm jistoty a nesouhlasilo o 55 cm;
      přepnuto na `GateMode.Soft`, jak předepsalo rozhodnutí z 20. 8. Stupeň navíc hlásil platné
      měření i při příčné poloze 2,1 m od osy koridoru širokého 2 m — doplněn gate „jsem uvnitř
      koridoru" (`OutsideCorridor`) a počítadlo, kolik korekcí fúze skutečně přijala
      (`DroppedByFusion`), protože „poslali jsme" není totéž co „došlo to". Přitom se ukázalo, že
      rig dvou map ani `poseerror=` nemohou ověřit konvergenci — vkládají chybu do pozorování,
      ne do pózy. Na zařízení jde koridor naostro od 17. 9. (`a44b4f4`), první jízdy 18. 9.:
      `corrections` NIS p50 0,5, 0 % zamítnuto, fúzí nezahozeno nic; na Robotouru 19. 9. přijato
      1 404 z 1 404 včetně NIS 443 — Soft gate na zařízení prokazatelně nezahazuje, a jeho
      odvrácenou stranu (skoky pózy) vede `lok-koridor-skoky-pozy`. Podíl `OutsideCorridor`
      v rozpadu ze zařízení samostatně vyčíslený není.
