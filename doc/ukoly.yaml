  - id: lp-rychlostni-obalka-neridila
    oblast: lokalni-planovani
    nazev: Rychlostní obálka lokálního plánovače v přímé jízdě vůbec neřídila
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-02
    vyreseno: 2026-09-03
    popis: >
      Strop rychlosti z odstupu od překážek a z hranice potvrzeného terénu platil jen v uzlu, do
      kterého se přijíždí, ne podél úseku — a u dvoubodového plánu robot → mrkev (100 % plánů
      FreeRunu) se strop startovního uzlu nikdy nečetl. Změřeno: strop 0,30 m/s, robot jel
      0,86 m/s. Po opravě obálka poprvé skutečně řídila — a hned bylo vidět další dvě věci: robot
      po startu 10 s lezl 0,05 m/s, protože grid před ním nic nepotvrdil (léčba: půdorys robota je
      pro obálku sjízdný), a radiální rampa brzdila i podél okraje trávy (léčba: směrový model,
      `envelope=directional`). Nový graf rychlostního profilu v pohledu World tu vadu odhalil.
      Na zařízení obálka řídí od 7. 9. 2026 (`ARBot.Analyze envelope`: `VAlong` vázal v 77 %
      plánů — právě ona robota zpomalila na 0,05 m/s, viz `lp-robot-se-plazi-vyhlazovani`);
      18. 9. za jízdy neváže nic při 1,0 m/s. Směrový model a půdorys robota z jízdy rozlišit nejdou.
