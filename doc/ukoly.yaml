      oblouku hluboko pod rezervou 1 cm), ale konkrétní čísla v obou tabulkách neplatí. Je to
      táž třída vady jako `maxspeed=1` v `pi-freerun.cfg`, kde komentář popisoval počáteční
      hodnotu, ačkoli se strop mezitím zvedl — autoritativní je kód, dokument se zapomněl
      přepsat.
