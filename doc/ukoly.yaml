  - id: lok-koridor-hranova-lokalizace
    oblast: lokalizace
    nazev: Lokalizace z hran cesty místo z plochy
    druh: zamer
    stav: v-kodu
    nalezeno: 2026-08-21
    vyreseno: 2026-08-21
    popis: >
      Plošná korelace platí za informaci, kterou vnitřek cesty nenese; stačí najít hranici cesty,
      proložit ji přímkou a v místě robota změřit šířku, příčnou polohu a odchylku osy. Spike nad
      záznamem dal příčnou polohu na 3 cm a směr na 0,8° za 0,1 ms na snímek proti 62–104 ms
      plošného skenu. Vznikl `CorridorFinder`, mapová protistrana `RoadAxis` a stupeň
      `CorridorLocalizer` (`corridor=`), který posílá do fúze příčné a kurzové měření. Od 15. 9.
      běží v provozním profilu v měřicím režimu (bez vlivu na řízení); první jízda ze zařízení 16. 9. (2 256 cyklů, 424 přijatých).
      **18. 9. 2026 první jízdy s korekcemi naostro** (`20260918-154028.rec`, `-155329.rec`): za jízdy měření v 52–54 % cyklů (rezidua 7 cm, ~43 inlierů na stranu, úsečky 7 m), ve stání 0,6 %; do fúze odešlo 2 821 + 2 889 měření a fúze se jimi řídí (`odhad − IMU yaw` z ±0,06° na ±1,9°). ⚠️ Přesnost pózy tím ověřená není — s korekcemi naostro je příčný nesouhlas (p50 0,06 m) self-konzistence.
      Robotour 19. 9.: koridor je jediná příčná reference (za jízdu stáhl 20–28 m driftu), ale
      skoky pózy 0,6–4 m jdou všechny za ním (`lok-koridor-skoky-pozy`) — to je dnes to, co
      koridoru reálně chybí; tři podmínky z `lok-korelace-tri-podminky-naostro` se u něj obešly.
    kroky:
      - co: Spike nad záznamem z virtuálních kamer
        stav: hotovo
        kdy: 2026-08-21
      - co: "`CorridorFinder`, `RoadAxis`, `CorridorLocalizer` a `RoadCorridorMsg` v repozitáři"
        stav: hotovo
        kdy: 2026-08-21
      - co: Ověřeno během v simulaci (178 měření za 40 s, chyba polohy 0,027 m, kurzu 0,18°)
        stav: hotovo
        kdy: 2026-08-23
      - co: "Kvalita hranice na reálné D435 (18. 9.: rezidua 7 cm, ~43 inlierů, dosah 7 m; každá kamera vidí jen svou hranu — křižovatka na trati nebyla)"
        stav: hotovo
        kdy: 2026-09-18
      - co: Zapnout posílání korekcí naostro (autor, `config/pi-provoz.cfg`, commit `a44b4f4`)
        stav: hotovo
        kdy: 2026-09-17
      - co: První běh na zařízení v měřicím režimu (`20260916-164926.rec`)
        stav: hotovo
        kdy: 2026-09-16
      - co: Ověřit přesnost pózy s korekcemi (A/B `corridorsend=false` po téže trati, nebo pravda)
        stav: otevreno
      - co: Změřit, jak rychle póza po výpadku koridoru (stání, jedna kamera) spadne na GPS při `gpsposstd=30`
        stav: otevreno
    ceka_na: [lok-koridor-skoky-pozy]
