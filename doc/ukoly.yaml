  - id: lok-koridor-za-jizdy-propada
    oblast: lokalizace
    nazev: Koridor za jízdy propadal v 92 % cyklů
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-22
    vyreseno: 2026-08-24
    popis: >
      Za 40 s jízdy dalo měření jen 35 ze 411 cyklů. Rozpad ukázal tři různé věci: ~60 % cyklů
      nemělo snímek druhé kamery v okně 60 ms (`NoPair`), část byla stání v cíli na konci cesty
      (zamítnutí správně) a zbytek symetrické sbíhání hranic ~11° těsně nad prahem 10°. Hypotéza
      ohybu ze zpětné projekce padla testem `BoundaryStraightnessTests`. `NoPair` vyřešila
      kompenzace pohybu mezi snímky (`Reproject`, párování se do té doby dívalo jen dozadu):
      `NoPair` 260 → 20, přijatých 76 → 159. Sbíhání ~11° nakonec žádná vada nebyla — byla to
      nálevka v testovací mapě (rozšíření 1 → 3 m na 10 m dává přesně 11,42°); nad mapou
      s konstantní šířkou je 100 % cyklů přijato po prvních 60 s. Proložené přímky kreslené
      v mapě navíc ukázaly, že většina zamítnutí padá na křižovatku a slepý konec, kde koridor
      existovat nemá.
