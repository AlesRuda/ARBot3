  - id: hw-t265-v-librealsense-253
    oblast: hw
    nazev: Obava, že librealsense 2.53 už T265 nepodporuje
    druh: vada
    stav: hotovo
    nalezeno: 2026-07-13
    vyreseno: 2026-09-11
    popis: >
      Při portu T265 na Armbian se zapsalo riziko „T265 byl v librealsense 2.50+ odebrán, podporu
      v 2.53 nutno ověřit na HW", a `build-and-platforms.md` to vedl jako otevřenou otázku.
      Rešerše 11. 9. ukázala, že to byl omyl: `v2.53.1` má `src/tm2` a T265 vypadl až ve 2.54.1;
      2.50 je jen poslední validovaná verze. Na zařízení T265 3. 9. skutečně nabootovala.
      Sedíme tedy na stropu verzí, nahoru ani dolů nemá smysl. (Že se T265 13. 9. odpojila
      natrvalo, je jiné rozhodnutí.)
    kroky:
