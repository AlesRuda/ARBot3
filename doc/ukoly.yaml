    popis: >
      Při návrhu globální navigace se ukázalo, že mapper měření krmí filtr jen kurzem a gyrem
      z IMU: GPS ani odometrie do fúze netekly a referenční bod roviny nikdo nenastavoval, takže
      stav EKF neměl žádné měření polohy ani rychlosti. Doplnilo se mapování GPS na polohu
      a rychlost, odometrie na rychlost a úhlovou rychlost, počátek roviny z mapy (`map=`)
