  - id: hw-vn100-heading-relative
    oblast: hw
    nazev: Kurz z VN100 byl o −59° vedle, protože senzor přišel o konfiguraci
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-06
    vyreseno: 2026-09-06
    popis: >
      Čtyři dny předtím kurz seděl na −0,25°. Ze záznamu se dokázalo, že chyba není v GPS, v kódu
      ani v gyru, ale v atitudovém řešení senzoru — a ten si přitom hlásil nejistotu 0,23°, kterou
      fúze brala doslova. Read-only `deploy/vnprobe.sh` na živém senzoru našel dva změněné registry:
      heading mode `Relative` místo `Absolute` (yaw k místu náběhu, ne k severu) a vymazanou
      kalibraci magnetometru. `vnrestore.sh` obojí obnovil do flash; heading mode zabral prokazatelně
      (kurz se za ~100 s přetočil na pole). Obnovená kalibrace z ARBot2 se ale ukázala horší než
      žádná (bias větší než zemské pole, kompas přestal reagovat na otáčení) a týž den se vymazala.
    kroky:
