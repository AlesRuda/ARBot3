      - co: 'Průchod misí v simulaci proklikán autorem'
        stav: hotovo
        kdy: 2026-08-27
      - co: 'Celý průchod bez operátora na zařízení (Robotour 19. 9. 2026, Kolo3b)'
        stav: hotovo
