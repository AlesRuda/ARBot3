  - id: hw-kamery-hotplug
    oblast: hw
    nazev: Kamery RealSense odolné proti odpojení a znovupřipojení za běhu
    druh: zamer
    stav: hotovo
    nalezeno: 2026-07-13
    vyreseno: 2026-09-06
    popis: >
      T265 i D435 se připojují líně ve vlastní smyčce, odpojení poznají přes `QueryDevices`
      a timeout `TryWaitForFrames` (T265 se odpojení projeví jen timeoutem, ne výjimkou), pipeline
      zboří a znovu postaví bez busy-loopu; `IsError` říká „nepřipojeno". Na obou platformách.
      Na zařízení mechanismus reconnectu prokazatelně běží (journal 6. 9. počítá reconnecty).
      Výpadky D435 za provozu se ale ukázaly jako širší, Intelem nevyřešený problém — zamrzlý
      stream, supervizor zotavení kamer a vadná USB větev jsou navazující samostatná témata.
    kroky:
      - co: T265 lazy reconnect
        stav: hotovo
        kdy: 2026-07-13
      - co: D435 lazy reconnect na obou platformách
        stav: hotovo
        kdy: 2026-07-21
      - co: Ověřeno na zařízení (reconnecty v journalu)
        stav: hotovo
        kdy: 2026-09-06
    odkazy:
      - text: hardware.md
        cesta: doc/hardware.md
    devlog: [2026-07-13, 2026-07-21, 2026-09-06, 2026-09-11]
