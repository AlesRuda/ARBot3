  - id: lok-korelace-posun-jako-stav-ekf
    oblast: lokalizace
    nazev: Posun mapa–GPS jako stav filtru
    druh: zamer
    stav: odlozeno
    nalezeno: 2026-08-20
    popis: >
      Návrh autora: kamera neměří polohu, ale vztah k cestě, takže by posun mezi rámcem GPS
      a rámcem mapy mohl být samostatný stav EKF krmený korelací. Týž den se závěr otočil —
      přímá korekce pózy stačí, protože všechny cíle robota jsou mapově relativní a absolutní
      přesnost je stejně omezená chybou mapy. Stav bude potřeba až pro použití nezávislé na mapě
      (návrat do depa podle GNSS, jiný zdroj mapy).
    odkazy:
      - text: rozhodnutí 20. 8. 2026
        cesta: doc/decisions.md
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
    devlog: [2026-08-20]

