  - id: prov-start-po-rebootu
    oblast: provoz
    nazev: Start služby po skutečném rebootu Orange Pi se nezkoušel
    druh: zamer
    stav: hotovo
    nalezeno: 2026-09-05
    vyreseno: 2026-09-17
    popis: >
      Služba `arbot` je `enabled` s `Restart=always`, restart služby i SIGTERM jsou ověřené,
      ale nikdo ještě nenechal desku nabootovat od studena a nezkontroloval, že runtime
      nastartuje, rozjede senzory a stojí, dokud mu člověk nevybere misi. Souvisí s tím
      i kamery, které se po bootu občas vyčtou jen na USB 2.0.
      Prošlo provozem: 17. 9. 2026 obsluha robota vypnula a zapnula (boot 16:22:52), služba
      nastartovala v 16:23:00, jádro enumerovalo obě D435 a v 16:26 robot podle snímků stránky
      řídil (trasa, plán, mrkev); na Robotouru 19. 9. byl robot zapnutý od rána a po nabití
      baterie znovu, pokaždé senzory po bootu žily. Výhrada: journal právě toho bootu ze 17. 9.
      je anomální (služba nevypsala ani řádek, vede `prov-zaznam-nevidet-ze-nebezi`), takže
      z něj je vidět jen start služby. Sérii startů na baterii kvůli USB 2.0 nikdo nepočítal
      (`hw-kamery-usb2-po-bootu` zůstává vlastní téma).
    kroky:
      - co: "Reboot desky a kontrola journalu, náhledu a senzorů po startu — 17. 9. (vypnutí a zapnutí obsluhou): služba naběhla za 8 s, kamery enumerovány, robot řídil; potvrzeno provozem 19. 9."
        stav: hotovo
        kdy: 2026-09-17
