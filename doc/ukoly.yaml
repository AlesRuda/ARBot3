  - id: hw-gps-fixtime-rozbity
    oblast: hw
    nazev: "`GPSState.FixTime` je nesmysl — ovladač u-bloxu skládá ITOW špatně"
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-17
    popis: >
      `uBloxGps.Read` rozkládá ITOW (čas v GPS týdnu [ms]) na dny/hodiny/minuty/sekundy a
      **sekundy dělí špatně**: `s = ITOW/1000 - ((d*24+h)*60 + m*60)`, kde místo `*60` má u hodin
      být `*3600`. Výsledek je pak mimo — v záznamech ze 17. 9. 2026 vychází `FixTime`
      „**9 dní** 02:16:12", ačkoli v GPS týdnu jsou dny jen 0–6. Do UI to jde rovnou
      (`GpsDocument.FixTimeText`), takže panel GPS ukazuje nesmyslný čas fixu.
      Chyba je naštěstí **deterministická a invertovatelná**: platí
      `TotalMs = ITOW + 84 960 000·D + 3 540 000·H`, takže se z uložené hodnoty dá ITOW spočítat
      zpátky — a `ARBot.Analyze gps` (blok A0) to dělá, protože starší záznamy se přepsat nedají
      a jsou jediným absolutním časem, který nepochází z hodin Pi.
      ⚠️ **Oprava ovladače změní význam pole**, takže inverze v analyzátoru musí umět obojí
      (pozná to podle toho, že den v týdnu je 0–6).
    kroky:
      - co: Nález a invertovatelnost ověřená na záznamech (den v týdnu vyšel 4 = čtvrtek)
        stav: hotovo
        kdy: 2026-09-17
      - co: Opravit rozklad v `uBloxGps.Read` (a nechat inverzi v analyzátoru pro starší záznamy)
        stav: otevreno
      - co: Test nad známým ITOW (dnes to nekryje nic)
        stav: otevreno
    odkazy:
      - text: uBloxGps.cs
        cesta: Src/ARBot.HAL/Devices/GPS/uBlox/uBloxGps.cs
      - text: GpsReport.cs
        cesta: Src/ARBot.Analyze/GpsReport.cs
    devlog: [2026-09-17]
    ceka_na: []

  - id: prov-deadlock-mise-webstatus
    oblast: provoz
    nazev: Deadlock mezi zámkem mise a zámkem stránky při volbě mise
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-17
    vyreseno: 2026-09-19
    popis: >
      17. 9. 2026 v 16:21:22 se po volbě mise `track` ze stránky runtime zasekl uvnitř
      `Start(Run)`. `HangWatchdog` vystřelil a pořídil minidump
      (`logs/hang-Start-Run-20260917-162142.dmp`) — a z jeho zásobníků je příčina určená
      jednoznačně. Je to klasická inverze pořadí zámků (ABBA):
      vlákno volby mise drží zámek `TrackMission` (`StartMission` → `lock (gate)` → `EnterPhase`
      → `EmitState` → `EmitDerived` → `RelaySource.Post` → `WebStatus.Post`) a čeká na zámek
      `WebStatus`; vlákno webového serveru drží zámek `WebStatus` (`Handle` → `ToJson` →
      `lock (gate)` → `AppendHead`) a čeká na zámek `TrackMission` (`get_PhaseText`).
      Spouštěč je proto úplně běžný provoz: stránka se sama obnovuje, takže stačí, aby dotaz
      na stav přišel ve chvíli, kdy se mise zakládá — a v terénu se na stránku kouká právě
      v ten okamžik, protože se z ní mise vybírá.
      ✅ **Že je cyklus UZAVŘENÝ (tedy skutečný deadlock, ne jen dlouhé čekání), je ověřené
      v kódu:** `WebStatus.ToJson` bere `lock (gate)` a **uvnitř něj** volá `AppendHead`, tedy
      i `TrackMission.PhaseText`. Sám se nerozpustí — jediné, co ho ukončí, je konec procesu.
      Sedí to i s tím, co obsluha udělala: stránka zmlkla a robota vypnula a zapnula.
      Kořen je porušení pravidla, které si `RelaySource` sám píše: fan-out běží na vlákně
      producenta, takže se do něj nesmí vstupovat s drženým zámkem. Léčba je publikovat
      AŽ MIMO zámek — pod zámkem zprávu jen složit. Totéž platí pro každou další misi a stupeň,
      který volá `EmitDerived` zevnitř `lock`, a pro `WebStatus.ToJson`, který si má stav misí
      napřed ofotit a teprve pak skládat odpověď.
      **Opraveno 17. 9. 2026, z obou stran** (jedna by stačila, ale invariant má platit oběma
      směry): mise skládá zprávu pod zámkem a **publikuje až mimo něj** — drží to `using`
      rozsah (`Publikace()`), takže se na to nedá zapomenout ani při `return` uprostřed zámku,
      a vnořená volání (`Abort` zevnitř `OnGlobalNav`) mlčí podle `Monitor.IsEntered`, aby
      publikoval vždy jen nejvnějšnější rozsah. `WebStatus.ToJson` si stav mise **ofotí před**
      svým zámkem (`NactiMisi`), takže se drží vždy jen jeden zámek.
      ⚠️ **Prohlédnuty byly všechny mise a týká se to jen dvou:** `TrackMission`
      a `RobotourMission`. `FreeRunMission` i `MagCalMission` nemají zámek **žádný** (a
      `MagCalCollector` taky ne), takže tam ten tvar vzniknout nemůže — dřívější tvrzení,
      že mají tentýž tvar, bylo mylné. Cesta `WebStatus` → `AppendMagCal` →
      `MagCalWriteBlockedReason` čte jen uloženou zprávu, ne misi.
      Hlídají to tři testy (`MisePublikujeMimoZamekTests`, jeden i v rigu Robotouru), které
      **prokazatelně chytají vrácenou vadu** — po dočasném vrácení publikace pod zámek spadly.
      Na zařízení od 18. 9. (binárka nasazená spolu s profilem `a44b4f4`): 18. 9. dvě volby mise
      Track ze stránky, 19. 9. na Robotouru nejméně osm voleb mise Robotour z telefonu
      s otevřeným, samoobnovujícím se náhledem — bez jediného záseku, kdežto 17. 9. nastal
      při jedné ze tří voleb. Důkaz je statistický (závod), deterministicky to kryjí testy.
    kroky:
      - co: Příčina určená z minidumpu (oba zásobníky, uzavřený cyklus zámků)
        stav: hotovo
        kdy: 2026-09-17
      - co: Publikovat mimo zámek (`Publikace()` + `Vypust()`) v `TrackMission` i `RobotourMission`
        stav: hotovo
        kdy: 2026-09-17
      - co: "`WebStatus.ToJson` si stav mise ofotí předem (`NactiMisi`), ne pod vlastním zámkem"
        stav: hotovo
        kdy: 2026-09-17
      - co: Testy pořadí zámků (ověřeno vrácením vady — spadnou)
        stav: hotovo
        kdy: 2026-09-17
      - co: "Ověřit na zařízení (volba mise ze stránky při otevřeném náhledu) — 18. 9. 2× Track, 19. 9. ≥ 8× Robotour bez záseku; důkaz statistický"
        stav: hotovo
        kdy: 2026-09-19
    odkazy:
      - text: headless.md
        cesta: doc/headless.md
      - text: TrackMission.cs
        cesta: Src/ARBot.Common/Missions/TrackMission.cs
      - text: WebStatus.cs
        cesta: Src/ARBot.Runtime/Web/WebStatus.cs
      - text: RelaySource.cs
        cesta: Src/ARBot.Common/Communication/RelaySource.cs
