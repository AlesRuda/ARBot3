  - id: lok-freerun-kurz-staci-na-zapad
    oblast: lokalizace
    nazev: Při jízdě FreeRun na jih ujel kurz VN100 i odhadu o desítky až 180° (atitudové řešení senzoru přestalo brát magnetometr)
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-24
    popis: >
      Autor 23. 9. 2026 na cyklostezce v Modřanech (`OSM/modrany2.osm`): tam (mise Track, na sever)
      kurz seděl, zpět (FreeRun, na jih) se kurz odhadu postupně stáčel, ačkoli robot jel stále na jih.
      **Rozbor záznamů 24. 9.** (`records/test/20260923-144934.rec`, `-145648.rec`; `ARBot.Analyze
      heading` bloky *DRIFT PROTI GYRU* a *SMĚR POSUNU*, `vn100`): robot podle GPS jel celou dobu
      na azimut 170–184°, ale **VN100 yaw šel 166 → 100 → 4 → 323°** (za 5 min) a ve druhém běhu
      152 → 18° (za 2 min), tedy **doleva = k VÝCHODU** (autor 24. 9. potvrdil, že se spletl ve
      stranách — bylo to na východ; id tématu zůstává). Kurz odhadu a stopa na mapě šly s ním (azimut kurzu odhadu 177 → 73°, posun
      odhadu 160 → 15°), fúze se jen zpožďovala (`odhad − IMU yaw` −20 až −54°). **Magnetometr je
      v pořádku:** `|B|` 0,495 G konstantní, sklon 66,4° (reference 65,95°), kurz z pole − GPS
      kurz +4,7 ± 5,7° (≈ deklinace) — **od pole se odtrhl až yaw senzoru** (`kurz z pole − yaw`
      1,5 → −33 → −103 → 168°), zesílení VPE k poli K ≈ 0 (−0,0035 ± 0,0013 1/s). GPS kurz je
      spolehlivý (Doppler − směr posunu polohy −0,3 ± 3,5°). **Proti integrálu gyra ujíždí GPS
      kurz** (−62° za 330 s, resp. −154° za 150 s, tj. až ~1 °/s), zatímco VN yaw se od gyra
      odchýlí jen o +35 až +130° — nahrávané gyro je `ImuGroup.Gyro` = **AngularRate, kompenzované
      odhadem biasu z Kalmanova filtru VN** (ICD kap. 2.4.11), takže bias ~1 °/s je nejspíš **chybný
      odhad biasu uvnitř VPE**, ne fyzický gyroskop (surové `UncompGyro` se nenahrává, takže to
      dokázané není). Ve stání čte gyro 126–365 °/h proti −4,6 °/h ze 7. 9. Týž den v Track
      (`20260923-143515.rec`) bylo K = 0,010 (τ ~100 s proti 28–53 s 18. 9.) a drift gyra −26°
      za 10 min, tedy stejná vada slabší. Po restartu aplikace (zápis registru 83 `magmodel=`)
      začal VN yaw znovu u pravdy a pak ujel rychleji. **Fúze to nezachytila**, protože `IMU/gyro`
      jde do EKF v plné kadenci (nese většinu informace o úhlové rychlosti) a GPS kurz má σ
      `atan2(0,3; v)` ≈ 21° — a koridor v Modřanech nedal ani jedno měření
      (`lok-koridor-siroka-cyklostezka`). Hypotéza „korekce z mapy táhnou kurz“ tím padá:
      koridor neposlal nic. ⚠️ Registry senzoru (35, 36, 38, 83, 43) v záznamu nejsou.
    kroky:
      - co: "Rozbor záznamu z 23. 9.: `ARBot.Analyze heading` (IMU − GPS kurz podle směru, `--bin=`), `vn100` blok 5 (železo), `odhad − IMU yaw`, přiřazená hrana a posílaný kurz v `RoadCorridorMsg`"
        stav: hotovo
        kdy: 2026-09-24
      - co: "Read-only `deploy/vnprobe.sh` na senzoru: registr 35 (heading mode, adaptivní filtrování), 36/38 (VPE ladění mag/acc), 83, 43 (startovní bias gyra). Očekávané hodnoty z exportu ARBot2 + historie zápisů: 35 = `1,0,1,1`, 36/38 jako export, 43 = (0,0,0), 83 s `UseMagModel=1` (magmodel=). Registr 43 sonda do 24. 9. nečetla, doplněn. Nižší priorita než záznam s `UncompGyro` — registry neřeknou, proč VPE za jízdy magnetometr utlumila. Přečteno 25. 9.: 35–38 a 43 přesně podle exportu, 44 = Run (vada, `hw-vn100-hsi-run-ve-flash`)"
        stav: hotovo
        kdy: 2026-09-25
      - co: "Nahrávat i `UncompGyro` (a teplotu) vedle `Gyro` — rozliší chybný odhad biasu ve VPE od skutečného gyra. V kódu 24. 9. (`IMUState` verze 5, `YprRate` vyřazen kvůli lince, `vn100` blok 6); na zařízení neběželo"
        stav: hotovo
        kdy: 2026-09-24
      - co: "Jízda se záznamem verze 5: `ARBot.Analyze vn100` blok 6 — mění se bias filtru, nebo syrové gyro?"
        stav: otevreno
      - co: "Hypotéza FW (25. 9. 2026): senzor má FW 3.0.0.0, aktuální je v3.1.0.0 (březen 2023). Týž FW jel dobře 12. a 18. 9., takže sám drift nevysvětlí; ukáže-li jízda s `UncompGyro`, že ujíždí jen odhad biasu ve VPE (syrové gyro čisté), zjistit u VectorNavu (S/N 100016133), co 3.1 opravuje, a zvážit update — po něm znovu nahrát konfiguraci i kalibraci (`vnrestore.sh`) a ověřit `vnprobe.sh`"
        stav: otevreno
      - co: "Pojistka ve fúzi: trvalý rozpor VN yaw / integrál gyra proti GPS kurzu za jízdy (Doppler je ověřeně spolehlivý) = VN přestat věřit, případně bias gyra jako stav EKF"
        stav: otevreno
