  - id: lok-koridor-siroka-cyklostezka
    oblast: lokalizace
    nazev: Na široké cyklostezce (Modřany) koridor nedal ani jedno měření — Track se podle něj nekorigoval a FreeRun jel „rovně“
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-24
    vyreseno: 2026-09-24
    popis: >
      Všechny čtyři záznamy z 23. 9. 2026 (`records/test/20260923-*.rec`, mapa `OSM/modrany2.osm`):
      **0 přijatých měření koridoru**, koridor se proložil v 0,2–0,3 % cyklů (18. 9. na Hviezdoslavově
      ~52 %). Za jízdy vadí `TooFewInliers` a `OneSideOnly`; přímky obou hran existují v ~50 %
      cyklů, ale s mediánem **21–25 inlierů** proti prahu `corridormininliers=25` (18. 9. 39–43),
      v Track na pravé straně jen 10 (rezidua 0,116 m). FreeRun proto měl mrkev z koridoru jen
      v 18 z 6 632 cyklů a jinak držel kurz — ten ujíždějící (`lok-freerun-kurz-staci-na-zapad`);
      na cestě ho držela lokální mapa. Segmentace sítě je na asfaltu čistá (`backproject --compare`),
      jde tedy o proložení hran na široké cestě (hrana daleko, řídké body). Mapa nemá u cyklostezky
      tag `width` (síť počítá s `roadwidth=3`). V Track navíc 34 % `NoPair` kvůli dvěma zamrznutím
      barvy (pravá 14:38:44, levá 14:40:53, obě zotavené). Kód detekce se od 21. 9. neměnil.
      **Léčba 24. 9. 2026: měření z JEDNÉ hrany** (`corridorsingle=`, výchozí true): kurz ze směru
      hrany (na šířce nezávisí), příčná poloha přes naučenou šířku, jinak mapovou s nejistotou
      `corridorsinglewidthstd=` (1 m) v σ — rozhodnutí autora. `ARBot.Analyze singleedge` nad
      týmiž záznamy: jedna hrana v 48–80 % snímků, kurz z ní proti GPS kurzu p50 −1,3 až +1,2°,
      robustní sd 2,4–4,9°; ve FreeRun drží u nuly, zatímco odhad fúze ujel na 30°+.
      `RoadCorridorMsg` verze 7. ⚠️ Chyba mapové šířky je bias příčné polohy (Modřany: mapa 3 m).
    kroky:
      - co: "Měření z jedné hrany v kódu + `ARBot.Analyze singleedge` + testy"
        stav: hotovo
        kdy: 2026-09-24
      - co: "Jízda na cyklostezce s `corridorsingle=true`: kurz odhadu proti GPS kurzu (`heading`), podíl přijatých z jedné hrany (`corridor`)"
        stav: otevreno
      - co: "Změřit skutečnou šířku cyklostezky (nebo doplnit `width` do mapy) — příčná poloha z mapové šířky je jinak posunutá. Z koridoru při prahu ≤ 15 vychází 4,85–5,3 m (mapa 3 m)"
        stav: otevreno
      - co: "Snížit `corridormininliers` na 12–15 (změřeno `singleedge --sweep`: Modřany 0,2 % → 6–19 % oboustranných koridorů při šířce soustředěné ~5 m, Hviezdoslavova beze změny kvality) — rozhodnutí autora"
        stav: otevreno
