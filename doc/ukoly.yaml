      168 minut) — dotaz přes sdílený zámek jde dál, a 17. 9. se ukázalo, že hlášky marného
      dotazu tečou i do záznamu (140 s po zatuhnutí). Rozpor k přeměření: 14. 9. běh se 7 829
      selháními T265 paměťově nevadil, takže růst ~25 MB na dotaz je buď vázaný na zapojenou,
