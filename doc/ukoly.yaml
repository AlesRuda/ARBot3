  - id: nast-limity-jizdy-view
    oblast: nastroje
    nazev: Pohled v aplikaci s rozborem limitů jízdy pro aktuální nastavení
    druh: zamer
    stav: otevreno
    nalezeno: 2026-09-25
    popis: >
      Nápad autora (25. 9. 2026): parametry jízdy (strop rychlosti, zrychlení, rychlost otáčení,
      lookahead, tolerance rohu) se mění podle schopností robotu i podmínek soutěže, takže tabulky
      v `path-following.md` jsou spočtené pro jednu pevnou sadu a na aktuální hodnoty se
      nepřepisují. Místo toho by aplikace mohla mít pohled, který tentýž rozbor spočítá z právě
      účinné konfigurace: rychlost a poloměr podle úhlu zatáčky, náběh rotace, chybu oblouku proti
      klotoidě, seříznutí zatáčky lookaheadem, nejhorší úhel a porovnání součtu s rezervou
      `PathEpsilonMargin`. Rozbor by počítal tentýž kód jako plánovač (`IMotionProfile`, geometrie
      rohu), ne opis vzorců. Užitečné hlavně při změně `maxspeed=` před soutěží: při 1,7 m/s už
      součet (~11,7 mm) přesahuje rezervu 10 mm.
    kroky:
      - co: Návrh pohledu (tabulka a/nebo graf podle úhlu zatáčky, zdroj parametrů z `ParamRegistry`)
        stav: otevreno
      - co: Implementace (Tools → Limity jízdy), výpočet sdílený s plánovačem
        stav: otevreno
