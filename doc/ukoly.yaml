  - id: lok-kompas-sigma-podlaha
    oblast: lokalizace
    nazev: Kompas si věří 60–90× víc, než jaký je
    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-25
    vyreseno: 2026-09-12
    popis: >
      Senzor VN100 hlásí nejistotu kurzu 0,06°, ale proti kurzu z GPS se trvale mýlí o 3–5°.
      Fúze proto věřila kompasu asi 4 000× víc než GPS a žádná druhá reference kurzu (GPS kurz,
      korelace s mapou) neměla šanci cokoli opravit — odhad kurzu seděl na kompasu na 100 % i se
      zapnutými korekcemi. Jádro je v tom, co sigma kompasu popisuje: krátkodobý šum, ne bias.
      Od 12. 9. má sigma kurzu z kompasu podlahu 5° (`imuheadingstd=`) a absolutní kurz se navíc
      škrtí na 1 Hz (`imuheadinghz=`); gyro jede dál v plné kadenci. Poměr informace spadl
      na ~2,2 : 1, ale poctivý filtr z toho není — bias je časově korelovaný a filtr ho bere
      jako bílý šum.
      18. 9. 2026 (kalibrovaný kompas): chyba kompasu proti GPS kurzu má bias do 3,5° a sd ~4° (včetně šumu GPS kurzu), takže podlaha 5° je správného řádu. A/B `imuheadingstd=5` proti `=0` pořád není.
      Na zařízení jely jízdy 18. a 19. 9. s výchozími 5° / 1 Hz (profil hodnoty nenastavuje, platí
      defaulty registru). Že fúze kompas už nepřebírá, je vidět (`odhad − IMU yaw` −0,01 ± 0,06°
      → +0,39 ± 1,88°), ale je to společný účinek s korekcemi z koridoru naostro, ne A/B podlahy.
    kroky:
      - co: "'Změřit poměr informace kompas : GPS kurz (~4 000 : 1) a že odhad sedí na kompasu na 100 %'"
        stav: hotovo
        kdy: 2026-08-25
      - co: 'Podlaha sigmy kurzu z kompasu `imuheadingstd=` (výchozí 5°, skládá se kvadraticky s `YprU`)'
        stav: hotovo
        kdy: 2026-09-12
      - co: 'Škrcení absolutního kurzu z kompasu `imuheadinghz=` (výchozí 1 Hz, gyro neomezeno)'
        stav: hotovo
        kdy: 2026-09-12
      - co: 'Záznam na zařízení s `imuheadingstd=5` a `=0` nad týmž úsekem (A/B)'
        stav: otevreno
