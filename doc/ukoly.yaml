      - text: robotour-mission.md
        cesta: doc/robotour-mission.md
      - text: osm-nav.md
        cesta: doc/osm-nav.md
    devlog: [2026-09-19, 2026-09-20]
    ceka_na: []

  - id: mise-robotour-armovani-rozptyl
    oblast: mise
    nazev: Mise by se v depu nezarmovala nikdy — práh rozptylu fixů byl pod šumem GPS
    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-26
    vyreseno: 2026-08-26
    popis: >
      Armování v depu čeká na okno kvalitních fixů GPS. Navržený práh 1,0 m byl pod nominálním
      šumem přijímače (σ 1,5 m) a statistika brala největší odchylku, která s délkou okna roste —
      delší čekání kritérium přitvrzovalo. Teď se měří RMS s prahem 2,5 m; tatáž veličina jde
      filtru jako sigma jednoho vzorku. Práh je z úsudku, panel naměřený rozptyl vypisuje, takže
      se má nastavit z prvních běhů na zařízení. Zároveň panel říká, PROČ se nepokračuje
      (fix nedorazil / nesplňuje kritéria / fixy jsou rozházené). Na Robotouru 19. 9. 2026
      armování prošlo pětkrát za 5–6 s (9:29 při 16 družicích a HDOP 1,36; Kolo3a/3b při HDOP
      2,71 / 2,15) — práh RMS 2,5 m nebránil, jediné selhání (158 s) bylo HDOP
      (`mise-robotour-depothdop`). Naměřený rozptyl (`MissionMsg.FixSpreadM`, `ARBot.Analyze
      mission` tiskne `spread=`) z těch záznamů zatím nikdo nevyčetl.
    kroky:
      - co: 'RMS místo maxima, práh 2,5 m'
        stav: hotovo
        kdy: 2026-08-26
      - co: 'Kvalita fixu a rozptyl okna ve `MissionMsg` a v panelu'
        stav: hotovo
        kdy: 2026-08-26
      - co: 'Nastavit práh z naměřeného rozptylu na zařízení (vyčíst `spread=` z Kolo3a/3b)'
        stav: otevreno
