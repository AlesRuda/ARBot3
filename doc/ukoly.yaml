  - id: lok-korelace-mericidlo-chyba-fuze
    oblast: lokalizace
    nazev: Měřidlo poctivosti σ účtovalo korelátoru vlastní chybu fúze
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-25
    vyreseno: 2026-08-25
    popis: >
      Korelátor hlásí posun proti odhadu pózy, takže správná odpověď proti tuze posunuté mapě
      není konstantní posun mapy, ale posun mapy plus chyba fúze — a ten druhý člen (p50 0,105 m)
      v měřidle `ARBot.Analyze sigma` chyběl. Po jeho odečtení padly dvě vedené vady: „σ je
      1,28–1,43× optimistická" (zbylo 1,03–1,17× a přísnější `sd(z)` = 0,78–0,87 říká, že je
      naopak ~1,25× konzervativní) a „systematické vychýlení +0,10 m" (bylo to vychýlení fúze,
      hlášené správně). Aby se póza nedohledávala podle razítka (nepřežije seek), nese ji zpráva
      `MapCorrelationMsg` (verze 5); rozdíl obou cest je 0–4 mm, takže dřívější závěry platí.
      Konzervativní σ se vědomě neopravuje — zmenšit ji znamená zvětšit autoritu korelátoru
      proti GPS, což gatují tři podmínky. Čistě softwarové, ověřeno testy a pěti běhy v simulaci.
    kroky:
      - co: "Chyba fúze odečtena v `sigma`, metrika `sd(z)` místo poměru souhrnů"
        stav: hotovo
        kdy: 2026-08-25
      - co: "`MapCorrelationMsg` verze 5 s pózou, proti které se korelovalo"
        stav: hotovo
        kdy: 2026-08-25
