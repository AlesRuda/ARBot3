  - id: lok-bias-senzoru-jako-stav-ekf
    oblast: lokalizace
    nazev: Chyby senzorů (bias kompasu a gyra) jako stavy EKF
    druh: zamer
    stav: otevreno
    nalezeno: 2026-08-25
    popis: >
      Podnět autora: místo přidávání dalších referencí kurzu odhadovat bias kompasu a gyra přímo
      ve stavovém vektoru filtru — dvě nezávislé absolutní reference (kompas, GPS kurz) na to
      stačí, mapa není potřeba. Úkol byl 25. 8. gatovaný potvrzením, že skutečný VN100 nějaký
      bias vůbec má (ten 3° v simulaci vnutil člověk). To se potvrdilo v terénu 7. 9. (kurz
      o 24° vedle, po kalibraci magnetometru zbývá konstanta −3,7°). Zůstává cílem; 12. 9. se
      místo něj sáhlo po podlaze sigmy a škrcení kompasu, „na stav EKF teď není prostor".
      ✅ **Potvrzení z HW 18. 9. 2026:** s kalibrovaným magnetometrem má kompas proti GPS kurzu bias −2,5 / −1,6° (sd ~4°), na protilehlých kurzech stejný, ale mezi běhy jiný — tedy reálný, malý a pomalu proměnný bias, přesně případ pro stav EKF, ne pro konstantu v konfiguraci. Brána „potvrdit na reálném HW" je tím splněná.
    kroky:
