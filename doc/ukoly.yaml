  - id: lok-gps-kurz-do-fuze
    oblast: lokalizace
    nazev: Kurz z GPS jako druhá absolutní reference kurzu
    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-25
    vyreseno: 2026-08-25
    popis: >
      Přijímač GPS hlásí kurz nad zemí a reálné drivery ho plnily, ale fúze ho nepoužívala vůbec
      a virtuální GPS ho ani nevysílala. Od 25. 8. jde `GPS/heading` do fúze jako druhá reference
      kurzu vedle kompasu (sigma roste s klesající rychlostí, jízda vzad vyloučená) a virtuální GPS
      ho hlásí se šumem v příčné složce rychlosti. Nový rozbor `ARBot.Analyze heading` měří rozpor
      `IMU yaw − GPS kurz` i bez ground truth, takže běží nad záznamy ze zařízení — právě jím se
      pak 7. 9. našel kurz VN100 o 24° vedle. Samo to ale chybu kurzu nezmění, dokud si kompas
      věří tisíckrát víc. Od 12. 9. je změřeno, že chyba kurzu z GPS není bílý šum (poctivá sigma
      by byla 29–83°) a že GPS jede 10 Hz, ne 5 — model sigmy trefuje realitu spíš náhodou.
    kroky:
      - co: 'Virtuální GPS hlásí kurz nad zemí (šum v příčné rychlosti, 12° při 0,5 m/s, 3,7° při 3 m/s)'
        stav: hotovo
        kdy: 2026-08-25
      - co: "'Mapper bere `GPS/heading` do fúze (varianta A: druhá reference, žádné nové stavy)'"
        stav: hotovo
        kdy: 2026-08-25
      - co: '`ARBot.Analyze heading` i bez ground truth (`--nogt`), ověřeno proti známé odpovědi'
        stav: hotovo
        kdy: 2026-08-25
