  - id: mise-robotour-bez-operatora
    oblast: mise
    nazev: Mise Robotour běží bez operátora — potvrzování cíle zrušeno
    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-26
    vyreseno: 2026-09-19
    popis: >
      Úloha je simulace autonomního doručení: s robotem interagují jen odesílatel a odběratel,
      a to pouze QR kódem a stop tlačítkem. Potvrzovací tlačítko v panelu modelovalo někoho, kdo
      v úloze není, proto se zrušilo. Uvolnění stopu je od té doby plnohodnotný signál („vyloženo",
      nebo „člověk odešel" bez přečteného kódu); robot nikdy neodjede bez cíle a zamítnutý kód
      má viditelný důvod. Celý průchod misí autor proklikal v simulaci 27. 8.; na Robotouru
      19. 9. 2026 (Kolo3b) robot odjel depo → nakládka → vykládka bez operátora: kód v depu
      i na nakládce, uvolnění stopu po vykládce jako signál „vyloženo".
    kroky:
