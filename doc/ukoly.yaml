      - co: "Po opravě magnetometru snížit `assocfloorhdg` z 10° na ~5° (18. 9. změřeno, nezměněno)"
        stav: otevreno
      - co: "Ověřit na zařízení — 18. 9.: běží (χ² vítěze p50 0,004, nejednoznačných 3 z 3 147), ale trať je jediná OSM cesta, takže křižovatku to neotestovalo"
