    druh: zamer
    stav: hotovo
    nalezeno: 2026-09-13
    vyreseno: 2026-09-17
    popis: >
      Mise Track přichycovala místa na síť cest až ve chvíli, kdy na ně přišla řada — se seznamem,
      jehož druhé místo leží mimo síť, robot odjel na první a misi přerušil daleko od člověka.
      Teď se všechna místa přichytí a zkontrolují při odjezdu (ne už při volbě mise: tam bez pózy
      kontrola vracela nuly a tiše prošla i pro bod 372 m od cesty), `TrackMsg` verze 3 nese
      přichycené souřadnice a zóny na půdorysu se kreslí z nich, ne ze surových bodů. Autorem
      hlášený zásek po uvolnění nouzového zastavení se v simulaci nereprodukoval; reprodukoval
      se jiný — simulace nad velkou mapou (3 771 uzlů) vyčerpá CPU renderem virtuální kamery
      a stránka umlkne, takže simulace není měřítko výkonu robota. Na zařízení přichycení
      proběhlo 17. 9. (tři místa, největší odstup 2,1 m z limitu 50 m) a 18. 9. při dvou celých
      kolech. Hlášený zásek se 17. 9. reprodukoval na zařízení (týž příznak: stránka odpovídá,
      čas v ní neběží) a má vlastní témata `prov-zatuhnuti-za-behu-mise`
      a `prov-deadlock-mise-webstatus` — s přichycením nesouvisí.
