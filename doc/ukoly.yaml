  - id: nast-system-zprav-record-replay
    oblast: nastroje
    nazev: Systém zpráv, řídicí smyčka a záznam / přehrávání běhu (Run / View)
    druh: zamer
    stav: hotovo
    nalezeno: 2026-07-24
    vyreseno: 2026-07-28
    popis: >
      Páteř aplikace — pipeline `MessageSource` / `MessageTarget` s rolemi a odbočkami, řízení
      jako periodický uzel nad schedulerem (jede i při výpadku měření), jeden `Stream` v
      `ARBotRuntime` s režimy Run a View. Každá zpráva má verzi, obraz se zaznamenává jako
      `ImageMsg` bez komprese (~1,8 GB/min ze dvou D435, na NVMe hodiny), záznam je best-effort
      s indexem, přehrávání umí seek a navigaci po záznamech, UI dokumenty se aktualizují vzorem
      „latest-wins". Režim Simulate (přepočet nad záznamem) se vědomě odložil s háčkem
      `T_in` / `T_out` v záznamu. Při tom se našlo, že `.gitignore` tiše ignoroval zdrojovou
      složku `Logs/` s celým modelem zpráv. Záznamy z robota jsou od té doby hlavní pracovní
      nástroj projektu.
