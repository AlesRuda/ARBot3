  - id: lp-omega-dif-faktor-a-znamenko
    oblast: lokalni-planovani
    nazev: Robot by zatáčel dvakrát rychleji, než regulátor chce
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-12
    vyreseno: 2026-09-21
    popis: >
      Převod úhlové rychlosti na příkaz motorům bral `dif` jako rozdíl rychlostí kol, jenže
      driver ho k jednomu kolu přičítá a od druhého odečítá - je to offset na kolo, správně
      s polovinou rozchodu. Shodly se na tom tři nezávislé zdroje (předchozí generace robotu,
      profil pohybu, skript řadiče); dva existující testy starý faktor kódovaly. Znaménko rotace
      je jiná otázka a z kódu se rozhodnout nedá (asymetrická negace ve skriptu, záleží, které
      kolo je motor 1) - mělo se změřit na robotu malým `+ω` ve stoje. Samostatná zkouška
      nakonec nebyla potřeba: robot od 7. 9. 2026 opakovaně jezdí venku po dráze (FreeRun, Track,
      Robotour) a s otočeným znaménkem by zatáčel od dráhy místo k ní a regulátor by divergoval,
      takže znaménko je jízdou prokázané. Uzavřeno rozhodnutím autora 21. 9. 2026.
    kroky:
      - co: "Faktor 1/2 v `ControlLoop`, test `RotationSpeed_ToDif_IsHalfWheelBase`"
