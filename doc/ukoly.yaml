  - id: lp-koridor-trasy-jako-cena
    oblast: lokalni-planovani
    nazev: Koridor trasy jako měkká cena v lokálním A*
    druh: zamer
    stav: otevreno
    nalezeno: 2026-08-12
    popis: >
      Lokální plánovač dostane z trasy po síti cest jen jediný bod (mrkev), takže tvar cesty
      do ceny A* nevstupuje. Původní obava „robot sjede z cesty všude, kde je vedle geometricky
      volno" se 27. 8. 2026 ukázala lichá — cesty se drží sám díky sémantickému kanálu z vize
      (mimo cestu = blokováno) a ceně neznáma, a přibyly testy, které to přibíjejí. Otevřený
      zbytek je užší: kde vize okraj cesty nevidí, mapa se ho nezastane — měkká preference
      blízkosti osy cesty (šířka z `Node.Width`) by to doplnila. Nikdo to zatím nepotřeboval.
      Pomohlo by na široké zpevněné ploše (náměstí, parkoviště, cyklostezka ~5 m), při nízkém
      kontrastu okraje, mimo zorné pole a při výpadku kamery. ⚠️ **Podmínka (autor, 25. 9. 2026):
      nesahat na to před vyřešením driftu kurzu** (`lok-freerun-kurz-staci-na-zapad`) — cena se
      počítá v souřadnicích mapy, takže při ujeté póze (23. 9. kurz o desítky stupňů, 19. 9. skoky
      0,6–4 m) by táhla robota k ose, která leží jinde. I pak jen jako slabá preference, kterou
      vidění přebije tam, kde okraj vidí.
    kroky:
      - co: Ověřeno testy, že plán drží cestu díky sémantice a nebere zkratku přes neznámo
        stav: hotovo
        kdy: 2026-08-27
      - co: Měkká cena podle vzdálenosti od osy cesty v A* (jen kde vize okraj nevidí)
        stav: otevreno
