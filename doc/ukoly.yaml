  - id: hw-d435-vypadky-za-provozu
    oblast: hw
    nazev: Kamera D435 se za provozu odmlčí
    druh: vada
    stav: otevreno
    nalezeno: 2026-08-31
    popis: >
      Při prvním běhu aplikace na Pi se pravá D435 po ~4600 s odmlčela; odpojená nebyla, v jádře
      se opakovalo `USBDEVFS_CLEAR_HALT`. Rešerše 11. 9. ukázala, že je to cizí, Intelem
      nevyřešený problém, a naše léčba je to, k čemu dojdou všichni: hlídka zamrzlého streamu,
      zbourání pipeline a nové připojení, od 13. 9. supervizor zotavení s drženým zastavením —
      ověřený na robotu na skutečné poruše (obě kamery zpět za 29 s, dřív mrtvá kamera desítky
      minut). Je to obvaz, ne léčba: porucha přijde asi jednou za 17 minut. Hypotéza „může za to
      T265" padla 14. 9. měřením a `CLEAR_HALT` se ukázal jako šum, ne podpis poruchy; podezřelá je
      fyzická větev USB `2-1.3` (samostatné téma). Druhá epizoda 18. 9.: zamrzla barva pravé D435
      (15:47:17) a supervizor ji vrátil za 32 s, robot stál.
    kroky:
      - co: "'Rešerše: cizí nevyřešený problém, propustnost USB ani sousedé na hubu to nejsou'"
        stav: hotovo
        kdy: 2026-09-11
      - co: 'Supervizor zotavení kamer s drženým zastavením, ověřen na skutečné poruše'
        stav: hotovo
        kdy: 2026-09-13
      - co: 'Vyvrátit hypotézu T265 / `CLEAR_HALT` měřením na zařízení'
        stav: hotovo
        kdy: 2026-09-14
      - co: 'Odstranit příčinu (kabel nebo port větve 2-1.3)'
        stav: otevreno
