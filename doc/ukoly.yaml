  - id: lok-gps-kurz-korelovana-chyba
    oblast: lokalizace
    nazev: Chyba kurzu z GPS není bílý šum a GPS běží 10 Hz, ne 5
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-12
    popis: >
      Dotaz autora na původ σ kurzu z GPS vedl k měření: sousední fixy se liší jen o ~1°, ale chyba
      s odstupem roste a usadí se na 8,4° / 4,1° při dekorelačním čase 10 / 5 s. Filtr bere fixy jako
      nezávislé, takže počtivá σ je 83° / 29°; model `atan2(0,3; v)` dává 23°, tedy trefuje zhruba
      správně, ale ze špatného důvodu (příčný šum rychlosti je ve skutečnosti 0,007 m/s). Zároveň se
      opravilo, že GPS chodí 10 Hz — všechny přepočty byly dvakrát vedle, frekvence se teď měří. Důsledek
      pro kompas: jeho bias je korelovaný na stovky sekund, počtivá σ by byla ~1 200°, takže podlaha 5°
      je pořád řádově málo. Léčba (podlaha v desítkách stupňů, další škrcení, nebo bias jako stav EKF)
      není rozhodnutá. 18. 9. 2026 s kalibrovaným kompasem: velikost biasu je 1–3,5° a sd ~4°,
      takže 5° sedí na velikost chyby — „řádově málo" se týká jen její časové korelace, obě
      tvrzení platí zároveň.
    kroky:
      - co: "Korelace chyby GPS kurzu změřena (`ARBot.Analyze heading`)"
        stav: hotovo
        kdy: 2026-09-12
      - co: "Frekvence GPS se měří (`FixRateHz`), tři místa s natvrdo 5 Hz opravena"
        stav: hotovo
        kdy: 2026-09-12
      - co: Rozhodnout, jak σ obou referencí kurzu narovnat
        stav: otevreno
    odkazy:
      - text: ekf-fusion.md
        cesta: doc/ekf-fusion.md
    devlog: [2026-09-12, 2026-09-18]
    ceka_na: [lok-bias-senzoru-jako-stav-ekf]

  - id: hw-kurz-zbytek-konstanta
    oblast: hw
    nazev: Po kalibraci zbývá konstantní posun kurzu −3,7°, který nejde rozložit
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-12
    popis: >
      Po ověření kalibrace zůstal kurz VN100 proti GPS o −3,7° vedle. Není to železo (půlrozdíl mezi
      opačnými směry jen ∓1° a mezi běhy mění znaménko) ani deklinace (ta by rozpor zvětšila na −10°),
      a tímhle měřením se nedá rozložit na pootočení senzoru, zbytek kalibrace a šikmé jetí — na to je
      potřeba průjezd téhož úseku s robotem otočeným o 180°. Z živého senzoru se přitom zjistilo, že
      vestavěný model pole je zastaralý o ~1,9° (epocha ~2015), takže zbytek je ještě o tolik větší,
      a že registr 83 je ve flash, ačkoli se zapisuje bez uložení. Od 14. 9. byl kurz rozbitý železem
      od kabelů, takže měření mělo smysl opakovat až po nové kalibraci — ta proběhla 17. 9.
      18. 9. 2026 první jízda po nové kalibraci: rozpor `IMU − GPS kurz` je zase na obou protilehlých kurzech stejný (−3,6 / −2,9° a −1,65 / −1,22°), tedy konstanta — ale **mezi dvěma běhy 13 minut po sobě jiná** (−3,4 proti −1,1° středně). Sedí to s dotahováním VPE po každém startu procesu (registr 83, ~100–170 s); průjezd s robotem otočeným o 180° to pořád nerozloží, ale ukazuje to, že hledaná „konstanta" je spíš pomalá proměnná.
    kroky:
      - co: Zbytek změřen a rozložen podle směru a místa
        stav: hotovo
        kdy: 2026-09-12
      - co: Registry přečteny na živém senzoru (deklinace se aplikuje, model zastaralý)
        stav: hotovo
        kdy: 2026-09-12
      - co: Průjezd téhož úseku s robotem otočeným o 180°
        stav: otevreno
    odkazy:
