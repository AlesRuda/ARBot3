  - id: mise-freerun-pomala-mrkev-blizko
    oblast: mise
    nazev: FreeRun jede ~0,8 m/s při povolených 1,7 — plán končí v mrkvi 1,5 m před robotem a regulátor k ní brzdí
    druh: vada
    stav: v-kodu
    vyreseno: 2026-09-25
    nalezeno: 2026-09-25
    popis: >
      Pozorování autora z FreeRun 25. 9. 2026 (`records/test/20260925-144658.rec`, 23 min, Modřany):
      robot jede výrazně pomaleji, než je `maxspeed=1.7`. Potvrzeno měřením: příkaz p50 **0,81 m/s**,
      rychlost fúze 0,78 m/s. Mrkev leží vždy `freerunlook=` = **1,5 m** před robotem a plán končí
      v ní; plánovač bere konec dráhy jako hranici potvrzeně sjízdného (`BuildWayPoints`: frontier se
      inicializuje na konec dráhy, poslední uzel má strop 0), takže obálka `VBrake` váže 97,4 %
      plánů na `√(2·0,5·1,5)` = **1,22 m/s**. Regulátor z toho udělá ještě méně: `Dist2Speed`
      k poslednímu uzlu (diskrétní profil s rezervou 0,9) dá p50 0,855 m/s, a vazba dopředné rychlosti
      na dobu rotace `d/(4·T_rot)` má ve jmenovateli tutéž krátkou vzdálenost, takže srazí rychlost
      v 35 % taktů (p50 o 0,17 m/s). Protifakticky bez brzdění na konci plánu by příkaz byl p50 0,90,
      p90 1,35 m/s. Pro srovnání Track téhož dne (`20260925-143643.rec`): mrkev ~5,6 m, příkaz p50
      **1,70 m/s**, vazba na rotaci jen v 11 % taktů. Měří `ARBot.Analyze drive` (rekonstrukce
      `PathResult.Control` sedí na záznam v 99,9 % taktů) a `envelope`. Ve FreeRun navíc vznikl
      oboustranný koridor jen ve 3 % cyklů, zbytek jel „rovně“ (`lok-koridor-siroka-cyklostezka`).
    kroky:
      - co: "Změřeno: obálka `VBrake` k mrkvi 1,5 m + `Dist2Speed` k poslednímu uzlu + vazba na rotaci přes krátkou vzdálenost (`ARBot.Analyze drive`, `envelope`)"
        stav: hotovo
        kdy: 2026-09-25
      - co: "Léčba (autor): `freerunlook=3` v `config/pi-provoz.cfg` (strop obálky ~1,73 m/s, ale pevný bod `Compute` při 3 m je ~1,3 m/s — viz `lp-regulator-kmitani-rotace`); prodloužení hranice potvrzeného za průjezdní mrkev v kódu zatím ne"
        stav: hotovo
        kdy: 2026-09-25
      - co: "Jízda FreeRun s léčbou: `drive` / `envelope` / `localplan` nad záznamem"
        stav: otevreno
