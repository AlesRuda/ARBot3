  - id: hw-vn100-vpe-tahne-za-polem
    oblast: hw
    nazev: Kurz ze senzoru se táhne za vlastním magnetometrem minuty
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-07
    vyreseno: 2026-09-18
    popis: >
      Zesílení zpětné vazby od magnetometru vyšlo `K` = 0,0049 1/s, tedy časová konstanta 206 s:
      po zatáčce je yaw desítky stupňů vedle i proti svému vlastnímu poli. Původní závěr „to
      kalibrace neopraví" byl 10. 9. podle manuálu VN označen za nepodložený a 12. 9. se po
      kalibraci konstanta zkrátila na 53 s — z většiny to tedy bylo nezkalibrované železo.
      Ze 14. 9. je ale zpátky a horší (345 s), protože na robotu přibylo nové železo. Je to
      v senzoru; nastavení nejistot ve fúzi na to nesahá.
      ✅ **Uzavřeno 18. 9. 2026:** po nové kalibraci τ 28–53 s ve dvou jízdách (12. 9. 53 s, 14. 9. s rozbitým železem 345 s, původně 206 s). Dlouhá konstanta byla důsledek nezkalibrovaného železa; zbylých ~30–50 s je vlastnost VPE (registr 35 má zapnuté adaptivní filtrování) a fúzi nevadí — mezi odečty kompasu nese kurz gyro.
    kroky:
      - co: Změřit `K` ze záznamu (blok 2 `ARBot.Analyze vn100`)
        stav: hotovo
        kdy: 2026-09-07
      - co: Přeměřit po kalibraci (206 → 53 s)
        stav: hotovo
        kdy: 2026-09-12
      - co: "Přeměřit po nové kalibraci — 18. 9.: `K` 0,036 / 0,019 1/s (τ 28 / 53 s) ve dvou jízdách, tedy jako 12. 9.; se špatným železem 14. 9. bylo 345 s"
        stav: hotovo
        kdy: 2026-09-18
