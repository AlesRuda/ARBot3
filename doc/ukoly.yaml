  - id: mise-qr-cteni
    oblast: mise
    nazev: Čtení QR kódů z kamery (ZXing.Net místo ZBaru)
    druh: zamer
    stav: hotovo
    nalezeno: 2026-08-26
    vyreseno: 2026-09-19
    popis: >
      Cíl mise Robotour zadává člověk QR kódem. Dekodér je čistě managed ZXing.Net — binding
      ZBaru z ARBot2 nebyl k dispozici, a tím celá plánovaná fáze „nativní libzbar na obě
      platformy" zmizela. Skener je samostatný stupeň, který mise zapíná jen pod drženým stopem;
      převod na šedou se zobecnil na `Image<T>.ToGray`. Aby šel průchod misí projít v simulaci,
      umí virtuální kamera postavit svislou desku s kódem (jen do barvy, ne do hloubky). Z 1,2 m
      se kód nepřečetl, staví se na 1,0 m. Testy dokazují cestu, ne čitelnost, protože kód
      kóduje týž ZXing. Na skutečném stanovišti se četlo poprvé na Robotouru 19. 9. 2026 — až
      po opravě jména kamery (`mise-qr-jmeno-kamery`): `20260919-100414.rec` 2 `QrCodeMsg`
      a kód přijat, `-101057` 535, `-101903` 195, kódy z mobilu, notebooku i papíru; offline
      živý dekodér čte 725 z 3 957 snímků. Doba dekódování se neměří (`QrScanner` čas nebere,
      `QrCodeMsg` ho nenese) — pod drženým stopem je z velké části mimo hru.
    kroky:
      - co: '`QrScanner` + `QrCodeMsg`, dekodér ZXing.Net, převod BGR32 → Y800'
        stav: hotovo
        kdy: 2026-08-26
      - co: 'QR kód do virtuální kamery (`SyntheticBillboard`), test scéna → render → dekodér'
        stav: hotovo
        kdy: 2026-08-26
      - co: 'Deska kolmo na pohled kamery a na 1,0 m (z 1,2 m se nepřečte)'
        stav: hotovo
        kdy: 2026-08-27
      - co: 'Úspěšnost čtení na skutečném stanovišti (Orange Pi, D435) — Robotour 19. 9.: kód čten a přijat v každém kole'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Doba dekódování na Orange Pi — škrtnuto rozhodnutím autora 21. 9. (pod drženým stopem nerozhoduje)'
        stav: hotovo
        kdy: 2026-09-21
