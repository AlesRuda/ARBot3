  - id: lp-robot-se-plazi-vyhlazovani
    oblast: lokalni-planovani
    nazev: Robot se venku plazil rychlostí 0,05 m/s — může za to vyhlazování dráhy
    druh: vada
    stav: hotovo
    nalezeno: 2026-09-07
    vyreseno: 2026-09-18
    popis: >
      Rozbor venkovní jízdy (`ARBot.Analyze envelope`, rozpad po uzlech): medián příkazované
      rychlosti 0,05 m/s a v 53 % plánů je na podlaze už první uzel; váže odstup od překážky
      přesně na `SafeDist`, brzdná obálka skoro nikdy — padla hypotéza „plazí se skrz neověřený
      prostor". Cesta je přitom široká (3,8 m). Příčina: vyhlazení dráhy přijme zkratku podle
      tvrdého `d ≥ SafeDist` a zahodí odstup, který A* koupil cenou. Léčba `smooth=time`: zkratka
      se přijme, jen když se pod obálku vejde rampa, kterou regulátor odjede, a nezhorší jízdní
      čas; strop uzlu je obálka v uzlu. Brzdný zákon se sjednotil do `IMotionProfile.Dist2MaxSpeed`
      a opravil se vadný `Speed2Dist`. Na realistické scéně rychlost 0,05 → 0,49 m/s. Přeměření
      na HW čekalo na opravu kurzu.
      ✅ **18. 9. 2026 přeměřeno venku s dobrým kurzem:** robot za jízdy neleze — plány na podlaze už v prvním uzlu **1 %** proti 53 % ze 7. 9., příkazovaná rychlost p50 1,0 m/s (`ARBot.Analyze localplan`, `envelope`). Na podlaze zůstává jen stání u překážky (`lp-zasek-v-blokovane-mape`).
