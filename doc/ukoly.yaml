      `ARBot.Analyze cameras`. Regrese z téhož dne (hlídka četla razítko z už uvolněného framu
      a shodila každý grab) se našla náhodou v journalu a opravila; s opravou na robotu 0 chyb.
      Že se kamera restartem probere, ukázalo až zotavení kamer z 13. 9.
    kroky:
