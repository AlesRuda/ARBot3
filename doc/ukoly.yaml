  - id: lp-klin-mezi-zornymi-poli
    oblast: lokalni-planovani
    nazev: Klín mezi zornými poli barevných kamer brzdí robota
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-13
    vyreseno: 2026-09-13
    popis: >
      Barva D435 má při 640×480 jen 55° zorného pole a kamery jsou pootočené o ±29,3°, takže
      přímo před robotem zbývá mezera 3,7° (0,19 m ve 3 m), kde hloubka vidí, ale barva ne —
      buňka tam zůstává neznámá a rychlostní obálka na ni brzdí. Nad záznamem z 12. 9. byl klín
      příčinou 72,6 % zastavení paprsku a robot byl pod 0,6 m/s ve 40,5 % vzorků (proti 3,3 % bez
      semantiky); první měření nad jiným záznamem dalo jen 20 %, dva běhy téhož robota se liší
      čtyřnásobně. Léčba `WedgeFiller` (`wedgefill=`, výchozí 6°) buňku doplní interpolací
      z buněk příčně vlevo a vpravo, ne konstantou „sjízdné“; pětkrát ji vypnula vlastní
      opatrnost a pokaždé to našlo až měření. Vrátí asi pětinu ztráty (40,5 → 33,9 %), zbytek je
      řetěz dalších děr — hlavní brzda je dosah a hustota hloubky.
    kroky:
      - co: Měřidlo `ARBot.Analyze wedge` (zorná pole z intrinsik, rozpad příčin, simulace léčby)
        stav: hotovo
        kdy: 2026-09-13
      - co: "`WedgeFiller` se čtyřmi pojistkami a pěti opravami z měření"
        stav: hotovo
        kdy: 2026-09-13
      - co: Přeměřit nad více záznamy (dva běhy se liší 4×)
        stav: otevreno
      - co: Dopad ceny neznámých buněk (`UnknownCostFactor`) na tvar dráhy — neměřený
        stav: otevreno
      - co: "Běh na zařízení — od 18. 9. (binárka s `bc08c06` nese i `WedgeFiller`, profil `wedgefill=` nepřepisuje, platí 6°); účinek nezměřen, `ARBot.Analyze wedge` nad `20260918-*` neběžel"
        stav: hotovo
        kdy: 2026-09-18
