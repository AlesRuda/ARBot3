  - id: nast-kamery-simulace-sum-71-procent
    oblast: nastroje
    nazev: Virtuální kamery jely 6,8 Hz místo 30, protože 71 % času generovaly šum
    druh: vada
    stav: hotovo
    nalezeno: 2026-08-23
    vyreseno: 2026-08-23
    popis: >
      Jeden snímek stál 93 ms, z toho 66 ms šum: `DeterministicNoise.Gaussian` počítal
      Box–Mullera ze dvou hashů (38 ns na vzorek) a barevný šum se volal třikrát na pixel.
      Nahrazeno kvantilovou tabulkou (jeden hash + čtení z pole, 4096 položek kvůli L1):
      7 ns na vzorek, snímek 51 ms, kamery 10 Hz; na hranové lokalizaci `NoPair` 20 → 1 a chyba
      polohy 0,046 → 0,036 m. Starší záznamy mají jinou realizaci téhož šumu. Ani 10 Hz ale není
      30 — render bez šumu stojí 27 ms a paralelizace po řádcích by na Orange Pi brala výkon
      řídicí smyčce; vědomě neřešeno.
    kroky:
      - co: "Kvantilová tabulka místo Box–Mullera (`Gaussian` 38 → 7 ns)"
        stav: hotovo
        kdy: 2026-08-23
    odkazy:
