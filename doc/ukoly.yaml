    popis: >
      V 11minutovém záznamu měla pravá kamera jeden různý barevný obraz ze sta, hloubka jela;
      snímky chodily 10 Hz, stránka svítila zeleně a occupancy grid i mise běžely nad nehybnou
      fotkou. Vada je v librealsense/USB (stojí i razítko), naše kopie je v pořádku. Léčba:
