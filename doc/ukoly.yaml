  - id: mise-robotour-mapa-ostrov
    oblast: mise
    nazev: Kód se četl a mise ho zamítala „nevede trasa“ — robot stál na náměstí spojeném se sítí jen schody
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-19
    vyreseno: 2026-09-19
    popis: >
      Na soutěži 19. 9. 2026 (`20260919-101057.rec`, `-101903.rec`) se QR kód četl (535 a 195
      `QrCodeMsg`), ale mise ho pokaždé zamítla hláškou „na cíl nevede po síti žádná trasa (je mimo
      mapu?)“ — a stránka náhledu dál psala „čeká se na QR kód“, takže obsluha myslela, že se
      kód nečte. Cíl `50.1038082,14.4240751` je přitom přesně uzel mapy na živé `footway`. Rozbor
      proti `MapMsg` a `GlobalNavMsg` ze záznamu: síť `Robotour2026-ver1.osm` má pod profilem Robot
      2 komponenty souvislosti; ostrov je jediná cesta 956523901 (`highway=pedestrian` + `area=yes`,
      dlážděné náměstí, 40 uzlů, 139 m) spojená se sítí jen `highway=steps` (uzly 8852424426
      a 8852424425, 0,9 m od sebe) — a schody profil Robot nepouští. Robot při zamítnutí stál
      3–4 m od uzlu ostrova. `Probe` odpověděl podle grafu správně, ale hláška posílala člověka
      hledat chybu jinam a stránka ji neukázala. V 10:04 týž kód projel, protože robot stál o 50 m
      dál na chodníku. Léčba v kódu: řádky „QR kódy“ a „kód ZAMÍTNUT“ na stránce, hláška „z místa,
      kde robot stojí … síť rozpojená“, nový `ARBot.Analyze route` a blok 1c v `mission`. Ostrov je
      podle autora skutečný (robot tam nevyjede, GPS ho tam jen posadila), takže se neopravuje mapa,
      ale načtení: `mapprune=` (výchozí true, `NetworkIslands`) zahodí všechny komponenty kromě té
      s největší délkou cest v metrech (ne podle počtu uzlů, ne podle toho, kde robot stojí — právě
      ta póza je z chybné GPS). Offline z pózy na náměstí se póza přichytí na chodník 2,4 m vedle
      a cíl je dosažitelný (393 m). Co se zahodilo, jde do Trace; `mapprune=false` vrátí síť.
      Nasazeno před 2. kolem (11:37): robot startoval ze servisní zóny, kde se v 10:11 a 10:19
      kódy zamítaly, a kód přečetl a přijal — stejně ve 3. a 4. kole. Je to nepřímý důkaz, že
      `mapprune` na zařízení účinkoval; Trace „ZAHOZENO 1" z `Kolo2.rec` nikdo nevyčetl a GPS
      mohla robota posadit jinam. Zobrazení zamítnutí na stránce ověřit nešlo — po nasazení
      žádné zamítnutí nenastalo.
    kroky:
      - co: 'Rozbor `ARBot.Analyze route` (komponenty, cesty ostrova, nejbližší dvojice uzlů) a blok 1c v `mission`'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Stránka náhledu ukazuje počet přečtených/zamítnutých kódů a důvod zamítnutí'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Hláška zamítnutí říká, že trasa nevede z místa, kde robot stojí, a že síť může být rozpojená'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Ostrovy sítě zahodit při načtení mapy (`mapprune=`, `NetworkIslands`, 5 testů); `route` z náměstí: dosažitelné 393 m'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Přijetí kódu z náměstí po nasazení — 2., 3. a 4. kolo kód přijat ze servisní zóny (Trace „ZAHOZENO 1“ v `Kolo2.rec` nevyčteno)'
        stav: hotovo
        kdy: 2026-09-19
      - co: 'Zobrazení zamítnutí na stránce na robotu (po nasazení žádné zamítnutí nenastalo)'
        stav: otevreno
