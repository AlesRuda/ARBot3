  - id: lok-mapcorr-tvrdy-gate
    oblast: lokalizace
    nazev: Tvrdý gate korekcí z mapy zahazoval právě ty korekce, které byly potřeba
    druh: vada
    stav: v-kodu
    nalezeno: 2026-08-25
    vyreseno: 2026-08-25
    popis: >
      Korekce polohy z korelace occupancy gridu s mapou se poprvé pustily naostro a změřily
      (`ARBot.Analyze corrections`): s tvrdým gatem byl výsledek horší, než když se nekorigovalo
      vůbec (příčná chyba p50 0,67 → 0,85 m), protože gate zamítal 42–46 % korekcí podle
      velikosti innovace — tedy přesně ty velké, které měly chybu stáhnout. Korelátor přitom
      hlásil správně. Měkký gate (`GateMode.Soft`) je od té doby výchozí (0,59 m), `mapcorrgate=reject`
      vrací staré chování. Zisk je ale jen 6–13 %, dokud kurz drží kompas; celá korelace je navíc
      ve výchozím stavu vypnutá (`mapcorr=false`), takže na zařízení nikdy neběžela.
    kroky:
      - co: 'Přístroj `ARBot.Analyze corrections` (krok pózy, gating, NIS podle zdroje, chyba proti pravdě)'
        stav: hotovo
