  # ---------------------------------------------------------------- 2026-09-17
  - id: prov-zatuhnuti-za-behu-mise
    oblast: provoz
    nazev: Runtime zatuhl 4 s po odjezdu mise Track a hlídač ho nechytil
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-17
    popis: >
      Runtime naběhl, senzory i řídicí smyčka běžely, v 16:12:38 obsluha uvolnila nouzové
      zastavení, mise Track odjela (přichytila 3 místa, cíl 1/3, trasa 50 m) — a do 20 ms po
      té hlášce přestaly proudit všechny zprávy najednou: IMU v 4,074 s záznamu, motory 4,078,
      GPS 4,068, obě kamery, řídicí smyčka i koridor. Dál žilo jediné vlákno — dotazování
      odpojené T265, jehož hlášky tekly do záznamu ještě 140 s. Stránka podle obsluhy
      odpovídala, ale čas v ní neběžel, což s tím sedí: web i zapisovač záznamu byli naživu,
      produkce dat ne.
      Zásek NENÍ v ovladačích, a je to změřené: vlákno T265 je taky `SensorBase` a běželo dál.
      Jediné, čím se od ostatních liší, je, že nic nepublikuje (dotaz vždy selže a jen loguje) —
      všechna vlákna, která publikují, stojí. `Info` z `TraceInfoBridge` jde přímo na `Stream`,
      kdežto měření jdou navíc přes `RoleRouter` do `processing` (`RelaySource`, fan-out na
      vlákně producenta), a právě ta větev je společná všemu, co umlklo. Konkrétní blokující
      odběratel ze statického čtení vidět není (stupně mají vlastní frontu `DropOldest`,
      `RecordingTarget` je `DropNewest`, takže žádný `Post` blokovat nemá), takže dál se
      pohne až ze zásobníků vláken.
      `HangWatchdog` nevystřelil, protože hlídá jen `Start(Mode.Run)` — ten skončil o 4 s dřív
      a token byl zahozen. Minidump proto neexistuje a jediný důkaz je záznam.
      ⚠️ **Není to totéž co zásek o devět minut později** (16:21, `prov-deadlock-mise-webstatus`),
      ačkoli spouštěč je stejný (volba mise `track` ze stránky). Ten je deadlock mezi zámky
      `TrackMission` a `WebStatus`, oba na fan-outu do `Stream` — jenže kdyby byl držený zámek
      `WebStatus`, zastavil by se i most `Trace → Info`, protože `WebStatus` je na `Stream`
      připojený jako PRVNÍ (v `ARBot.Headless/Program.cs`, mimo `connections`, tedy před
      záznamem). A `Info` teklo dál 140 s. Tenhle zásek je tedy na větvi `processing`, ne na
      `Stream`, a zůstává neurčený. V ~10 bězích 18.–19. 9. (dva Tracky, Robotour) se
      neopakoval; příčina tím určená není.
    kroky:
