      - co: Změřena latence korekce proti oknu (Debug vs. Release)
        stav: hotovo
        kdy: 2026-08-20
      - co: Počítadlo `DroppedTooOld` a hláška přes `Trace` s typem, hodnotou a zpožděním
        stav: hotovo
