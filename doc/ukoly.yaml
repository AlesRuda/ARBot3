    druh: vada
    stav: hotovo
    nalezeno: 2026-08-31
    vyreseno: 2026-09-01
    popis: >
      První běh aplikace na Pi: kamera hlásila 0,3 Hz, ale snímky přibývaly desítkami za sekundu,
      a čas snímku v overlayi byl po pěti minutách o osm hodin napřed. `TimeBase.Now` sčítalo surové
      tiky `Stopwatch` (na Linux/ARM64 1 GHz) s tiky `DateTime` (100 ns); na Windows je frekvence
      shodou okolností 10 MHz, takže se to nikdy neprojevilo. Z `TimeBase` se razítkuje na 45
      místech, takže `dt` mezi měřeními bylo 100× větší — záznamy z Pi před opravou nejsou
      použitelné. Motor kvůli tomu „blikal napětím" (rozpočet 500 ms byl reálně 5 ms). Opraveno,
      změřeno na zařízení izolovaně a 1. 9. potvrzeno v běžící aplikaci. Následně se čas v celé
      aplikaci sjednotil na `TimeBase` (pravidlo v CLAUDE.md).
