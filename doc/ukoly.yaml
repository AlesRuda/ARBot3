  - id: hw-vetev-usb-2-1-3
    oblast: hw
    nazev: Tvrdé záseky kamer na větvi USB `2-1.3`
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-13
    popis: >
      Dvanáct z dvanácti tvrdých záseků kamery RealSense přišlo na témž fyzickém USB portu, ať na
      něm visela kterákoli kamera (13. 9. se schválně prohodily; přiřazení portu ke kameře je
      změřené přes `CLEAR_HALT` během výpadku). Hypotéza „může za to T265“ padla měřením 14. 9.:
      bez ní se `CLEAR_HALT` (7,4 → 7,1–7,9/min) ani zamrzání streamu (3,4 → 3,6–4,2/h)
      nezměnily — a `CLEAR_HALT` teče 3–15/min i ve zdravém stavu, takže jako měřidlo je mrtvý.
      Další krok je kabel nebo port, ne software: autor 14. 9. večer přesadil kameru na volný
      port téhož hubu (testuje větev, ne hub ani řadič); vyhodnocení v DevLogu zatím není —
      a nula záseků za hodinu nic neznamená, za 3 h čistého běhu už ano. 18. 9. 15:47 přišel
      tvrdý zásek pravé D435 — té přesazené (supervizor zasahuje až po 15 selhaných dotazech,
      tedy táž třída jako 12 z 12 na `2-1.3`): buď zásek putuje s kamerou nebo kabelem, ne
      s portem, nebo je nový port na téže větvi. Port pravé kamery od 14. 9. zapsaný není
      (13. a 17. 9. se navíc hýbalo kabely kvůli magnetometru).
