  - id: nav-phi-obracena-hrana
    oblast: navigace
    nazev: φ při jízdě po trase rostlo o 1 s/m — detektor „bez postupu“ penalizoval a uzavíral správné cesty
    druh: vada
    stav: v-kodu
    nalezeno: 2026-09-20
    vyreseno: 2026-09-20
    popis: >
      Robotour 19. 9. 2026: autor viděl, že robot „po prvním odbočení zamítl pěknou cestu
      a přeplánoval“ a ve 4. kole „postupně uzavřel všechny cesty“, až uvázl v úzké pěšince.
      Rozbor (`ARBot.Analyze nav`, Kolo3b a Kolo4): 16 resp. 9 penalizací/uzavření, u 20 z 25
      pokles φ za 20 m dráhy −11 … −20 s (φ ROSTLO) při lokálním plánu Ok a jízdě ~1 m/s po trase;
      časová řada `--phi=` ukazuje +0,2 s každých 0,2 s a skok dolů na hranici hrany. Příčina:
      `GlobalNavigator.ComputePhi` bralo `1 − t` s parametrem z hrany, kterou vrátil `NearestNode`,
      ale `fix.CurrentEdge` z `Navigator.Update` byla její obrácená orientace (trasa proti pořadí
      vložení hrany — u obousměrné cesty zhruba polovina případů), kde zbývá `t`. Detektor B pak po
      každých 20 m správné jízdy hranu penalizoval ×5 a trasa se přeplánovala kolem (14:30:14
      φ 350 → 433, trasa 354 → 331 m; 14:31:54 299 → 536 m); ve 4. kole sedm poplachů za sebou
      zavedlo trasu do pěšinky (way 229966997), kde robot uvázl (GoalBlocked 94 s) a detektor A
      uzavřel i tu. Uzavření ani penalizace se přitom nikam nelogovaly — jediná stopa byl
      `ClosureCount`. Opraveno: `ComputePhi` rozliší orientaci přes `FindReverse`, regresní test jede
      po téže silnici oběma směry (φ monotónně klesá, nic se neuzavře), uzavření/penalizace jdou do
      Trace. Mimochodem změřeno: okno detektoru B počítá dráhu ze součtu kroků pózy, takže jitter
      a skoky se berou jako jízda (Kolo3b 15,6 m z 830 m) — neřešeno.
    kroky:
      - co: 'Rozbor `ARBot.Analyze nav` (skoky pózy, stavy plánu, uzavírání s odhadem detektoru, `--phi=`)'
        stav: hotovo
        kdy: 2026-09-20
      - co: 'Oprava `ComputePhi` (orientace hrany) + test oběma směry; Trace pro `CloseEdge`/`PenalizeEdge`'
        stav: hotovo
        kdy: 2026-09-20
      - co: 'Ověřit na robotu: jízda po trase s odbočkami bez penalizace (Trace „PENALIZACE“/„UZAVRENI“ v záznamu prázdné, φ klesá)'
        stav: otevreno
      - co: 'Dráha v okně detektoru B ze součtu kroků pózy — jitter a skoky se počítají jako jízda (rozhodnout, zda filtrovat)'
        stav: otevreno
    odkazy:
      - text: global-navigation-runtime.md
        cesta: doc/global-navigation-runtime.md
    devlog: [2026-09-20]
    ceka_na: []

  - id: lok-koridor-skoky-pozy
    oblast: lokalizace
    nazev: Skoky pózy 0,6–4 m na rovných úsecích přicházejí všechny hned po přijatém měření koridoru
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-20
    popis: >
      Robotour 19. 9. 2026 (Kolo3b, Kolo4): 14 z 14 a 9 z 9 skoků pózy (posun mezi RobotStateMsg
      o 0,6–4 m nad `|v|·dt`) přišlo do 0,1 s po přijatém měření `Corridor`, často v sériích jedním
      směrem (14:25:05–07 čtyři skoky −59° o 5,8 m; 15:42:32–34 pět skoků o 4 m) — koridor táhl
      pózu k jiné hraně nebo poloze, ne šum. Koridor byl přijat 1 404 z 1 404 (0 % zamítnuto, NIS
      p90 3,1, max 443): `GateMode.Soft` nezahodí nic, jen odtlumí, a `corridorstd=0,1` /
      `corridorhz=2` z 18. 9. tomu nezabránily. Po skoku typicky `EscapingBlocked` (robot je
      najednou v blokované části gridu). Ve FreeRun (Kolo3-navrat) 3 skoky, všechny také za
      koridorem. Měří to blok 1 `ARBot.Analyze nav`. Léčba je od 21. 9. v kódu: rychlostní
      limit kroku uvnitř filtru (`corridorslew=` m/s, `corridorheadingslew=` °/s, výchozí 0
      = dnešní chování); hodnota vybraná týž den večer z Kola 3b/4 (`ARBot.Analyze corridorstd
      --slew= --hslew=`): `corridorslew=0.5`, `corridorheadingslew=3` v `pi-provoz.cfg`.
      „−59°" u skoků je směr posunu, ne otočení — korekce kurzu z koridoru jsou max 2°, limit
      kurzu je pojistka. Na zařízení neběželo.
    kroky:
      - co: 'Změřit: skoky pózy vs. přijatá měření koridoru (blok 1 `nav`)'
        stav: hotovo
        kdy: 2026-09-20
      - co: 'Proměřit `corridorstd=` protifaktickým 1-D replayem (`ARBot.Analyze corridorstd`): 0,5–1,0 m odstraní kroky > 0,3 m (21 → 1 → 0 v Kolo3b), 5 m nepřidá nic a srazí informaci koridoru na 6× GPS; cena je pomalejší stažení driftu (odchylka p50 0,8–1,3 m, p90 2,4–2,6 m); inovace p50 0,06 m, ale 36 nad 2 m v sériích na téže hraně (změna hrany jen 6 ze 78); koridor za jízdu stáhl 20–28 m driftu'
        stav: hotovo
        kdy: 2026-09-20
      - co: 'Rozhodnout léčbu: rychlostní limit korekce (autor souhlasí s principem; návrh `PoseSlew` na výstupu fúze 20. 9. zamítl kvůli dvěma pózám v systému — varianta uvnitř filtru se má nejdřív probrat), nebo `corridorstd` 0,5–1,0 v profilu'
        stav: hotovo
        kdy: 2026-09-21
      - co: 'Mechanismus v kódu: `IMeasurement.MaxStep` + nafouknutí R v `Ekf.UpdateStep` (krok = přesně limit, P konzistentní, měření se nezahazuje), `corridorslew=` [m/s] a `corridorheadingslew=` [°/s] s Δt od předchozího odeslání (0,02–1 s), `MeasurementDiagMsg` v3 (`RInflation`, `StepLimited`), `ARBot.Analyze corridorstd --slew=` (blok 4), blok „limit kroku" v `ARBot.Analyze corrections`; výchozí 0 = dnešní chování; 16 testů; řetěz ověřen 45s simulací (`StepLimited` v záznamu, blok 4 stropuje krok přesně na limit)'
        stav: hotovo
        kdy: 2026-09-21
      - co: 'Zvolit hodnotu z dat: `ARBot.Analyze corridorstd Kolo3b.rec / Kolo4.rec --slew= --hslew=` (blok 4 příčně, nový blok 4b kurz): `corridorslew=0.5` = největší hodnota, při které v obou záznamech nezbyde kalibrovaný krok nad 0,3 m (bez limitu 21 / 16, 1,0 m/s nechá v Kole 4 23 kroků do 0,46 m), cena p50 odchylky 0,21 / 0,19 m (0,3 m/s by dalo 0,37 / 0,77 m); `corridorheadingslew=3` jen pojistka — korekce kurzu z koridoru max 2,0 / 0,6° (K p50 0,07), replay bez rozdílu; zapsáno do `config/pi-provoz.cfg`'
        stav: hotovo
        kdy: 2026-09-21
      - co: 'Měřidlo: `K_eff` v `corridorstd` je z okna 50 ms po měření a krok PODCEŇUJE — skok 14:25:05 (inovace 6,13 m, K·ν 5,83 m) je v `nav` bloku 1 vidět jako čtyři dílčí skoky 2,47 + 1,64 + 1,06 + 0,64 = 5,81 m za 1,6 s, fúze krok rozkládá, ne tlumí; přeměřit kalibraci přes delší okno (pořadí variant to nemění, jen výši ceny)'
        stav: otevreno
      - co: 'Ověřit na zařízení: jízda s limitem, `MeasurementDiagMsg.StepLimited` v záznamu, žádný skok > 0,5 m po měření koridoru (`ARBot.Analyze nav`)'
        stav: otevreno
    odkazy:
      - text: global-navigation-runtime.md
        cesta: doc/global-navigation-runtime.md
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
      - text: rozhodnutí 21. 9.
        cesta: doc/decisions.md
    devlog: [2026-09-20, 2026-09-21]
    ceka_na: []

  - id: lok-skok-pozy-nedetekce
    oblast: lokalizace
    nazev: PoseJumpDetector skok pózy nehlásí, když přijde na snímek s časem pozadu
    druh: vada
    stav: otevreno
    nalezeno: 2026-09-21
    popis: >
      Autor z náhledu webu a z měření ví, že při skocích pózy 0,6–4 m z Robotouru 19. 9.
      (`lok-koridor-skoky-pozy`) `PoseJumpDetector` grid **nesmazal** — robot se skokem ocitl mimo
      sjízdnou oblast staré mapy a přešel do úniku. V kódu je díra, která to vysvětluje:
      `PoseJumpDetector.Check` při `dt ≤ 0` pózu jen zapamatuje a skok nekontroluje (komentář:
      „snímky dvou kamer mají jiné časy grabu a mohou přijít přehozené"). Se dvěma D435 po 30 fps
      chodí snímky s přehozenými razítky běžně, takže skok, který přijde právě na takový snímek, se
      spolkne a další snímek se už porovnává s pózou po skoku. Ověřeno jen čtením kódu, ne nad
      záznamem (není na vývojovém stroji). Neopravuje se hned: s limitem kroku
      (`corridorslew=`) detektor chránit nemusí, a oprava (porovnávat i při `dt ≤ 0`, nebo
      nepřepisovat pamatovanou pózu) chce nejdřív změřit podíl snímků s `dt ≤ 0` a četnost skoků,
      aby nevyrobila bezdůvodná mazání gridu.
    kroky:
      - co: 'Změřit nad Kolo3b/Kolo4: podíl volání `Process` s `dt ≤ 0` a kolik skoků z bloku 1 `nav` připadlo na takový snímek'
        stav: otevreno
      - co: 'Opravit `Check` (kontrola posunu i při `dt ≤ 0`, bez `explained`) a přeměřit počet mazání gridu'
        stav: otevreno
    odkazy:
      - text: PoseJumpDetector.cs
        cesta: Src/ARBot.Common/Occupancy/PoseJumpDetector.cs
      - text: map-correlation-localization.md
        cesta: doc/map-correlation-localization.md
    devlog: [2026-09-21]
    ceka_na: []

